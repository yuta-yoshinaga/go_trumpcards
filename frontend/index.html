<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        try {
          // Path-style deep links (e.g. /hearts) reach this page via the SPA
          // fallback, but HashRouter only inspects the hash — so they would
          // silently render the default route (BlackJack) without this fix.
          // Normalise "/foo" to "/#/foo" before React mounts so external
          // links and direct refreshes land on the intended game.
          const p = window.location.pathname;
          if (
            p !== '/' &&
            !window.location.hash &&
            !/\.[a-z0-9]{2,5}$/i.test(p)
          ) {
            window.location.replace(`/#${p}${window.location.search}`);
            return;
          }
          const s = localStorage.getItem('i18n_lang');
          if (s && (s === 'en' || s.indexOf('en-') === 0)) {
            document.documentElement.lang = 'en';
          }
        } catch (_) { /* ignore */ }
      })();
    </script>
    <title>Trump Card Games</title>
    <link rel="apple-touch-icon" href="/images/favicon.ico" />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=DM+Sans:wght@100..1000&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
