# SHA 固定は放置すると古くなり、action 自体のセキュリティ修正も入らなくなるので Dependabot に更新させる。
# 7 日は frontend/bunfig.toml の minimumReleaseAge と揃えている。
# frontend (Bun) は Dependabot のセキュリティ更新に非対応 (版上げのみ対応)。検知はアラートと
# `bun audit`、修正は手で行う。npm エントリを足しても bun.lock で同じく失敗する。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # 既定ブランチも develop だが、master に向くと版上げとリリースが走るので明示する。
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Conventional Commits に合わせる (既定の "Bump X from A to B" は規約外)。
    commit-message:
      prefix: "ci"
    # github-tag-action v7 は既定値が変わり、新しいタグを作らないと new_tag が空のまま
    # GoReleaser に渡る。master への push でしか動かず PR で試せないので、#12034 で
    # 対応するまでメジャーだけ止める (パッチ・マイナーは通す)。
    ignore:
      - dependency-name: mathieudutour/github-tag-action
        update-types: ["version-update:semver-major"]
    # 16 action の更新を週 1 本の PR にまとめる。
    groups:
      github-actions:
        patterns:
          - "*"
