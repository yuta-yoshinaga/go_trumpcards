name: Cloudflare Workers Build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'cmd/workers/**'
      - '.github/workflows/cloudflare-workers-build.yml'
      - 'Makefile'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [develop]
    paths:
      - 'cmd/workers/**'
      - '.github/workflows/cloudflare-workers-build.yml'
      - 'Makefile'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'

# **同じ ref の古いビルドを打ち切る。**このワークフローは `internal/**` の変更で
# 発火し、10 個の Worker を TinyGo でビルドする —— CI の中で最も 1 ジョブが重い。
# バックエンドを触る PR は押すたびに当時 6 ジョブを二重に積んでいた。
#
# サイズ検査が目的で成果物を配布しないので、途中で切っても失われるものはない。
concurrency:
  group: workers-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tinygo-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [casino, classic, solo, extra, extra2, extra3, extra4, extra5, extra6, extra7, extra8, extra9, extra10, extra11]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'

      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2.0.1
        with:
          tinygo-version: '0.42.0'

      - name: Install wasm-opt
        run: sudo apt-get install -y binaryen

      - name: Download Go modules
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Build and optimize
        env:
          GOTOOLCHAIN: local
        run: make build-worker-${{ matrix.worker }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Check WASM imports
        run: bun scripts/check-wasm-imports.ts workers/${{ matrix.worker }}/build

      - name: Check size limit
        env:
          WORKER_NAME: ${{ matrix.worker }}
        run: |
          WASM="workers/${WORKER_NAME}/build/app.wasm"
          RAW=$(stat -c%s "$WASM")
          GZIP=$(gzip -c "$WASM" | wc -c)

          echo "## ${WORKER_NAME} Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Raw | $(echo "$RAW" | awk '{printf "%.2f MB", $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzip | $(echo "$GZIP" | awk '{printf "%.2f KB", $1/1024}') |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$GZIP" -le 1048576 ]; then
            echo "Fits in free tier (< 1 MB)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "EXCEEDS free tier limit (1 MB)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-${{ matrix.worker }}
          path: workers/${{ matrix.worker }}/build/*.wasm
