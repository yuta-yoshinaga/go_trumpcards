name: Deploy to Cloudflare

on:
  push:
    branches: [develop, master]
    paths:
      - 'cmd/workers/**'
      - 'internal/**'
      - 'frontend/**'
      - 'Makefile'
      - 'workers/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-workers:
    name: Deploy Workers (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [casino, classic, solo]
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.40.1'

      - name: Install wasm-opt
        run: sudo apt-get install -y binaryen

      - name: Download Go modules
        env:
          GOTOOLCHAIN: local
        run: go mod download

      - name: Build worker
        env:
          GOTOOLCHAIN: local
          WORKER_NAME: ${{ matrix.worker }}
        run: make "build-worker-${WORKER_NAME}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ matrix.worker }}
          IS_PRODUCTION: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
          CORS_ORIGINS_PROD: ${{ vars.CORS_ALLOWED_ORIGINS_PROD }}
          CORS_ORIGINS_STAGING: ${{ vars.CORS_ALLOWED_ORIGINS_STAGING }}
        run: |
          SUFFIX=""
          CORS_ORIGINS="$CORS_ORIGINS_PROD"
          if [ "$IS_PRODUCTION" != "true" ]; then
            SUFFIX="-staging"
            CORS_ORIGINS="$CORS_ORIGINS_STAGING"
          fi
          cd "workers/${WORKER_NAME}"
          bunx wrangler deploy \
            --name "go-trumpcards-${WORKER_NAME}${SUFFIX}" \
            --var "CORS_ALLOWED_ORIGINS:${CORS_ORIGINS}"

  deploy-pages:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    needs: deploy-workers
    environment:
      name: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_WORKER_CASINO_URL: ${{ github.ref == 'refs/heads/master' && vars.WORKER_CASINO_URL || vars.WORKER_CASINO_STAGING_URL }}
          VITE_WORKER_CLASSIC_URL: ${{ github.ref == 'refs/heads/master' && vars.WORKER_CLASSIC_URL || vars.WORKER_CLASSIC_STAGING_URL }}
          VITE_WORKER_SOLO_URL: ${{ github.ref == 'refs/heads/master' && vars.WORKER_SOLO_URL || vars.WORKER_SOLO_STAGING_URL }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ github.ref == 'refs/heads/master' && 'go-trumpcards' || 'go-trumpcards-staging' }}
        run: bunx wrangler pages deploy public --project-name "$PAGES_PROJECT"
