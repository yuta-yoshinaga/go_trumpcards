name: Wasm Size Spike

on:
  workflow_dispatch:
  push:
    branches: [feat/cloudflare-workers-1010]
    paths:
      - 'cmd/workers/**'
      - '.github/workflows/wasm-size-spike.yml'

jobs:
  tinygo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: nicolo-ribaudo/setup-tinygo@v0.2
        with:
          tinygo-version: '0.40.1'

      - name: Build Wasm with TinyGo (2 games)
        run: |
          mkdir -p build
          tinygo build -o build/app.wasm -target wasi -no-debug -opt=z ./cmd/workers

      - name: Optimize with wasm-opt
        run: |
          sudo apt-get install -y binaryen
          wasm-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -Oz build/app.wasm -o build/app.opt.wasm || true

      - name: Report sizes
        run: |
          echo "## Wasm Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"

          RAW=$(stat -c%s build/app.wasm)
          echo "| TinyGo raw | $(echo "$RAW" | awk '{printf "%.2f MB", $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"

          if [ -f build/app.opt.wasm ]; then
            OPT=$(stat -c%s build/app.opt.wasm)
            echo "| wasm-opt -Oz | $(echo "$OPT" | awk '{printf "%.2f MB", $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"
            GZIP=$(gzip -c build/app.opt.wasm | wc -c)
          else
            GZIP=$(gzip -c build/app.wasm | wc -c)
          fi

          echo "| gzip compressed | $(echo "$GZIP" | awk '{printf "%.2f KB (%.2f MB)", $1/1024, $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$GZIP" -le 1048576 ]; then
            echo "Fits in Cloudflare Workers free tier (< 1 MB)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GZIP" -le 5242880 ]; then
            echo "Fits in paid tier (< 5 MB) but exceeds free tier (1 MB)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Exceeds both free (1 MB) and paid (5 MB) tiers" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: build/*.wasm

  standard-go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Wasm with standard Go (2 games)
        run: |
          mkdir -p build
          GOOS=wasip1 GOARCH=wasm go build -o build/app-std.wasm -ldflags="-w -s" ./cmd/workers

      - name: Report sizes
        run: |
          echo "## Standard Go Wasm Size" >> "$GITHUB_STEP_SUMMARY"
          RAW=$(stat -c%s build/app-std.wasm)
          GZIP=$(gzip -c build/app-std.wasm | wc -c)
          echo "| Metric | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Raw | $(echo "$RAW" | awk '{printf "%.2f MB", $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzip | $(echo "$GZIP" | awk '{printf "%.2f MB", $1/1024/1024}') |" >> "$GITHUB_STEP_SUMMARY"
