name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop ]

# **同じ ref の古い run を打ち切る。**1 回の CI は 10 ジョブに展開される
# (FE 4 シャード + E2E 3 シャード + backend test/lint + frontend static) ので、
# PR を押し直すたびに 10 スロットが二重に埋まる。並行 PR が増えると新しい run が
# start すらできず、待ち時間の大半がジョブの実行ではなくキュー待ちになっていた。
#
# この数字はジョブ構成を変えるたびに古くなる。導入時は 17 ジョブ (FE 8 + E2E 5 +
# lint/typecheck 別建て) で、同じ PR でシャードを減らして 10 になった。
#
# `deploy-*.yml` も同じ group を持つが、あちらは `cancel-in-progress: false` ——
# デプロイを途中で切ると危険なため。検証は切ってよいので true にする。
#
# **master だけ除外する。**master への push はバージョン上げとタグ打ちを起動する
# ので、後続の push でその run を殺すと未タグのコミットが残る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-hooks:
    name: Hook Tests
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 0.2 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The hooks are the thing that stops a broken commit reaching CI, and they
      # fail silently: a guard that no longer matches anything exits 0 and looks
      # healthy. On 2026-08-16 one emitted invalid JSON for weeks and another
      # never fired at all, and `bash -n` passed on both. Only running them and
      # checking the output catches that, so run them here.
      - name: Run hook tests
        run: |
          set -e
          found=0
          for t in .claude/hooks/*.test.sh; do
            [ -e "$t" ] || continue
            found=$((found + 1))
            echo "== $t"
            bash "$t" | tee -a /tmp/hook-test-out
          done
          # A loop over a glob that matched nothing exits 0 and reads as success.
          if [ "$found" -eq 0 ]; then
            echo "no hook tests were found -- the glob or the directory moved" >&2
            exit 1
          fi
          echo "ran $found hook test file(s)"
          # A test that skipped is not a test that passed. Say so in the log --
          # "skip" scrolling past in a green job is how a permanently-inert
          # check survives (see feedback_guard_silent_skip).
          skipped=$(grep -c '^skip ' /tmp/hook-test-out 2>/dev/null || true)
          [ "${skipped:-0}" -gt 0 ] && echo "note: $skipped test file(s) skipped -- they verified nothing here"

  lint-backend:
    name: Backend Lint (golangci-lint)
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 5.5 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --build-tags test

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 7.7 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      # covermode=set, not atomic. atomic updates every counter with an atomic
      # add, which costs ~2x wall clock here (measured at CI's -p 4: 124s ->
      # 62s) for identical numbers (82.3% either way). Go itself only defaults
      # to atomic under -race, which this job does not use; if -race is ever
      # added, this must go back to atomic.
      - name: Run backend tests with coverage
        run: go test -tags test -coverprofile=coverage.out -covermode=set ./...

      - name: Upload backend coverage to Codecov
        # **テストが落ちてもアップロードする。**codecov.yml の after_n_builds は
        # 5 本そろうのを待つので、失敗ジョブが黙って投げないと 5 本目が永久に来ず、
        # codecov のステータスが pending のまま張り付く (#4991)。
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          # frontend 側と揃える。コンパイルエラーなどで coverage.out が
          # 生成されなかったとき、ここで job を落とすと 5 本目が届かず
          # ステータスが pending のまま張り付く (#4991)。
          fail_ci_if_error: false
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  licenses-backend:
    # Go 依存のライセンス検査。このリポジトリは MIT で再配布を許諾している
    # ので、GPL/LGPL 系が混ざると、許諾できない権利を許諾したことになる。
    #
    # ネイティブと js/wasm を別々に検査するのは、ビルドタグで依存集合が
    # 変わるため。syumai/workers は js/wasm ビルドにしか現れず、ネイティブ側
    # だけを見ると素通りする (実測で確認済み)。
    #
    # フロント側 (npm) は `bun run check` の check-dependency-licenses.mjs が
    # 見ている。license-checker は bun の node_modules を歩けず
    # 「UNLICENSED: 1」で exit 0 するため使っていない。
    name: Dependency Licenses (Go)
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 0.6 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # Pinned like everything else in this workflow. An unpinned gate can
      # change its flag semantics or output on any future run with no diff here
      # to review, which is the opposite of what a licence gate is for.
      # v1.6.0 is what the checks below were actually validated against;
      # `@latest` resolves to it because v2 lives at a /v2 module path.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check native build dependencies
        run: go-licenses check ./cmd/... ./internal/... --disallowed_types=forbidden,restricted

      - name: Check js/wasm build dependencies
        env:
          GOOS: js
          GOARCH: wasm
        run: go-licenses check ./cmd/... --disallowed_types=forbidden,restricted

  static-frontend:
    # **Biome と tsc を 1 ジョブにまとめてある。**別々のときは実測で
    # 「待ち 40-52 分 / 実行 0.3 分」だった —— ランナーを確保するコストが
    # 仕事の 150 倍で、分けている意味が無い。checkout と bun install も
    # 二重に払っていた。
    #
    # tsc は型エラーを捕まえる唯一のゲート: `bun run check` は Biome だけで、
    # vitest は型を見ずにトランスパイルする。以前は E2E の `bun run build` の
    # 副作用としてしか走っておらず、E2E シャードごとに同じ検査を払っていた。
    #
    # `bun run typecheck` は `typescript7` エイリアスを使う。素の
    # `tsc` / `bunx tsc` は TypeScript 5.9 に解決され ~46s かかる
    # (frontend/CLAUDE.md の "Type checking" 参照)。
    name: Frontend Static (Biome + tsc)
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 0.7 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Biome check
        working-directory: frontend
        run: bun run check

      - name: Type-check
        working-directory: frontend
        run: bun run typecheck

  test-frontend:
    # **シャード数は「1 ジョブを短くする」ためではなく「待ちの母数を減らす」
    # ために決めてある。**前後を実測した:
    #
    #   変更前 (ジョブ 17 本, PR 19 本が並走): 待ち 814 分 / 実行 50 分 → 待ち 94%
    #   変更後 (ジョブ 10 本, PR 14 本が並走): 待ち   1 分 / 実行 46 分 → 待ち  2%
    #
    # 8 分割は「1 本 4.7 分」を達成していたが、その 1 本が動き出すまでに 40-52 分
    # 待っていた。実行時間の合計はほとんど変わらない (50 → 46 分) —— 減ったのは
    # 待ちだけで、**分割を増やすほど start が遅れる**という関係がそのまま出ている。
    #
    # 待ちが 2% まで落ちた今なら 8 に戻しても損はしないはずだが、並走本数が
    # 減ったことも効いているので、戻すなら**同じ本数で測り直してから**にすること。
    name: Frontend Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 9.4 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: frontend
        # The Vitest v8-coverage run accumulates heap across the growing test
        # suite (150+ game pages) and exceeds Node's default ~4 GB limit on the
        # runner. Raise the heap (ubuntu-latest has 16 GB); inherited by the
        # forked test workers via NODE_OPTIONS.
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: bun run test:coverage -- --shard=${{ matrix.shard }}/4

      - name: Upload frontend coverage to Codecov
        # 落ちたシャードも部分カバレッジを投げる。理由は backend 側と同じ (#4991)。
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          # Each shard reports partial coverage; Codecov merges the uploads for
          # the commit, so the job must not fail when one shard misses a file.
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-e2e:
    # Sharded on top of the in-job parallelism (playwright.config.ts runs 4
    # workers in CI). Each shard boots its own server binary, so shards cannot
    # interfere with each other.
    #
    # **5 から 3 に戻した。**5 を選んだときの測定は正しく (3 -> 5 で最遅シャードが
    # ~261s -> ~190s、~105s のセットアップは分割で縮まないので頭打ち)、そこだけ
    # 見れば 5 が良い。変わったのは前提の方で、PR が 19 本並走する状況では
    # ジョブが start するまでに 40-52 分待つ。**シャード 1 本の 70 秒を買うために
    # ランナー 2 枠を余分に確保するのは、待ち行列がある限り損**になる。
    #
    # 実測: 変更前はジョブ 17 本で待ち 814 分 / 実行 50 分 (待ち 94%)、変更後は
    # ジョブ 10 本で待ち 1 分 / 実行 46 分 (待ち 2%)。E2E 3 シャードは各 3.9-4.4 分で、
    # 5 分割時の 2.4-3.4 分より 1 本は長いが、run 全体は待ちが消えた分だけ速い。
    #
    # 戻すなら上の 261s/190s ではなく待ち時間の方を、**同じ並走本数で**測ること。
    name: E2E Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # ハングしたジョブを止める上限。既定は 6 時間で、その間 PR は pending の
    # まま誰かが手でキャンセルするまで進まない (#5967 は E2E が 26-46 分走り続けた
    # 3 例)。値は develop の成功 run 4 本の実測 max 7.8 分 (セットアップ込み) の
    # おおよそ 2 倍。伸ばす前に、まず実測が伸びたのかハングなのかを確かめること。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Reuse the module + build cache across shards so `go build` of the
          # server binary is not paid three times from cold (~37s each).
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Bundle only — `bun run build` also runs `bun run typecheck` (~5s since
      # the TypeScript 7 switch, ~48s before it), which the dedicated typecheck
      # job now covers once instead of once per shard.
      - name: Build frontend
        working-directory: frontend
        run: bunx vite build

      # The browser download is identical across shards and only changes when
      # Playwright itself does, so key the cache on the resolved version from
      # the lockfile. Cold: ~21s per shard; warm: a few seconds.
      - name: Resolve Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # --with-deps installs OS packages outside the cached directory, so a
      # cache hit still needs them.
      - name: Install Playwright OS dependencies
        working-directory: frontend
        run: bunx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Build server binary
        run: go build -o /tmp/trumpcards-server ./cmd/server

      - name: Run E2E tests
        working-directory: frontend
        env:
          E2E_SERVER_BIN: /tmp/trumpcards-server
        run: bunx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 14
