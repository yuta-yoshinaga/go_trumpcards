name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-backend:
    name: Backend Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --build-tags test

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run backend tests with coverage
        run: go test -tags test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  lint-frontend:
    name: Frontend Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run Biome check
        working-directory: frontend
        run: bun run check

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run frontend tests with coverage
        working-directory: frontend
        # The Vitest v8-coverage run accumulates heap across the growing test
        # suite (150+ game pages) and exceeds Node's default ~4 GB limit on the
        # runner. Raise the heap (ubuntu-latest has 16 GB); inherited by the
        # forked test workers via NODE_OPTIONS.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: bunx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
