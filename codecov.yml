# **既定の after_n_builds は 1。**codecov は最初のアップロードが届いた時点で
# ステータスを確定させるため、フロントを 4 シャードに分けている本リポジトリでは
# 「最初に到着したシャードが担当していないファイル」が 0% のまま採点されていた。
# 実測例: PR #5068 の TressettePage.tsx / PR #5073 の SlapjackPage.tsx はどちらも
# 0% と報告されたが、ローカル計測では該当行に 124 hits あり、全シャード到着後には
# 同じステータスが自然に green へ変わっていた (#4991)。
#
# 1 コミットあたりのアップロード数だけ待たせる:
#   backend (coverage.out)        1
#   frontend (--shard=N/4)        4
#                                 = 5
#
# **`coverage.all: false` では直さない。**「走らせていないファイルをレポートに
# 含めない」ようにすれば 0% の行そのものは消えるが、テストが 1 本も無いファイルは
# どのシャードからも報告されなくなり、本物のカバレッジ欠落まで一緒に見えなくなる。
# ここで待たせるのはデータを捨てない直し方で、4 シャード全部で 0% のファイルは
# マージ後も 0% のまま赤くなる。
#
# **この数字は ci.yml のジョブ構成を変えると古くなる。**シャード数を変えたり
# codecov へのアップロードを増減したら、ここも直すこと。
# `frontend/scripts/check-codecov-uploads.mjs` が両者の一致を検査していて、
# ズレたまま push すると `bun run check` が落ちる。
codecov:
  notify:
    after_n_builds: 5

coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 80%

ignore:
  - "cmd/"
  - "internal/infrastructure/"
  - "**/*_mock.go"
