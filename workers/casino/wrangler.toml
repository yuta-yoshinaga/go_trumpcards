name = "go-trumpcards-casino"
main = "./build/worker.mjs"
compatibility_date = "2024-09-23"

# **Workers のログを有効にする。**これが無いと Cloudflare は何も保存せず、
# observability API は 7 日ぶんを問い合わせても 0 件を返す —— 本番で何が起きて
# いるかを、本番を直接叩いて再現する以外に知る手段が無くなる。実際 klondike の
# 503 (Cloudflare 1102) は、ログではなくデプロイ済み Worker への手動リクエストで
# しか見つけられなかった。
#
# head_sampling_rate は 1 (全件)。この 7 本は無料枠の趣味プロジェクトで、
# 取りこぼしを気にする量のトラフィックは無い。
[observability]
enabled = true
head_sampling_rate = 1


# Production KV
[[kv_namespaces]]
binding = "GAME_SESSIONS"
id = "766288ab9a9441d7975560a003a1f56f"
preview_id = "b29980931c9a4a60a945876eb7655f48"

[env.staging]
name = "go-trumpcards-casino-staging"

[[env.staging.kv_namespaces]]
binding = "GAME_SESSIONS"
id = "d44d7ffaff4148929c3f27019188a7fc"
