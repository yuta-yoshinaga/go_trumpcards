name = "go-trumpcards-extra"
main = "./build/worker.mjs"
compatibility_date = "2024-09-23"

# **Workers のログを有効にする。**これが無いと Cloudflare は何も保存せず、
# observability API は 7 日ぶんを問い合わせても 0 件を返す —— 本番で何が起きて
# いるかを、本番を直接叩いて再現する以外に知る手段が無くなる。実際 klondike の
# 503 (Cloudflare 1102) は、ログではなくデプロイ済み Worker への手動リクエストで
# しか見つけられなかった。
#
# head_sampling_rate は 1 (全件)。この 7 本は無料枠の趣味プロジェクトで、
# 取りこぼしを気にする量のトラフィックは無い。
[observability]
enabled = true
head_sampling_rate = 1


[[kv_namespaces]]
binding = "GAME_SESSIONS"
id = "72d56b39ea0244b38a765e41466bfbba"
preview_id = "8879e8e454a748958d109a7d135c7912"

[env.staging]
name = "go-trumpcards-extra-staging"

[[env.staging.kv_namespaces]]
binding = "GAME_SESSIONS"
id = "3de03ff8456a4ab2b96490dbe7aef6a8"
