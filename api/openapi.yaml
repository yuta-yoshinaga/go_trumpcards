  /euchre/exec:
    post:
      tags:
        - euchre
      summary: Execute a Euchre game command
      description: |
        Send a command to advance the Euchre (ユーカー) game session identified by
        `sessionId`.  Euchre is a 4-player, 2-team trick-taking game with a 24-card
        deck (9-A).  Features Right Bower (Jack of trump) and Left Bower (Jack of
        same-color suit) as highest trump cards.  Trump suit determined via bidding.
        "Going alone" option for bonus points.  First team to 10 points wins.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | PickUp    | `0`   | Decide whether to order up the turned-up card |
        | CallTrump | `1`   | Call a trump suit (after all pass in PickUp) |
        | Discard   | `2`   | Dealer discards a card after picking up |
        | Play      | `3`   | Trick play (follow suit; bower hierarchy) |
        | TrickEnd  | `4`   | Trick resolved; advance with `next` |
        | RoundEnd  | `5`   | All 5 tricks played; advance with `nextround` |
        | GameEnd   | `6`   | A team reached 10 points |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `orderup`   | `o`     | Order up the turned-up card |
        | `orderupalone` | `oa` | Order up and go alone |
        | `pass`      | `pa`    | Pass on ordering up / calling trump |
        | `calltrump` | `c`     | Call a trump suit (requires `suit`: 1-4) |
        | `calltrumpalone` | `ca` | Call a trump suit and go alone |
        | `discard`   | `d`     | Discard a card (requires `cardIndex`) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `hint`      | `h`     | Get a play/bid hint |
        | `log`       | `l`     | View action log |
      operationId: euchreExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EuchreRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              orderup:
                summary: Order up the turned-up card
                value:
                  command: orderup
                  sessionId: my-session-001
              pass:
                summary: Pass on ordering up
                value:
                  command: pass
                  sessionId: my-session-001
              calltrump:
                summary: Call hearts as trump
                value:
                  command: calltrump
                  suit: 3
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuchreResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EuchreResponse'

  /pyramid/exec:
    post:
      tags:
        - pyramid
      summary: Execute a Pyramid game command
      description: |
        Send a command to advance the Pyramid (ピラミッド) game session identified by
        `sessionId`.  Pyramid is a single-player solitaire card game using a
        standard 52-card deck.  28 cards are dealt face-up in a 7-row pyramid.
        Remove exposed pairs of cards that sum to 13; Kings (value 13) are
        removed alone.  Remaining 24 cards form the stock pile.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All pyramid cards removed; player wins |
        | GameOver   | `2`   | No more moves available; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`        | `r`  | Start / restart a game |
        | `draw`         | `d`  | Draw a card from stock to waste |
        | `remove`       | `rm` | Remove card(s) (pair summing to 13, king, or waste pair) |
        | `giveup`       | `g`  | Give up the current game |
        | `hint`         | `h`  | Get a hint for the next move |
        | `undo`         | `u`  | Undo the last action |
        | `undo_n`       |      | Undo N actions (requires `n` parameter) |
        | `log`          | `l`  | View action log |
      operationId: pyramidExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PyramidRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw from stock
                value:
                  command: draw
                  sessionId: my-session-001
              removePair:
                summary: Remove a pair from pyramid
                value:
                  command: remove
                  card1:
                    zone: pyramid
                    row: 6
                    col: 0
                  card2:
                    zone: pyramid
                    row: 6
                    col: 1
                  sessionId: my-session-001
              removeKing:
                summary: Remove a King from pyramid
                value:
                  command: remove
                  card1:
                    zone: pyramid
                    row: 6
                    col: 3
                  sessionId: my-session-001
              removeWithWaste:
                summary: Remove waste top + pyramid card
                value:
                  command: remove
                  card1:
                    zone: waste
                  card2:
                    zone: pyramid
                    row: 5
                    col: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PyramidResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PyramidResponse'
              examples:
                paramError:
                  value:
                    pyramid: []
                    stockCount: 0
                    waste: []
                    phase: 0
                    moveCount: 0
                    message: param error.

  /tripeaks/exec:
    post:
      tags:
        - tripeaks
      summary: Execute a TriPeaks game command
      description: |
        Send a command to advance the TriPeaks (トリピークス) game session identified by
        `sessionId`.  TriPeaks is a single-player solitaire card game using a
        standard 52-card deck.  Three overlapping pyramids (peaks) form a 28-card
        tableau.  Remove exposed cards that are ±1 rank from the waste pile top
        card (K-A wrap).  Win by removing all 28 tableau cards.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All tableau cards removed; player wins |
        | GameOver   | `2`   | No more moves available; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`        | `r`  | Start / restart a game |
        | `draw`         | `d`  | Draw a card from stock to waste |
        | `remove`       | `rm` | Remove an exposed card ±1 rank from waste top |
        | `giveup`       | `g`  | Give up the current game |
        | `hint`         | `h`  | Get a hint for the next move |
        | `undo`         | `u`  | Undo the last action |
        | `undo_n`       |      | Undo N actions (requires `n` parameter) |
        | `log`          | `l`  | View action log |
      operationId: tripeaksExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriPeaksRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw from stock
                value:
                  command: draw
                  sessionId: my-session-001
              remove:
                summary: Remove a tableau card
                value:
                  command: remove
                  row: 3
                  col: 0
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriPeaksResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriPeaksResponse'
              examples:
                paramError:
                  value:
                    tableau: []
                    stockCount: 0
                    waste: []
                    phase: 0
                    moveCount: 0
                    message: param error.

  /cribbage/exec:
    post:
      tags:
        - cribbage
      summary: Execute a Cribbage game command
      description: |
        Send a command to advance the Cribbage (クリベッジ) game session identified by
        `sessionId`.  Cribbage is a classic 2-player pegging and scoring card game
        using a standard 52-card deck.  Each player is dealt 6 cards and discards 2
        to the crib.  A starter card is cut.  Players alternate playing cards in the
        pegging phase (target 31), then score hands and crib.  First to 121 points wins.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Discard    | `0`   | Each player discards 2 cards to the crib |
        | Cut        | `1`   | Starter card revealed |
        | Pegging    | `2`   | Alternate playing cards toward 31 |
        | Show       | `3`   | Score hands and crib |
        | RoundEnd   | `4`   | Round summary |
        | GameEnd    | `5`   | Game over; winner determined |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`          | `r`   | Start / restart a game |
        | `discard`        | `d`   | Discard cards to the crib (indices) |
        | `peg`            | `p`   | Play a card during pegging (index) |
        | `go`             |       | Declare "Go" when unable to play |
        | `shownext`       | `sn`  | Advance to next show step |
        | `nextround`      | `nr`  | Start the next round |
        | `setdifficulty`  | `sd`  | Set CPU difficulty (0=Easy, 1=Normal, 2=Hard) |
        | `setlimit`       | `sl`  | Set point limit |
        | `log`            | `l`   | View action log |
      operationId: cribbageExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CribbageRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              discard:
                summary: Discard two cards to crib
                value:
                  command: discard
                  cardIndices: [4, 5]
                  sessionId: my-session-001
              peg:
                summary: Play a card during pegging
                value:
                  command: peg
                  cardIndex: 0
                  sessionId: my-session-001
              go:
                summary: Declare Go
                value:
                  command: go
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CribbageResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CribbageResponse'
              examples:
                paramError:
                  value:
                    players: []
                    phase: 0
                    roundNumber: 0
                    currentPlayerIdx: 0
                    dealerIdx: 0
                    crib: []
                    pegCount: 0
                    pegPlayedCards: []
                    showPhaseStep: 0
                    handScoreDetails: [null, null, null]
                    gameEndFlag: false
                    winnerIdx: -1
                    message: param error.

  /threecard/exec:
    post:
      tags:
        - threecard
      summary: Execute a Three Card Poker game command
      description: |
        Send a command to advance the Three Card Poker (スリーカードポーカー) game session
        identified by `sessionId`.  Three Card Poker is a single-player casino card game
        using a standard 52-card deck.  Player places an Ante bet and optional Pair Plus
        side bet, receives 3 cards, then decides to Play (match Ante) or Fold (forfeit Ante).
        Dealer must have Q-high or better to qualify.

        Hand rankings (highest to lowest): Straight Flush, Three of a Kind, Straight,
        Flush, Pair, High Card.

        The game proceeds through these phases:

        | Phase  | Value | Description |
        |--------|-------|-------------|
        | Bet    | `1`   | Place Ante and optional Pair Plus bet |
        | Action | `2`   | Decide to Play or Fold |
        | End    | `3`   | Round complete; shows result and payout |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place Ante bet (requires `amount`; optional `pairPlusBet`) |
        | `play`  | `p`     | Place Play bet (equal to Ante) and see dealer's hand |
        | `fold`  | `f`     | Forfeit Ante and Pair Plus bets |
        | `log`   | `l`     | View action log |
      operationId: threecardExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeCardRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bet:
                summary: Bet 100 Ante with 50 Pair Plus
                value:
                  command: bet
                  amount: 100
                  pairPlusBet: 50
                  sessionId: my-session-001
              play:
                summary: Place Play bet
                value:
                  command: play
                  sessionId: my-session-001
              fold:
