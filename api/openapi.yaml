openapi: 3.1.0
info:
  title: go_trumpcards API
  description: |
    REST API for the go_trumpcards card game server.

    Each endpoint manages game state on the server using a session identifier
    (`sessionId`) supplied by the client.  Sessions expire after 1 hour of
    inactivity and the server supports up to 10 000 concurrent sessions.
  version: 1.0.0

servers:
  - url: http://localhost:80
    description: Local development server (default port; override with PORT env var)

tags:
  - name: blackjack
    description: BlackJack game
  - name: poker
    description: 5-card Draw Poker game
  - name: oldmaid
    description: Old Maid (Babanuki) game
  - name: daifugo
    description: Daifugo (大富豪) game
  - name: sevens
    description: Sevens (7並べ) game
  - name: doubt
    description: Doubt (ダウト) game
  - name: holdem
    description: Texas Hold'em game
  - name: hearts
    description: Hearts game
  - name: memory
    description: Memory (神経衰弱) game
  - name: klondike
    description: Klondike (ソリティア) game
  - name: baccarat
    description: Baccarat (バカラ) game
  - name: spades
    description: Spades (スペード) game
  - name: crazyeights
    description: Crazy Eights (クレイジーエイト) game

paths:
  /blackjack/exec:
    post:
      tags:
        - blackjack
      summary: Execute a BlackJack game command
      description: |
        Send a command to advance the BlackJack game session identified by
        `sessionId`.

        The game proceeds through five phases:
        1. **Bet** (`phase=1`) — Player places an initial bet
        2. **Deal** (`phase=2`) — Two cards dealt to each; check if dealer shows Ace
        3. **Insurance** (`phase=3`) — Player accepts/declines insurance (only if dealer shows Ace)
        4. **Action** (`phase=4`) — Hit / Stand / Double Down / Split / Surrender
        5. **End** (`phase=5`) — Dealer plays, judgment, payout
        6. **Early Surrender** (`phase=6`) — Player decides whether to surrender before dealer BJ check (only when surrender rule = Early)

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place initial bet (requires `amount`) |
        | `hit`   | `h`     | Draw an additional card |
        | `stand` | `s`     | End the player turn; trigger dealer play and judgment |
        | `doubledown` | `d` | Double bet, draw one card, auto-stand |
        | `split` | `sp`    | Split a pair into two hands |
        | `insurance` | `i` | Accept insurance (costs half of original bet) |
        | `declineinsurance` | `di` | Decline insurance |
        | `surrender` | `sur` | Surrender first 2 cards and receive half bet back |
        | `togglehint` | — | Toggle basic strategy hint on/off |
        | `setdeckcount` | `sd` | Set shoe deck count (requires `amount`: 1/2/4/6/8) |
        | `earlysurrender` | `es` | Surrender before dealer BJ check (early surrender phase only) |
        | `declineearlysurrender` | `des` | Decline early surrender and continue normal play |
        | `setsurrenderrule` | `ssr` | Set surrender rule (requires `amount`: 0=Late/1=Early/2=No surrender) |
        | `togglesoft17` | `soft17` | Toggle dealer soft-17 rule (H17 ↔ S17) |
        | `togglecounting` | `counting` | Toggle card counting display on/off |
        | `toggledas` | `das` | Toggle double-after-split (DAS) on/off |
        | `setcountingsystem` | `scs` | Set counting system (requires `amount`: 0=Hi-Lo/1=KO/2=Zen Count/3=Omega II) |
        | `quit`  | `q`     | End the session |
      operationId: blackjackExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackJackRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bet:
                summary: Place a bet
                value:
                  command: bet
                  amount: 100
                  sessionId: my-session-001
              hit:
                summary: Draw a card
                value:
                  command: hit
                  sessionId: my-session-001
              stand:
                summary: Stand and end turn
                value:
                  command: stand
                  sessionId: my-session-001
              doubledown:
                summary: Double down
                value:
                  command: doubledown
                  sessionId: my-session-001
              split:
                summary: Split a pair
                value:
                  command: split
                  sessionId: my-session-001
              insurance:
                summary: Accept insurance
                value:
                  command: insurance
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackJackResponse'
              examples:
                inProgress:
                  summary: Game in progress (dealer hole card is hidden)
                  value:
                    dealer:
                      score: 0
                      cards:
                        - design: SPADE
                          value: 10
                      chips: 1000
                    player:
                      chips: 900
                    hands:
                      - score: 18
                        cards:
                          - design: CLOVER
                            value: 8
                          - design: DIAMOND
                            value: 10
                        bet: 100
                        stood: false
                        doubled: false
                        busted: false
                        isBlackJack: false
                        canSplit: false
                    phase: 4
                    currentHandIdx: 0
                    insuranceBet: 0
                    insuranceAvailable: false
                    message: ""
                playerWins:
                  summary: Game over — player wins (all dealer cards revealed)
                  value:
                    dealer:
                      score: 22
                      cards:
                        - design: SPADE
                          value: 10
                        - design: HEART
                          value: 5
                        - design: CLOVER
                          value: 7
                      chips: 900
                    player:
                      chips: 1200
                    hands:
                      - score: 20
                        cards:
                          - design: DIAMOND
                            value: 10
                          - design: HEART
                            value: 10
                        bet: 100
                        stood: true
                        doubled: false
                        busted: false
                        isBlackJack: false
                        canSplit: false
                    phase: 5
                    currentHandIdx: 0
                    insuranceBet: 0
                    insuranceAvailable: false
                    message: You are the winner.
                quit:
                  summary: Quit command response
                  value:
                    dealer:
                      chips: 0
                    player:
                      chips: 0
                    phase: 1
                    currentHandIdx: 0
                    insuranceBet: 0
                    insuranceAvailable: false
                    message: bye.
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackJackResponse'
              examples:
                paramError:
                  summary: Missing required parameter
                  value:
                    dealer:
                      chips: 0
                    player:
                      chips: 0
                    phase: 1
                    currentHandIdx: 0
                    insuranceBet: 0
                    insuranceAvailable: false
                    message: param error.

  /poker/exec:
    post:
      tags:
        - poker
      summary: Execute a 5-card Draw Poker game command
      description: |
        Send a command to advance the Poker game session identified by
        `sessionId`.  The game supports 1 human + 1-3 CPU players.

        The game proceeds through five phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Init       | `0`   | Before any cards are dealt |
        | Deal       | `1`   | Cards dealt; first betting round |
        | Exchange   | `2`   | Player may exchange cards |
        | SecondBet  | `3`   | Second betting round (after exchange) |
        | End        | `4`   | Showdown; final hands revealed |

        | Command    | Aliases | Description |
        |------------|---------|-------------|
        | `reset`    | `r`     | Start / restart a game |
        | `bet`      | `b`     | Place a bet (use `amount`) |
        | `call`     | `c`     | Match the current bet |
        | `raise`    | `ra`    | Raise (use `amount`) |
        | `check`    | `ck`    | Pass without betting (only when no outstanding bet) |
        | `fold`     | `f`     | Forfeit the pot |
        | `allin`    | `a`     | Go all-in (bet all remaining chips) |
        | `exchange` | `e`     | Exchange selected cards (use `indices` to specify which) |
        | `stand`    | `s`     | Keep current hand (no exchange) |
        | `odds`     | `o`     | Calculate draw odds for selected cards (read-only, exchange phase only) |
        | `quit`     | `q`     | End the session |
      operationId: pokerExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PokerRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              resetWithConfig:
                summary: Start a new game with 2 CPUs and 1 joker
                value:
                  command: reset
                  cpuCount: 2
                  jokerCount: 1
                  sessionId: my-session-001
              bet:
                summary: Place a bet of 20
                value:
                  command: bet
                  amount: 20
                  sessionId: my-session-001
              call:
                summary: Call the current bet
                value:
                  command: call
                  sessionId: my-session-001
              allin:
                summary: Go all-in
                value:
                  command: allin
                  sessionId: my-session-001
              exchange:
                summary: Exchange cards at positions 0 and 2
                value:
                  command: exchange
                  indices: [0, 2]
                  sessionId: my-session-001
              stand:
                summary: Stand (no exchange)
                value:
                  command: stand
                  sessionId: my-session-001
              odds:
                summary: Calculate draw odds for cards at positions 0 and 2
                value:
                  command: odds
                  indices: [0, 2]
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokerResponse'
              examples:
                dealPhase:
                  summary: Cards dealt — first betting round (phase 1)
                  value:
                    players:
                      - id: 0
                        isHuman: true
                        cards:
                          - design: SPADE
                            value: 5
                          - design: HEART
                            value: 5
                          - design: CLOVER
                            value: 9
                          - design: DIAMOND
                            value: 9
                          - design: SPADE
                            value: 2
                        chips: 990
                        currentBet: 0
                        folded: false
                        allIn: false
                        handRank: 2
                        handName: Two Pair
                        exchangeCount: -1
                        playStyleName: ""
                      - id: 1
                        isHuman: false
                        cards: []
                        chips: 990
                        currentBet: 0
                        folded: false
                        allIn: false
                        handRank: 0
                        handName: ""
                        exchangeCount: -1
                        playStyleName: Balanced
                    pot: 20
                    sidePots: []
                    dealerIdx: 0
                    currentTurn: 0
                    phase: 1
                    gameEndFlag: false
                    lastBet: 0
                    minRaise: 10
                    ante: 10
                    jokerCount: 0
                    roundResults: []
                    cpuActions: []
                    cpuExchanges: []
                    message: ""
                endPhase:
                  summary: Showdown (phase 4)
                  value:
                    players:
                      - id: 0
                        isHuman: true
                        cards:
                          - design: SPADE
                            value: 5
                          - design: HEART
                            value: 5
                          - design: CLOVER
                            value: 9
                          - design: DIAMOND
                            value: 9
                          - design: SPADE
                            value: 2
                        chips: 1040
                        currentBet: 0
                        folded: false
                        allIn: false
                        handRank: 2
                        handName: Two Pair
                        exchangeCount: 0
                        playStyleName: ""
                      - id: 1
                        isHuman: false
                        cards:
                          - design: SPADE
                            value: 3
                          - design: HEART
                            value: 3
                          - design: CLOVER
                            value: 7
                          - design: DIAMOND
                            value: 10
                          - design: SPADE
                            value: 1
                        chips: 960
                        currentBet: 0
                        folded: false
                        allIn: false
                        handRank: 1
                        handName: One Pair
                        exchangeCount: 3
                        playStyleName: Balanced
                    pot: 0
                    sidePots: []
                    dealerIdx: 0
                    currentTurn: 0
                    phase: 4
                    gameEndFlag: false
                    lastBet: 0
                    minRaise: 10
                    ante: 10
                    jokerCount: 0
                    roundResults:
                      - playerIdx: 0
                        handRank: 2
                        handName: Two Pair
                        wonAmount: 40
                    cpuActions: []
                    cpuExchanges: []
                    message: You are the winner.
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PokerResponse'
              examples:
                paramError:
                  value:
                    players:
                      - id: 0
                        isHuman: true
                        cards: []
                        chips: 0
                        currentBet: 0
                        folded: false
                        allIn: false
                        handRank: 0
                        handName: ""
                        exchangeCount: -1
                        playStyleName: ""
                    pot: 0
                    sidePots: []
                    dealerIdx: 0
                    currentTurn: 0
                    phase: 0
                    gameEndFlag: false
                    lastBet: 0
                    minRaise: 0
                    ante: 0
                    jokerCount: 0
                    roundResults: []
                    cpuActions: []
                    cpuExchanges: []
                    message: param error.

  /oldmaid/exec:
    post:
      tags:
        - oldmaid
      summary: Execute an Old Maid (Babanuki) game command
      description: |
        Send a command to advance the Old Maid game session identified by
        `sessionId`.  The game has 4 players (player 0 = human, players 1–3 =
        CPU).

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `draw`  | `d`     | Draw a card from the next target player; use `drawIdx` to specify which card slot to draw from (omit for random) |
        | `quit`  | `q`     | End the session |
      operationId: oldmaidExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OldMaidRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw the card at index 1 from the target player
                value:
                  command: draw
                  drawIdx: 1
                  sessionId: my-session-001
              drawRandom:
                summary: Draw a random card from the target player
                value:
                  command: draw
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OldMaidResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OldMaidResponse'
              examples:
                paramError:
                  value:
                    players: []
                    currentTurn: 0
                    nextDrawTargetIdx: 0
                    gameEndFlag: false
                    loserIdx: -1
                    lastDrawPlayerIdx: 0
                    lastDrawFromIdx: 0
                    lastDrawCard: null
                    lastDiscardedPairs: 0
                    hasDrawn: false
                    cpuActions: []
                    message: param error.

  /daifugo/exec:
    post:
      tags:
        - daifugo
      summary: Execute a Daifugo (大富豪) game command
      description: |
        Send a command to advance the Daifugo game session identified by
        `sessionId`.  The game has 4 players (player 0 = human, players 1–3 =
        CPU).

        Final player ranks: 1 = 大富豪, 2 = 富豪, 3 = 平民, 4 = 大貧民.

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `play`  | `p`     | Play cards specified by `indices`; pass with an empty array |
        | `sort`  |         | Sort human player's hand (optional `sortMode` param) |
        | `quit`  | `q`     | End the session |
      operationId: daifugoExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaifugoRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              play:
                summary: Play cards at hand positions 0 and 2
                value:
                  command: play
                  indices: [0, 2]
                  sessionId: my-session-001
              pass:
                summary: Pass (empty indices)
                value:
                  command: play
                  indices: []
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaifugoResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaifugoResponse'
              examples:
                paramError:
                  value:
                    players: []
                    currentTurn: 0
                    tableCards: []
                    lastPlayPlayerIdx: 0
                    gameEndFlag: false
                    cpuActions: []
                    humanAction: null
                    message: param error.

  /sevens/exec:
    post:
      tags:
        - sevens
      summary: Execute a Sevens (7並べ) game command
      description: |
        Send a command to advance the Sevens game session identified by
        `sessionId`.  The game has 4 players (player 0 = human, players 1–3 =
        CPU).

        Each suit builds outward from 7.  The board state is represented by
        `tableMinVals` and `tableMaxVals` — arrays of 5 integers indexed by suit
        (0 = unused, 1 = SPADE, 2 = CLOVER, 3 = HEART, 4 = DIAMOND).

        Players have a configurable number of passes (`maxPasses`, default 5, 0 = unlimited).

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `play`  | `p`     | Play the card at hand position `index`; pass with `index: -1` |
        | `quit`  | `q`     | End the session |
      operationId: sevensExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SevensRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              playCard:
                summary: Play the card at hand index 3
                value:
                  command: play
                  index: 3
                  sessionId: my-session-001
              pass:
                summary: Pass (index -1)
                value:
                  command: play
                  index: -1
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevensResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevensResponse'
              examples:
                paramError:
                  value:
                    players: []
                    currentTurn: 0
                    tableMinVals: [0, 0, 0, 0, 0]
                    tableMaxVals: [0, 0, 0, 0, 0]
                    gameEndFlag: false
                    cpuActions: []
                    humanAction: null
                    message: param error.

  /doubt/exec:
    post:
      tags:
        - doubt
      summary: Execute a Doubt (ダウト) game command
      description: |
        Send a command to advance the Doubt game session identified by
        `sessionId`.  The game has 4 players (player 0 = human, players 1–3 =
        CPU).

        Each turn, the active player places cards face-down and declares a card
        value (which may be a bluff).  After a card is played, other players can
        declare "doubt" (`d`/`doubt`) or pass (`s`/`skip`).

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `play`  | `p`     | Play `cardIndices` cards declaring `claimedValue` |
        | `doubt` | `d`     | Declare doubt; supply `doubterIndices` (human = 0 + any CPU doubters) |
        | `skip`  | `s`     | Pass on doubting; `doubterIndices` is ignored (server uses its own state) |
        | `quit`  | `q`     | End the session |
      operationId: doubtExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoubtRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              play:
                summary: Play cards at hand indices 0 and 2, declare value 3
                value:
                  command: play
                  cardIndices: [0, 2]
                  claimedValue: 3
                  sessionId: my-session-001
              doubt:
                summary: Human doubts (with CPU 2 also doubting)
                value:
                  command: doubt
                  doubterIndices: [0, 2]
                  sessionId: my-session-001
              skip:
                summary: Human passes (doubterIndices is not required for skip)
                value:
                  command: skip
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubtResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoubtResponse'
              examples:
                paramError:
                  value:
                    players: []
                    currentTurn: 0
                    phase: 0
                    tableCardCount: 0
                    lastAction: null
                    cpuDoubters: []
                    cpuActions: []
                    humanAction: null
                    lastDoubtResult: null
                    gameEndFlag: false
                    winnerIdx: -1
                    message: param error.

  /holdem/exec:
    post:
      tags:
        - holdem
      summary: Execute a Texas Hold'em game command
      description: |
        Send a command to advance the Texas Hold'em game session identified by
        `sessionId`.  The game supports configurable table sizes: 4-max
        (default, 1 human + 3 CPU), 6-max (1 human + 5 CPU), or 9-max
        (1 human + 8 CPU).  Each CPU has a distinct play style.

        The game proceeds through eight phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Init       | `0`   | Before any cards are dealt |
        | PreFlop    | `1`   | Two hole cards dealt; first betting round |
        | Flop       | `2`   | Three community cards revealed |
        | Turn       | `3`   | Fourth community card revealed |
        | River      | `4`   | Fifth community card revealed |
        | Showdown   | `5`   | Hands evaluated; winners determined |
        | End        | `6`   | Round complete; results displayed |
        | Rebuy      | `7`   | Rebuy/addon decision phase |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `fold`  | `f`     | Fold and forfeit the pot |
        | `check` | `ck`    | Pass without betting (only when no outstanding bet) |
        | `call`  | `c`     | Match the current bet |
        | `bet`   | `b`     | Place a bet (use `amount`) |
        | `raise` | `ra`    | Raise by a specified amount on top of calling (use `amount`) |
        | `allin` | `a`     | Go all-in with all remaining chips |
        | `rebuy` | `rb`    | Buy back chips during rebuy period |
        | `skiprebuy` | `sr` | Skip rebuy opportunity |
        | `addon` | `ad`    | Add chips (one-time addon purchase) |
        | `skipaddon` | `sa` | Skip addon opportunity |
        | `quit`  | `q`     | End the session |
      operationId: holdemExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldemRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              resetCustomBlinds:
                summary: Start with custom blinds
                value:
                  command: reset
                  smallBlind: 10
                  bigBlind: 20
                  sessionId: my-session-001
              fold:
                summary: Fold
                value:
                  command: fold
                  sessionId: my-session-001
              call:
                summary: Call
                value:
                  command: call
                  sessionId: my-session-001
              bet:
                summary: Place a bet of 40
                value:
                  command: bet
                  amount: 40
                  sessionId: my-session-001
              raise:
                summary: Raise by 80 on top of calling
                value:
                  command: raise
                  amount: 80
                  sessionId: my-session-001
              allin:
                summary: Go all-in
                value:
                  command: allin
                  sessionId: my-session-001
              rebuy:
                summary: Accept rebuy
                value:
                  command: rebuy
                  sessionId: my-session-001
              skipaddon:
                summary: Skip addon
                value:
                  command: skipaddon
                  sessionId: my-session-001
              resetWithRebuy:
                summary: Start with rebuy/addon enabled
                value:
                  command: reset
                  rebuyEnabled: true
                  addonEnabled: true
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldemResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldemResponse'
              examples:
                paramError:
                  value:
                    players: []
                    communityCards: []
                    pot: 0
                    sidePots: []
                    dealerIdx: 0
                    currentTurn: 0
                    phase: 0
                    gameEndFlag: false
                    lastBet: 0
                    minRaise: 0
                    roundResults: []
                    cpuActions: []
                    message: param error.

  /omaha/exec:
    post:
      tags:
        - omaha
      summary: Execute an Omaha Hold'em game command
      description: |
        Send a command to advance the Omaha Hold'em game session identified by
        `sessionId`.  Omaha is a variant of Texas Hold'em where each player
        receives 4 hole cards and must use exactly 2 hole cards + 3 community
        cards to form the best 5-card hand.

        The game uses the same phases, commands, and configuration options as
        Texas Hold'em.  See the `/holdem/exec` endpoint for full documentation.
      operationId: omahaExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldemRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              fold:
                summary: Fold
                value:
                  command: fold
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldemResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldemResponse'

  /hearts/exec:
    post:
      tags:
        - hearts
      summary: Execute a Hearts game command
      description: |
        Send a command to advance the Hearts game session identified by
        `sessionId`.  Hearts is a 4-player trick-taking card game
        (1 human + 3 CPU).  Players avoid taking hearts (1 point each)
        and Q♠ (13 points).  Game ends when any player reaches 100+
        points; lowest score wins.

        The game proceeds through these phases:

        | Phase       | Value | Description |
        |-------------|-------|-------------|
        | Pass        | `0`   | Pass 3 cards to another player |
        | Play        | `1`   | Play a card to the current trick |
        | TrickEnd    | `2`   | Trick complete; view result |
        | RoundEnd    | `3`   | Round complete; view scores |
        | GameEnd     | `4`   | Game over; final standings |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `pass`  | —       | Pass 3 cards (requires `cardIndices`) |
        | `play`  | `p`     | Play a card (requires `cardIndex`) |
        | `next`  | `n`     | Advance to next trick |
        | `nextround` | `nr` | Advance to next round |
        | `setdifficulty` | `sd` | Set CPU difficulty (requires `config.difficulty`: 0=Easy, 1=Normal, 2=Hard) |
        | `setlimit` | `sl`  | Set point limit (requires `config.pointLimit`) |
        | `log`   | `l`     | View action log |
        | `quit`  | `q`     | End the session |
      operationId: heartsExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartsRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              pass:
                summary: Pass 3 cards
                value:
                  command: pass
                  cardIndices: [0, 3, 7]
                  sessionId: my-session-001
              play:
                summary: Play a card
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
              next:
                summary: Next trick
                value:
                  command: next
                  sessionId: my-session-001
              nextround:
                summary: Next round
                value:
                  command: nextround
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartsResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartsResponse'
              examples:
                paramError:
                  value:
                    players: []
                    phase: 0
                    roundNumber: 0
                    trickNumber: 0
                    currentPlayerIdx: 0
                    currentTrick: []
                    heartsBroken: false
                    passDirection: 0
                    gameEndFlag: false
                    winnerIdx: -1
                    message: param error.

  /memory/exec:
    post:
      tags:
        - memory
      summary: Execute a Memory game command
      description: |
        Send a command to advance the Memory (神経衰弱) game session identified by
        `sessionId`.  Memory is a 4-player concentration card game
        (1 human + 3 CPU).  52 cards are laid face-down; each turn a player
        flips 2 cards.  If they share the same rank the player takes the pair
        and gets another turn; otherwise the cards are flipped back and play
        passes to the next player.  Game ends when all 26 pairs are taken;
        most pairs wins.

        The game proceeds through these phases:

        | Phase       | Value | Description |
        |-------------|-------|-------------|
        | Flip1       | `0`   | First card flip |
        | Flip2       | `1`   | Second card flip |
        | Result      | `2`   | Flip result (match or mismatch) |
        | GameEnd     | `3`   | Game over; final standings |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game (accepts optional `config.cpuDifficulty`) |
        | `flip`  | `f`     | Flip a card (requires `position`) |
        | `next`  | `n`     | Advance after viewing result |
        | `log`   | `l`     | View action log |
      operationId: memoryExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              flip:
                summary: Flip a card
                value:
                  command: flip
                  position: 5
                  sessionId: my-session-001
              next:
                summary: Advance after result
                value:
                  command: next
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
              examples:
                paramError:
                  value:
                    players: []
                    phase: 0
                    board: []
                    currentPlayerIdx: 0
                    firstFlipPos: -1
                    secondFlipPos: -1
                    lastMatchResult: false
                    turnNumber: 0
                    gameEndFlag: false
                    winnerIdx: -1
                    message: param error.
                    config:
                      cpuDifficulty: 1

  /klondike/exec:
    post:
      tags:
        - klondike
      summary: Execute a Klondike game command
      description: |
        Send a command to advance the Klondike (ソリティア) game session identified by
        `sessionId`.  Klondike is a single-player solitaire card game using a
        standard 52-card deck.  7 tableau columns with cascading face-down/face-up
        cards, a stock pile, a waste pile, and 4 foundation piles (one per suit).
        Build foundations from Ace to King by suit; build tableau columns in
        descending rank with alternating colors.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All foundations completed; player wins |
        | GameOver   | `2`   | No more moves available; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`        | `r`  | Start / restart a game (optionally with `config`) |
        | `draw`         | `d`  | Draw card(s) from stock to waste (1 or 3 depending on draw mode) |
        | `move`         | `m`  | Move card(s) between zones (requires `from` and `to`) |
        | `giveup`       | `g`  | Give up the current game |
        | `hint`         | `h`  | Get a hint for the next move |
        | `autocomplete` | `ac` | Auto-complete remaining moves to foundation |
        | `undo`         | `u`  | Undo the last action |
        | `log`          | `l`  | View action log |
      operationId: klondikeExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KlondikeRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw from stock
                value:
                  command: draw
                  sessionId: my-session-001
              move:
                summary: Move a card
                value:
                  command: move
                  from:
                    zone: waste
                  to:
                    zone: tableau
                    col: 3
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlondikeResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KlondikeResponse'
              examples:
                paramError:
                  value:
                    tableau: []
                    stockCount: 0
                    waste: []
                    foundation: []
                    phase: 0
                    moveCount: 0
                    message: param error.

  /freecell/exec:
    post:
      tags:
        - freecell
      summary: Execute a FreeCell game command
      description: |
        Send a command to advance the FreeCell (フリーセル) game session identified by
        `sessionId`.  FreeCell is a single-player solitaire card game using a
        standard 52-card deck.  8 tableau columns (first 4 have 7 cards, last 4
        have 6 cards), all dealt face-up.  4 free cells for temporary single-card
        storage.  4 foundation piles: build up by suit Ace to King.  Tableau:
        descending rank, alternating colors; only King on empty column.
        Supermove: max movable cards = (1 + emptyFreeCells) x 2^(emptyTableauCols).

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All foundations completed; player wins |
        | GameOver   | `2`   | No more moves available; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`        | `r`  | Start / restart a game |
        | `move`         | `m`  | Move card(s) between zones (requires `from` and `to`) |
        | `giveup`       | `g`  | Give up the current game |
        | `hint`         | `h`  | Get a hint for the next move |
        | `autocomplete` | `ac` | Auto-complete remaining moves to foundation |
        | `undo`         | `u`  | Undo the last action |
        | `log`          | `l`  | View action log |
      operationId: freecellExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeCellRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              move:
                summary: Move a card
                value:
                  command: move
                  from:
                    zone: tableau
                    col: 0
                    cardIndex: 6
                  to:
                    zone: freecell
                    cell: 0
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeCellResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeCellResponse'
              examples:
                paramError:
                  value:
                    tableau: []
                    freeCells: []
                    foundation: []
                    phase: 0
                    moveCount: 0
                    canUndo: false
                    message: param error.

  /baccarat/exec:
    post:
      tags:
        - baccarat
      summary: Execute a Baccarat game command
      description: |
        Send a command to advance the Baccarat (バカラ) game session identified by
        `sessionId`.  Baccarat is a casino card game using a standard 52-card deck.
        Player bets on Player, Banker, or Tie, then cards are dealt automatically
        following baccarat third-card rules.  Card points: A=1, 2-9=face value,
        10/J/Q/K=0.  Hand value is the ones digit of the sum.

        The game proceeds through these phases:

        | Phase | Value | Description |
        |-------|-------|-------------|
        | Bet   | `1`   | Place a bet (amount and type) |
        | End   | `2`   | Round complete; shows result and payout |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place a bet (requires `amount` and `betType`) |
        | `log`   | `l`     | View action log |
      operationId: baccaratExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaccaratRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              betPlayer:
                summary: Bet 100 on Player
                value:
                  command: bet
                  amount: 100
                  betType: 0
                  sessionId: my-session-001
              betBanker:
                summary: Bet 200 on Banker
                value:
                  command: bet
                  amount: 200
                  betType: 1
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaccaratResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaccaratResponse'
              examples:
                paramError:
                  value:
                    playerHand: []
                    bankerHand: []
                    playerHandValue: 0
                    bankerHandValue: 0
                    phase: 0
                    chips: 0
                    betAmount: 0
                    betType: 0
                    result: 0
                    payout: 0
                    message: param error.

  /spades/exec:
    post:
      tags:
        - spades
      summary: Execute a Spades game command
      description: |
        Send a command to advance the Spades (スペード) game session identified by
        `sessionId`.  Spades is a 4-player trick-taking game where spades are always
        trump.  Players bid how many tricks they expect to win, then play 13 tricks.
        Scoring: made bid = bid×10 + overtricks (bags); failed = -bid×10; nil bid
        (0) success = +100, fail = -100; every 10 bags = -100 penalty.  First to 500
        wins; drop below -200 and lose.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Bid       | `0`   | Each player declares expected trick wins |
        | Play      | `1`   | Trick play (follow suit; spades are trump) |
        | TrickEnd  | `2`   | Trick resolved; advance with `next` |
        | RoundEnd  | `3`   | All 13 tricks played; advance with `nextround` |
        | GameEnd   | `4`   | A player reached the point limit or fell below -200 |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `bid`       | `b`     | Place a bid (requires `bid` field, 0-13) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `log`       | `l`     | View action log |
      operationId: spadesExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, sessionId]
              properties:
                command:
                  type: string
                sessionId:
                  type: string
                bid:
                  type: integer
                  minimum: 0
                  maximum: 13
                cardIndex:
                  type: integer
                config:
                  type: object
                  properties:
                    cpuDifficulty:
                      type: integer
                      minimum: 0
                      maximum: 2
                    pointLimit:
                      type: integer
                      minimum: 1
                      maximum: 1000
                    nilBonus:
                      type: integer
                      minimum: 0
                      maximum: 500
                    bagPenaltyThreshold:
                      type: integer
                      minimum: 1
                      maximum: 100
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bid:
                summary: Bid 3 tricks
                value:
                  command: bid
                  bid: 3
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)

  /crazyeights/exec:
    post:
      tags:
        - crazyeights
      summary: Execute a Crazy Eights game command
      description: |
        Send a command to advance the Crazy Eights (クレイジーエイト) game session
        identified by `sessionId`.  Crazy Eights is a 4-player shedding card game
        using a standard 52-card deck.  Players match the top discard by suit or rank,
        or play an 8 (wild) and choose the next suit.  Cannot play? Draw 1 card.
        Round ends when a player empties their hand; scoring: 8=50, J/Q/K=10, A=1,
        others=face value.  Match ends at the point limit (default 200).

        The game proceeds through these phases:

        | Phase        | Value | Description |
        |--------------|-------|-------------|
        | Play         | `0`   | Play a card or draw |
        | ChooseSuit   | `1`   | Choose suit after playing an 8 |
        | RoundEnd     | `2`   | A player emptied their hand; advance with `nextround` |
        | GameEnd      | `3`   | A player reached the point limit |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `draw`      | `d`     | Draw a card from the draw pile |
        | `suit`      | `s`     | Choose next suit after playing 8 (requires `suit`: 1-4) |
        | `nextround` | `nr`    | Score the round and start the next |
        | `log`       | `l`     | View action log |
      operationId: crazyeightsExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, sessionId]
              properties:
                command:
                  type: string
                sessionId:
                  type: string
                cardIndex:
                  type: integer
                suit:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: "Suit choice after playing an 8 (1=♠, 2=♣, 3=♥, 4=♦)"
                config:
                  type: object
                  properties:
                    cpuDifficulty:
                      type: integer
                      minimum: 0
                      maximum: 2
                    pointLimit:
                      type: integer
                      minimum: 1
                      maximum: 1000
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
              draw:
                summary: Draw a card
                value:
                  command: draw
                  sessionId: my-session-001
              suit:
                summary: Choose hearts as next suit
                value:
                  command: suit
                  suit: 3
                  sessionId: my-session-001
      responses:
        '200':
          description: |
            Command processed successfully.

            Response body includes:
            - `players` — array of player objects (hand, score, name)
            - `phase` — current game phase (0=Play, 1=ChooseSuit, 2=RoundEnd, 3=GameEnd)
            - `roundNumber` — current round number
            - `currentPlayerIdx` — index of the player whose turn it is
            - `discardTop` — the top card of the discard pile
            - `drawPileCount` — number of cards remaining in the draw pile
            - `chosenSuit` — suit chosen after playing an 8 (null if not applicable)
            - `gameEndFlag` — whether the match has ended
            - `winnerIdx` — index of the match winner (-1 if not ended)
            - `message` — human-readable status message
            - `messageCode` — machine-readable message key
            - `messageParams` — parameters for message interpolation
            - `config` — current game configuration
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)

components:
  schemas:
    # -------------------------------------------------------------------------
    # Shared types
    # -------------------------------------------------------------------------
    Card:
      type: object
      description: A single playing card
      required:
        - design
        - value
      properties:
        design:
          type: string
          description: |
            Card suit.  `JOKER` is only present in games that use a Joker
            (Old Maid, Daifugo, Sevens).
          enum: [SPADE, CLOVER, HEART, DIAMOND, JOKER]
          example: HEART
        value:
          type: integer
          description: |
            Card rank.  1 = Ace, 2–10 = pip, 11 = Jack, 12 = Queen, 13 = King.
            0 indicates the Joker.
          minimum: 0
          maximum: 13
          example: 7

    # -------------------------------------------------------------------------
    # BlackJack
    # -------------------------------------------------------------------------
    BlackJackRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bet` (`b`),
            `hit` (`h`), `stand` (`s`), `doubledown` (`d`), `split` (`sp`),
            `insurance` (`i`), `declineinsurance` (`di`), `togglesoft17` (`soft17`),
            `togglecounting` (`counting`), `toggledas` (`das`),
            `setcountingsystem` (`scs`), `setpenetration` (`pen`),
            `earlysurrender` (`es`), `declineearlysurrender` (`des`),
            `setsurrenderrule` (`ssr`), `quit` (`q`).
          enum: [r, reset, b, bet, h, hit, s, stand, d, doubledown, sp, split, i, insurance, di, declineinsurance, sur, surrender, togglehint, sd, setdeckcount, togglesoft17, soft17, togglecounting, counting, toggledas, das, scs, setcountingsystem, pen, setpenetration, es, earlysurrender, des, declineearlysurrender, ssr, setsurrenderrule, log, q, quit]
          example: hit
        amount:
          type: integer
          description: |
            Bet amount.  Required for `bet` command (minimum 10).
            Deck count for `setdeckcount` command (valid values: 1, 2, 4, 6, 8).
            Counting system for `setcountingsystem` command (0=Hi-Lo, 1=KO, 2=Zen Count, 3=Omega II).
            Penetration rate for `setpenetration` command (valid values: 50, 75).
            Surrender rule for `setsurrenderrule` command (0=Late, 1=Early, 2=No surrender).
            Ignored for other commands.
          minimum: 1
          example: 100
        dealerHitsSoft17:
          type: boolean
          description: |
            Whether the dealer hits on soft 17.  Only used with `reset` command.
            When true, dealer hits on soft 17 (H17); when false, dealer stands (S17).
            Defaults to false (S17) when omitted.
          example: false
        cpuPlayerCount:
          type: integer
          description: |
            Number of CPU players at the table (0–3).  Only used with `reset` command.
            CPU players use basic strategy.  Defaults to 0 when omitted.
          minimum: 0
          maximum: 3
          example: 0
        countingEnabled:
          type: boolean
          description: |
            Whether card counting display is enabled.  Only used with `reset` command.
            Defaults to false when omitted.
          example: false
        doubleAfterSplit:
          type: boolean
          description: |
            Whether double-after-split (DAS) is allowed.  Only used with `reset` command.
            Defaults to true when omitted.
          example: true
        countingSystem:
          type: integer
          description: |
            Card counting system (0=Hi-Lo, 1=KO, 2=Zen Count, 3=Omega II).
            Only used with `reset` command.  Defaults to 0 (Hi-Lo) when omitted.
          minimum: 0
          maximum: 3
          example: 0
        deckPenetration:
          type: integer
          description: |
            Deck penetration rate in percent (50 or 75).
            Only used with `reset` command.  Defaults to 75 when omitted.
            At 75%, the shoe is reshuffled when less than 25% of cards remain.
            At 50%, the shoe is reshuffled when less than 50% of cards remain.
          enum: [50, 75]
          example: 75
        perfectPairsBet:
          type: integer
          description: |
            Perfect Pairs side bet amount.  Only used with `bet` command.
            Must be 0 (no bet) or a positive multiple of 10.
            Defaults to 0 when omitted.
          minimum: 0
          example: 0
        twentyOnePlus3Bet:
          type: integer
          description: |
            21+3 side bet amount.  Only used with `bet` command.
            Must be 0 (no bet) or a positive multiple of 10.
            Defaults to 0 when omitted.
          minimum: 0
          example: 0
        handCount:
          type: integer
          description: |
            Number of initial hands to deal (1–3).  Only used with `bet` command.
            Each hand receives the same bet amount.  Side bets apply only to hand 0.
            Defaults to 1 when omitted.  0 is treated as 1.
          minimum: 0
          maximum: 3
          example: 1
        surrenderRule:
          type: integer
          description: |
            Surrender rule (0=Late surrender, 1=Early surrender, 2=No surrender).
            Only used with `reset` command.  Defaults to 0 (Late surrender) when omitted.
          minimum: 0
          maximum: 2
          example: 0
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    BlackJackPlayer:
      type: object
      required:
        - chips
      properties:
        score:
          type: integer
          description: |
            Hand score.  Present only for the **dealer**.  `0` while the game
            is in progress; the actual score once the game ends.  For the
            **player**, score is available via the `hands` array.
          example: 18
        cards:
          type: array
          description: |
            Cards currently held.  Present only for the **dealer**.  Only the
            face-up card (index 0) is returned while the game is in progress;
            all cards are returned once the game ends.  For the **player**,
            cards are available via the `hands` array.
          items:
            $ref: '#/components/schemas/Card'
        chips:
          type: integer
          description: Current chip count for this player.
          example: 1000

    BlackJackHand:
      type: object
      required:
        - score
        - cards
        - bet
        - stood
        - doubled
        - busted
        - isBlackJack
        - canSplit
        - surrendered
        - canSurrender
      properties:
        score:
          type: integer
          description: Hand score (Ace counted optimally as 1 or 11).
          example: 18
        cards:
          type: array
          description: Cards in this hand.
          items:
            $ref: '#/components/schemas/Card'
        bet:
          type: integer
          description: Bet amount for this hand.
          example: 100
        stood:
          type: boolean
          description: Whether the player has stood on this hand.
        doubled:
          type: boolean
          description: Whether the player doubled down on this hand.
        busted:
          type: boolean
          description: Whether this hand has busted (score > 21).
        isBlackJack:
          type: boolean
          description: Whether this hand is a natural blackjack (2 cards, score 21).
        canSplit:
          type: boolean
          description: Whether this hand can be split (2 cards of equal BJ value).
        surrendered:
          type: boolean
          description: Whether the player surrendered this hand.
        canSurrender:
          type: boolean
          description: Whether the player can surrender this hand (exactly 2 cards, action phase, not yet stood/busted/surrendered).

    BlackJackResponse:
      type: object
      required:
        - dealer
        - player
        - phase
        - currentHandIdx
        - insuranceBet
        - insuranceAvailable
        - message
        - hintEnabled
        - suggestedAction
        - deckCount
        - dealerHitsSoft17
        - countingEnabled
        - cpuPlayerCount
        - runningCount
        - trueCount
        - perfectPairsBet
        - twentyOnePlus3Bet
        - doubleAfterSplit
      properties:
        dealer:
          $ref: '#/components/schemas/BlackJackPlayer'
        player:
          $ref: '#/components/schemas/BlackJackPlayer'
        hands:
          type: array
          description: |
            Player hands.  Contains 1–3 initial hands (based on `handCount` in bet);
            may grow further after splits (up to 4 per initial hand, 8 total).
            Not present in bet phase.
          items:
            $ref: '#/components/schemas/BlackJackHand'
        phase:
          type: integer
          description: |
            Current game phase:
            - `1` — Bet phase
            - `2` — Deal phase
            - `3` — Insurance phase
            - `4` — Action phase
            - `5` — End phase
            - `6` — Early Surrender phase (only when surrender rule = Early)
          enum: [1, 2, 3, 4, 5, 6]
          example: 4
        currentHandIdx:
          type: integer
          description: |
            Index of the currently active hand (0-based).
            Relevant when player has split into multiple hands.
          example: 0
        insuranceBet:
          type: integer
          description: Amount of insurance bet placed (0 if none).
          example: 0
        insuranceAvailable:
          type: boolean
          description: Whether insurance is available (dealer shows Ace).
        message:
          type: string
          description: |
            Game result message.  One of:
            - `""` — game in progress
            - `"It is a draw."` — tie
            - `"You are the winner."` — player wins
            - `"It is your loss."` — player loses
            - `"bye."` — session ended by quit command
            - `"param error."` — invalid request
            - `"error."` — internal error
          example: You are the winner.
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hintEnabled:
          type: boolean
          description: Whether the basic strategy hint is currently enabled.
          example: false
        suggestedAction:
          type: integer
          description: |
            Basic strategy suggested action for the current hand (0 when hint is disabled or no suggestion).
            - `0` — None
            - `1` — Hit
            - `2` — Stand
            - `3` — Double Down (else Hit)
            - `4` — Split
            - `5` — Surrender
            - `6` — Decline Insurance
            - `7` — Double Down (else Stand)
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
          example: 1
        deckCount:
          type: integer
          description: |
            Number of decks in the shoe.  Valid values: 1, 2, 4, 6, 8.
          enum: [1, 2, 4, 6, 8]
          example: 1
        dealerHitsSoft17:
          type: boolean
          description: Whether the dealer hits on soft 17 (H17).  False means dealer stands on soft 17 (S17).
          example: false
        countingEnabled:
          type: boolean
          description: Whether card counting display is currently enabled.
          example: false
        cpuPlayerCount:
          type: integer
          description: Number of CPU players at the table (0–3).
          minimum: 0
          maximum: 3
          example: 0
        doubleAfterSplit:
          type: boolean
          description: Whether double-after-split (DAS) is currently allowed.
          example: true
        countingSystem:
          type: integer
          description: |
            Current card counting system (0=Hi-Lo, 1=KO, 2=Zen Count, 3=Omega II).
          minimum: 0
          maximum: 3
          example: 0
        deckPenetration:
          type: integer
          description: |
            Current deck penetration rate in percent (50 or 75).
            Controls when the shoe is reshuffled based on remaining cards.
          enum: [50, 75]
          example: 75
        runningCount:
          type: integer
          description: |
            Running count based on the active counting system.  Only meaningful when `countingEnabled` is true.
            Positive values favor the player; negative values favor the dealer.
          example: 0
        trueCount:
          type: number
          description: |
            True count (running count divided by estimated remaining decks).
            Only meaningful when `countingEnabled` is true.  Returns 0 for unbalanced systems (KO).
          example: 0.0
        cpuPlayers:
          type: array
          description: |
            CPU player seats.  Empty array when `cpuPlayerCount` is 0.
            Each entry contains the CPU player's chip count and hands.
          items:
            $ref: '#/components/schemas/BlackJackCpuSeat'
        perfectPairsBet:
          type: integer
          description: Current Perfect Pairs side bet amount (0 if no side bet placed).
          example: 0
        twentyOnePlus3Bet:
          type: integer
          description: Current 21+3 side bet amount (0 if no side bet placed).
          example: 0
        sideBetResults:
          type: array
          description: |
            Side bet evaluation results.  Present after dealing when side bets were placed.
            Each entry describes one side bet outcome (win or loss).
          items:
            $ref: '#/components/schemas/BlackJackSideBetResult'
        multiHandCount:
          type: integer
          description: |
            Number of initial hands dealt this round (1–3).
            0 means the default single hand.  Only meaningful after a bet has been placed.
          minimum: 0
          maximum: 3
          example: 1
        surrenderRule:
          type: integer
          description: |
            Current surrender rule:
            - `0` — Late surrender (default; surrender allowed after dealer BJ check)
            - `1` — Early surrender (surrender allowed before dealer BJ check)
            - `2` — No surrender (surrender disabled)
          minimum: 0
          maximum: 2
          example: 0

    BlackJackSideBetResult:
      type: object
      description: Result of a single side bet evaluation
      required:
        - betType
        - resultType
        - resultName
        - betAmount
        - payout
      properties:
        betType:
          type: integer
          description: |
            Side bet type:
            - `1` — Perfect Pairs
            - `2` — 21+3
          enum: [1, 2]
          example: 1
        resultType:
          type: integer
          description: |
            Result type.  For Perfect Pairs:
            - `0` — None (no pair)
            - `1` — Perfect Pair (same suit, same value; 25:1)
            - `2` — Colored Pair (same color, same value; 12:1)
            - `3` — Mixed Pair (different color, same value; 6:1)

            For 21+3:
            - `0` — None (no hand)
            - `1` — Suited Trips (same suit, same value; 100:1)
            - `2` — Straight Flush (same suit, consecutive; 40:1)
            - `3` — Three of a Kind (same value, different suits; 30:1)
            - `4` — Straight (consecutive values; 10:1)
            - `5` — Flush (same suit; 5:1)
          example: 1
        resultName:
          type: string
          description: Human-readable name of the result (e.g., "Perfect Pair", "Straight Flush").
          example: Perfect Pair
        betAmount:
          type: integer
          description: Amount wagered on this side bet.
          example: 10
        payout:
          type: integer
          description: Payout amount (0 if lost; betAmount × multiplier if won).
          example: 250

    BlackJackCpuSeat:
      type: object
      description: A CPU player seat in a multi-player BlackJack game
      required:
        - chips
        - hands
        - insuranceBet
      properties:
        chips:
          type: integer
          description: Current chip count for this CPU player.
          example: 1000
        hands:
          type: array
          description: Hands for this CPU player (one hand normally; multiple after split).
          items:
            $ref: '#/components/schemas/BlackJackHand'
        insuranceBet:
          type: integer
          description: |
            Amount of insurance bet placed by this CPU player (0 if none).
            CPUs take insurance when card counting is enabled and the count >= 3.
          example: 0

    # -------------------------------------------------------------------------
    # Poker
    # -------------------------------------------------------------------------
    PokerRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `exchange` (`e`),
            `stand` (`s`), `bet` (`b`), `call` (`c`), `raise` (`ra`),
            `check` (`ck`), `fold` (`f`), `allin` (`a`), `odds` (`o`), `quit` (`q`).
          enum: [r, reset, e, exchange, s, stand, b, bet, c, call, ra, raise, ck, check, f, fold, a, allin, o, odds, log, q, quit]
          example: bet
        indices:
          type: array
          description: |
            Zero-based indices of cards to exchange (for the `exchange` command)
            or to calculate draw odds for (for the `odds` command).
            Omit or send an empty array to keep all cards.
          items:
            type: integer
            minimum: 0
            maximum: 4
          example: [0, 2]
        amount:
          type: integer
          description: |
            Bet/raise amount (for the `bet` and `raise` commands).
            Minimum bet is 10.
          minimum: 10
          example: 20
        cpuCount:
          type: integer
          description: Number of CPU players (used with `reset` command)
          minimum: 1
          maximum: 3
          example: 2
        jokerCount:
          type: integer
          description: Number of joker cards (used with `reset` command)
          minimum: 0
          maximum: 2
          example: 1
        bettingLimit:
          type: integer
          description: |
            Betting limit type (used with `reset` command).
            0 = Fixed (default), 1 = Pot Limit, 2 = No Limit.
          minimum: 0
          maximum: 2
          example: 0
        isLowball:
          type: boolean
          description: |
            Enable 2-7 Lowball mode (used with `reset` command).
            When true, the lowest hand wins. Ace always counts as 14,
            straights and flushes count against the player, and jokers
            are forced to rank 0. Best hand is 2-3-4-5-7 off-suit.
          example: false
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    PokerPlayerData:
      type: object
      required:
        - id
        - isHuman
        - cards
        - chips
        - currentBet
        - folded
        - allIn
        - handRank
        - handName
        - exchangeCount
        - playStyleName
      properties:
        id:
          type: integer
          description: Player index (0 = human)
        isHuman:
          type: boolean
        cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: Player's cards. CPU cards hidden (empty) until End phase.
        chips:
          type: integer
          minimum: 0
        currentBet:
          type: integer
          minimum: 0
        folded:
          type: boolean
        allIn:
          type: boolean
        handRank:
          type: integer
          description: "0=HighCard..9=RoyalFlush, 10=FiveOfAKind (joker only)"
          minimum: 0
          maximum: 10
        handName:
          type: string
        exchangeCount:
          type: integer
          minimum: -1
        playStyleName:
          type: string
          description: "CPU play style name (Conservative/Balanced/Aggressive/Bluffer)"

    PokerCpuAction:
      type: object
      properties:
        playerIdx:
          type: integer
        action:
          type: integer
          description: "0=Fold,1=Check,2=Call,3=Bet,4=Raise,5=AllIn"
        amount:
          type: integer

    PokerCpuExchange:
      type: object
      properties:
        playerIdx:
          type: integer
        exchangeCount:
          type: integer

    PokerResult:
      type: object
      properties:
        playerIdx:
          type: integer
        handRank:
          type: integer
        handName:
          type: string
        kickers:
          type: string
          description: Kicker card values formatted as display string (e.g., "A, Q, 10"). Empty for hands without kickers.
        wonAmount:
          type: integer

    PokerSidePot:
      type: object
      properties:
        amount:
          type: integer
        eligiblePlayers:
          type: array
          items:
            type: integer

    PokerOdds:
      type: object
      description: Draw odds for a single hand rank
      required:
        - handRank
        - handName
        - probability
        - count
        - total
      properties:
        handRank:
          type: integer
          description: "Hand rank index (0=HighCard..10=FiveOfAKind)"
          minimum: 0
          maximum: 10
        handName:
          type: string
          description: Human-readable hand name (e.g. "Flush", "Full House")
        probability:
          type: number
          format: double
          description: Probability of achieving this hand (0.0 to 1.0)
          minimum: 0
          maximum: 1
        count:
          type: integer
          description: Number of combinations that result in this hand
          minimum: 0
        total:
          type: integer
          description: Total number of combinations evaluated
          minimum: 0

    PokerResponse:
      type: object
      required:
        - players
        - pot
        - sidePots
        - dealerIdx
        - currentTurn
        - phase
        - gameEndFlag
        - lastBet
        - minRaise
        - ante
        - jokerCount
        - roundResults
        - cpuActions
        - cpuExchanges
        - message
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/PokerPlayerData'
        pot:
          type: integer
          minimum: 0
        sidePots:
          type: array
          items:
            $ref: '#/components/schemas/PokerSidePot'
        dealerIdx:
          type: integer
        currentTurn:
          type: integer
        phase:
          type: integer
          description: |
            Current game phase:
            - `0` — Init (no cards dealt yet)
            - `1` — Deal (first betting round)
            - `2` — Exchange (player can exchange cards)
            - `3` — SecondBet (second betting round)
            - `4` — End (showdown; all hands visible)
          enum: [0, 1, 2, 3, 4]
        gameEndFlag:
          type: boolean
        lastBet:
          type: integer
        minRaise:
          type: integer
        ante:
          type: integer
        jokerCount:
          type: integer
        bettingLimit:
          type: integer
          description: |
            Betting limit type: 0 = Fixed, 1 = Pot Limit, 2 = No Limit.
          enum: [0, 1, 2]
        raiseCount:
          type: integer
          description: Number of raises in the current betting round.
          minimum: 0
        maxBetAmount:
          type: integer
          description: |
            Maximum allowed bet/raise amount for Pot Limit mode.
            0 means no limit (Fixed or No Limit mode).
          minimum: 0
        isLowball:
          type: boolean
          description: Whether 2-7 Lowball mode is active.
        roundResults:
          type: array
          items:
            $ref: '#/components/schemas/PokerResult'
        cpuActions:
          type: array
          items:
            $ref: '#/components/schemas/PokerCpuAction'
        cpuExchanges:
          type: array
          items:
            $ref: '#/components/schemas/PokerCpuExchange'
        odds:
          type: array
          description: |
            Draw odds for each hand rank.  Only present when the `odds` command
            is used during the exchange phase.
          items:
            $ref: '#/components/schemas/PokerOdds'
        message:
          type: string
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Old Maid
    # -------------------------------------------------------------------------
    OldMaidRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `draw` (`d`),
            `shuffle` (`s`), `reorder`, `quit` (`q`).
          enum: [r, reset, d, draw, s, shuffle, reorder, log, q, quit]
          example: draw
        drawIdx:
          type: integer
          description: |
            Zero-based index of the card to draw from the target player's hand.
            Omit (or send `null`) for random selection.
          nullable: true
          minimum: 0
          example: 1
        reorderIndices:
          type: array
          description: |
            Permutation of indices for reordering the human player's hand.
            Required when command is `reorder`. Must be a valid permutation of
            `[0, 1, ..., handSize-1]`.
          nullable: true
          items:
            type: integer
            minimum: 0
          example: [2, 0, 1]
        mode:
          type: integer
          description: Game mode (0=Normal/ババ抜き, 1=JijiNuki/ジジ抜き)
          default: 0
          example: 0
        cpuPlacementStrategy:
          type: boolean
          description: When true, CPUs place the odd card at the edge of their hand
          default: false
          example: false
        cpuMemoryAI:
          type: boolean
          description: When true, CPUs remember draw positions and adjust selection strategy
          default: false
          example: false
        cpuHesitationEnabled:
          type: boolean
          description: When true, CPU actions include a hesitation delay (ms) that varies based on draw outcome
          default: false
          example: false
        cpuMetaAI:
          type: boolean
          description: When true, CPUs adaptively adjust their strategy based on session-scoped game history (Meta-AI)
          default: false
          example: false
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    OldMaidPlayer:
      type: object
      required:
        - id
        - isHuman
        - isFinished
        - cardCount
        - cards
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this is the human player
          example: true
        isFinished:
          type: boolean
          description: Whether this player has finished (all cards matched and discarded)
          example: false
        cardCount:
          type: integer
          description: Number of cards remaining in hand
          example: 13
        cards:
          type: array
          description: Cards in hand.  CPU players' cards are always an empty array.
          items:
            $ref: '#/components/schemas/Card'

    OldMaidCpuAction:
      type: object
      description: Record of a CPU player's draw action during their turn
      required:
        - drawPlayerIdx
        - drawFromIdx
        - drawnCard
        - discardedPairs
      properties:
        drawPlayerIdx:
          type: integer
          description: Index of the CPU player who performed the draw
          example: 1
        drawFromIdx:
          type: integer
          description: Index of the player the card was drawn from
          example: 0
        drawnCard:
          $ref: '#/components/schemas/Card'
        discardedPairs:
          type: integer
          description: Number of pairs discarded as a result of this draw
          example: 1
        hesitationMs:
          type: integer
          description: CPU hesitation delay in milliseconds (0 when feature is disabled)
          example: 750

    OldMaidDrawHistoryEntry:
      type: object
      description: A single draw event in the game-wide draw history (card info omitted for fairness)
      required:
        - drawPlayerIdx
        - drawFromIdx
        - discardedPairs
        - drawerFinished
        - targetFinished
      properties:
        drawPlayerIdx:
          type: integer
          description: Index of the player who drew a card
          example: 0
        drawFromIdx:
          type: integer
          description: Index of the player the card was drawn from
          example: 1
        discardedPairs:
          type: integer
          description: Number of pairs discarded as a result of this draw
          example: 0
        drawerFinished:
          type: boolean
          description: Whether the drawing player finished (0 cards) after this draw
          example: false
        targetFinished:
          type: boolean
          description: Whether the target player finished (0 cards) after this draw
          example: true

    OldMaidResponse:
      type: object
      required:
        - players
        - currentTurn
        - nextDrawTargetIdx
        - gameEndFlag
        - loserIdx
        - lastDrawPlayerIdx
        - lastDrawFromIdx
        - lastDrawCard
        - lastDiscardedPairs
        - hasDrawn
        - cpuActions
        - message
        - cpuHighlightedCardIdx
        - mode
      properties:
        players:
          type: array
          description: State of all 4 players
          items:
            $ref: '#/components/schemas/OldMaidPlayer'
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        nextDrawTargetIdx:
          type: integer
          description: Index of the player the human must draw from on their next turn
          example: 1
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        loserIdx:
          type: integer
          description: Index of the losing player (-1 while game is in progress)
          example: -1
        lastDrawPlayerIdx:
          type: integer
          description: Index of the player who last drew a card
          example: 0
        lastDrawFromIdx:
          type: integer
          description: Index of the player the last card was drawn from
          example: 1
        lastDrawCard:
          allOf:
            - $ref: '#/components/schemas/Card'
          nullable: true
          description: The card drawn most recently (null before any draw)
        lastDiscardedPairs:
          type: integer
          description: Number of pairs discarded after the last draw
          example: 0
        hasDrawn:
          type: boolean
          description: Whether the human player has drawn this turn
          example: false
        cpuActions:
          type: array
          description: List of CPU actions that occurred since the last human action
          items:
            $ref: '#/components/schemas/OldMaidCpuAction'
        drawHistory:
          type: array
          description: Full draw history throughout the entire game (card info omitted for fairness)
          items:
            $ref: '#/components/schemas/OldMaidDrawHistoryEntry'
        message:
          type: string
          description: |
            Game result or status message.  Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        cpuHighlightedCardIdx:
          type: integer
          description: Index of the highlighted card for the target CPU player (-1 if none)
          example: -1
        removedCard:
          allOf:
            - $ref: '#/components/schemas/Card'
          nullable: true
          description: The removed card (only revealed at game end in JijiNuki mode)
        mode:
          type: integer
          description: Current game mode (0=Normal/ババ抜き, 1=JijiNuki/ジジ抜き)
          example: 0
        metaAI:
          type: object
          nullable: true
          description: Meta-AI state for the current session (null when Meta-AI is disabled)
          properties:
            enabled:
              type: boolean
              description: Whether Meta-AI is enabled
              example: true
            gamesPlayed:
              type: integer
              description: Number of games played in the current session
              example: 3
            edgePickRate:
              type: number
              format: float
              description: Rate at which the human player picks edge cards (0.0–1.0)
              example: 0.45

    # -------------------------------------------------------------------------
    # Daifugo
    # -------------------------------------------------------------------------
    DaifugoRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `play` (`p`),
            `sort`, `quit` (`q`).
          enum: [r, reset, p, play, sort, log, q, quit]
          example: play
        indices:
          type: array
          description: |
            Zero-based indices of cards to play (for the `play` command).
            Send an empty array to pass.
          items:
            type: integer
            minimum: 0
          maxItems: 13
          example: [0, 1]
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001
        config:
          allOf:
            - $ref: '#/components/schemas/DaifugoConfig'
          nullable: true
          description: |
            Optional rule configuration for the `reset` command.
            When present, overrides the current session's rule settings.
            Omit (or set to null) to reuse the previous configuration.
        sortMode:
          type: integer
          nullable: true
          description: |
            Sort mode for the `sort` command.
            0 = by strength (default), 1 = by suit, 2 = by number.
          enum: [0, 1, 2]
          example: 0

    DaifugoPlayer:
      type: object
      required:
        - id
        - isHuman
        - isFinished
        - rank
        - cardCount
        - cards
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this is the human player
          example: true
        isFinished:
          type: boolean
          description: Whether this player has played all their cards
          example: false
        rank:
          type: integer
          description: |
            Final rank once the game ends (-1 while game is in progress).
            1 = 大富豪, 2 = 富豪, 3 = 平民, 4 = 大貧民.
          example: -1
        cardCount:
          type: integer
          description: Number of cards remaining in hand
          example: 8
        cards:
          type: array
          description: Cards in hand (only populated for the human player)
          items:
            $ref: '#/components/schemas/Card'
        illegalFinishPenalty:
          type: boolean
          description: Whether this player received an illegal finish penalty (反則上がり)
          example: false

    DaifugoAction:
      type: object
      description: Record of a player's action (play or pass)
      required:
        - playerIdx
        - playedCards
      properties:
        playerIdx:
          type: integer
          description: Index of the player who acted
          example: 1
        playedCards:
          type: array
          description: Cards played.  Null indicates a pass.
          nullable: true
          items:
            $ref: '#/components/schemas/Card'

    DaifugoConfig:
      type: object
      properties:
        jokerCount:
          type: integer
          description: Number of jokers in the deck
          example: 2
        eightCutEnabled:
          type: boolean
          description: Whether 8切り (eight-cut) rule is enabled
          example: true
        suitLockMode:
          type: integer
          description: "Suit lock mode: 0=none, 1=partial, 2=full"
          enum: [0, 1, 2]
          example: 1
        elevenBackEnabled:
          type: boolean
          description: Whether 11バック (eleven-back) rule is enabled
          example: true
        sequenceEnabled:
          type: boolean
          description: Whether 階段 (sequence/straight) rule is enabled
          example: true
        cardExchangeEnabled:
          type: boolean
          description: Whether カード交換 (card exchange) based on previous ranks is enabled
          example: true
        blindExchangeEnabled:
          type: boolean
          description: Whether ブラインドカード交換 (blind card exchange — upper-rank player gives random cards instead of weakest) rule is enabled (default false)
          example: false
        fiveSkipEnabled:
          type: boolean
          description: Whether 5飛び (five-skip) rule is enabled (default false)
          example: false
        fiveSkipCount:
          type: integer
          description: Number of players to skip per 5 card
          minimum: 1
          maximum: 5
          example: 1
        sevenPassEnabled:
          type: boolean
          description: Whether 7渡し (seven-pass) rule is enabled (default false)
          example: false
        tenDiscardEnabled:
          type: boolean
          description: Whether 10捨て (ten-discard) rule is enabled (default false)
          example: false
        spadeThreeEnabled:
          type: boolean
          description: Whether スペ3返し (spade-three counter) rule is enabled (default false)
          example: false
        capitalFallEnabled:
          type: boolean
          description: Whether 都落ち (capital-fall) rule is enabled (default false)
          example: false
        nineReverseEnabled:
          type: boolean
          description: Whether 9リバース (nine-reverse) rule is enabled (default false)
          example: false
        coupDetatEnabled:
          type: boolean
          description: Whether クーデター (coup d'état — 3 nines = revolution) rule is enabled (default false)
          example: false
        numberLockEnabled:
          type: boolean
          description: Whether 激シバ (number lock) rule is enabled (default false)
          example: false
        queenBomberEnabled:
          type: boolean
          description: Whether Qボンバー (queen bomber) rule is enabled (default false)
          example: false
        sandstormEnabled:
          type: boolean
          description: Whether 砂嵐 (sandstorm — 3 non-joker 3s clear the table like 8-cut) rule is enabled (default false)
          example: false
        emperorEnabled:
          type: boolean
          description: Whether エンペラー (emperor — 4 consecutive cards of all different suits on clear table triggers revolution + table clear) rule is enabled (default false)
          example: false
        sequenceRevolutionEnabled:
          type: boolean
          description: Whether 階段革命 (sequence revolution — 4+ card sequences trigger revolution) rule is enabled (default false)
          example: false
        sequenceLockEnabled:
          type: boolean
          description: Whether 階段縛り (sequence lock — playing a sequence on a sequence locks to sequences; persists across table clears) rule is enabled (default false)
          example: false
        illegalFinishEnabled:
          type: boolean
          description: Whether 反則上がり (illegal finish — finishing with 8-cut, joker, or revolution is penalized) rule is enabled (default false)
          example: false
        cpuDifficulty:
          type: integer
          description: |
            CPU difficulty level.
            0 = Normal (default, balanced AI with card preservation),
            1 = Easy (simple greedy play),
            2 = Hard (strategic AI that adapts to opponent hand sizes)
          enum: [0, 1, 2]
          example: 0

    DaifugoExchangeAction:
      type: object
      properties:
        fromPlayerIdx:
          type: integer
          description: Index of the player who gave cards
          example: 3
        toPlayerIdx:
          type: integer
          description: Index of the player who received cards
          example: 0
        cards:
          type: array
          description: Cards that were exchanged
          items:
            $ref: '#/components/schemas/Card'

    DaifugoResponse:
      type: object
      required:
        - players
        - currentTurn
        - tableCards
        - lastPlayPlayerIdx
        - gameEndFlag
        - revolutionActive
        - elevenBackActive
        - suitLocked
        - lockedSuit
        - tableIsSequence
        - config
        - exchangeActions
        - cpuActions
        - humanAction
        - message
        - pendingAction
        - pendingActionTarget
        - reverseDirection
        - numberLocked
        - sequenceLocked
        - sortMode
      properties:
        players:
          type: array
          description: State of all 4 players
          items:
            $ref: '#/components/schemas/DaifugoPlayer'
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        tableCards:
          type: array
          description: Cards currently on the table (last played set)
          items:
            $ref: '#/components/schemas/Card'
        lastPlayPlayerIdx:
          type: integer
          description: Index of the player who last played cards
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        revolutionActive:
          type: boolean
          description: Whether revolution is active (strength order reversed)
          example: false
        elevenBackActive:
          type: boolean
          description: Whether 11-back is active (temporary strength reversal)
          example: false
        suitLocked:
          type: boolean
          description: Whether suit lock is active
          example: false
        lockedSuit:
          type: string
          description: The locked suit name (e.g. SPADE, HEART) when suitLocked is true
          example: ""
        tableIsSequence:
          type: boolean
          description: Whether the current table play is a sequence (階段)
          example: false
        config:
          $ref: '#/components/schemas/DaifugoConfig'
        exchangeActions:
          type: array
          description: Card exchange actions that occurred at game start (based on previous rankings)
          items:
            $ref: '#/components/schemas/DaifugoExchangeAction'
        cpuActions:
          type: array
          description: CPU actions that occurred after the human's last action
          items:
            $ref: '#/components/schemas/DaifugoAction'
        humanAction:
          allOf:
            - $ref: '#/components/schemas/DaifugoAction'
          nullable: true
          description: The human player's most recent action (null before first play)
        message:
          type: string
          description: |
            Game result or status message.  Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        pendingAction:
          type: string
          description: |
            Pending action that the current player must resolve before turn advances.
            `none` = no pending action; `sevenPass` = must give a card (7渡し);
            `tenDiscard` = must discard a card (10捨て);
            `queenBomber` = must discard a card from target player (Qボンバー).
          enum: [none, sevenPass, tenDiscard, queenBomber]
          example: none
        pendingActionTarget:
          type: integer
          description: |
            For `sevenPass`, the index of the player to give the card to.
            -1 when no pending action.
          example: -1
        reverseDirection:
          type: boolean
          description: Whether turn direction is reversed (9リバース)
          example: false
        numberLocked:
          type: boolean
          description: Whether number lock (連番縛り / 激シバ) is active
          example: false
        sequenceLocked:
          type: boolean
          description: Whether sequence lock (階段縛り) is active — only sequences or emperor can be played when table is clear
          example: false
        sortMode:
          type: integer
          description: |
            Current sort mode for the human player's hand.
            0 = by strength, 1 = by suit, 2 = by number.
          example: 0

    # -------------------------------------------------------------------------
    # Sevens
    # -------------------------------------------------------------------------
    SevensRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `play` (`p`),
            `joker` (`j`), `quit` (`q`).
          enum: [r, reset, p, play, j, joker, log, q, quit]
          example: play
        index:
          type: integer
          description: |
            Zero-based index of the card to play (for the `play` and `joker` commands).
            Use `-1` to pass (play command only).
          default: -1
          example: 3
        jokerTargetSuit:
          type: integer
          description: |
            Target suit for joker placement (for the `joker` command).
            1 = SPADE, 2 = CLOVER, 3 = HEART, 4 = DIAMOND.
          default: 0
          example: 1
        jokerTargetValue:
          type: integer
          description: |
            Target value for joker placement (for the `joker` command).
            Range: 1–13.
          default: 0
          example: 6
        tunnelEnabled:
          type: boolean
          description: |
            Enable tunnel rule (A↔K circular). Only used with `reset` command.
          example: false
        tunnelSkipWidth:
          type: integer
          description: |
            Tunnel skip width (0 = disabled, 2–12 = add ±N skip connections).
            When tunnelEnabled is true, skip connections wrap around (A↔K circular).
            Only used with `reset` command.
          minimum: 0
          maximum: 12
          default: 0
          example: 0
        jokerCount:
          type: integer
          description: |
            Number of jokers in the deck (0–2). Only used with `reset` command.
          minimum: 0
          maximum: 2
          example: 0
        cpuStrategy:
          type: integer
          description: |
            CPU strategy mode (0 = simple, 1 = strategic, 2 = harassment). Only used with `reset` command.
          enum: [0, 1, 2]
          example: 0
        maxPasses:
          type: integer
          description: |
            Maximum number of passes per player (0 = unlimited). Only used with `reset` command.
          minimum: 0
          default: 5
          example: 5
        noJokerFinish:
          type: boolean
          description: |
            Ban finishing the game by playing a joker as the last card. Only used with `reset` command.
          example: false
        jokerReclaim:
          type: boolean
          description: |
            Enable joker reclaim rule (playing a real card on a joker-occupied position returns the joker to the player's hand). Only used with `reset` command.
          example: false
        endStop:
          type: boolean
          description: |
            Enable end stop rule (片側ストップ). When A is placed, the high side (8–K) is blocked; when K is placed, the low side (A–6) is blocked. Only used with `reset` command.
          example: false
        jokerConsecutiveBanned:
          type: boolean
          description: |
            Enable joker consecutive banned rule (ジョーカー連続禁止). When enabled, a player who played a joker on their last turn cannot play a joker on the current turn. Playing a normal card or passing resets the restriction. Only used with `reset` command.
          example: false
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    SevensPlayer:
      type: object
      required:
        - id
        - isHuman
        - isFinished
        - rank
        - cardCount
        - passesUsed
        - maxPasses
        - cards
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this is the human player
          example: true
        isFinished:
          type: boolean
          description: Whether this player has played all their cards
          example: false
        rank:
          type: integer
          description: |
            Final rank once the player finishes (-1 while still playing).
          example: -1
        cardCount:
          type: integer
          description: Number of cards remaining in hand
          example: 5
        passesUsed:
          type: integer
          description: Number of passes the player has used
          example: 0
        maxPasses:
          type: integer
          description: Maximum number of passes allowed
          example: 3
        cards:
          type: array
          description: Cards in hand (only populated for the human player)
          items:
            $ref: '#/components/schemas/Card'
        lastPlayedJoker:
          type: boolean
          description: Whether this player played a joker on their last turn (only meaningful for the human player when jokerConsecutiveBanned is enabled)
          example: false

    SevensAction:
      type: object
      description: Record of a player's action (play or pass)
      required:
        - playerIdx
        - playedCard
        - targetSuit
        - targetValue
      properties:
        playerIdx:
          type: integer
          description: Index of the player who acted
          example: 1
        playedCard:
          allOf:
            - $ref: '#/components/schemas/Card'
          nullable: true
          description: The card played.  Null indicates a pass.
        targetSuit:
          type: integer
          description: |
            Target suit for joker placement (0 for non-joker plays).
          example: 0
        targetValue:
          type: integer
          description: |
            Target value for joker placement (0 for non-joker plays).
          example: 0
        forcedPass:
          type: boolean
          description: |
            Whether the pass was forced (player had no playable cards).
            Only meaningful when `playedCard` is null.
          example: false

    SevensConfig:
      type: object
      description: Game configuration for optional rules
      required:
        - tunnelEnabled
        - tunnelSkipWidth
        - jokerCount
        - cpuStrategy
        - maxPasses
        - noJokerFinish
      properties:
        tunnelEnabled:
          type: boolean
          description: Whether the tunnel rule (A↔K circular) is enabled
          example: false
        tunnelSkipWidth:
          type: integer
          description: Tunnel skip width (0 = disabled, 2–12 = ±N skip connections added)
          example: 0
        jokerCount:
          type: integer
          description: Number of joker cards in the deck
          example: 0
        cpuStrategy:
          type: integer
          description: CPU strategy mode (0 = simple, 1 = strategic, 2 = harassment)
          enum: [0, 1, 2]
          example: 0
        maxPasses:
          type: integer
          description: Maximum number of passes per player (0 = unlimited)
          example: 5
        noJokerFinish:
          type: boolean
          description: Whether finishing the game with a joker as the last card is banned
          example: false
        jokerReclaimEnabled:
          type: boolean
          description: Whether ジョーカー回収 (joker reclaim — playing a real card on a joker-occupied position returns the joker to the player's hand) is enabled (default false)
          example: false
        endStopEnabled:
          type: boolean
          description: Whether 片側ストップ (end stop — A placed blocks high side 8–K, K placed blocks low side A–6) is enabled (default false)
          example: false
        jokerConsecutiveBanned:
          type: boolean
          description: Whether ジョーカー連続禁止 (joker consecutive banned — a player who played a joker last turn cannot play a joker this turn) is enabled (default false)
          example: false

    SevensResponse:
      type: object
      required:
        - players
        - currentTurn
        - tableMinVals
        - tableMaxVals
        - tablePlaced
        - config
        - gameEndFlag
        - cpuActions
        - humanAction
        - message
      properties:
        players:
          type: array
          description: State of all 4 players
          items:
            $ref: '#/components/schemas/SevensPlayer'
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        tableMinVals:
          type: array
          description: |
            Minimum card value currently placed on the board per suit.
            Array of 5 integers indexed by suit (0 = unused/no suit,
            1 = SPADE, 2 = CLOVER, 3 = HEART, 4 = DIAMOND).
            Derived from `tablePlaced` bitmask for backward compatibility.
          items:
            type: integer
          minItems: 5
          maxItems: 5
          example: [0, 6, 7, 7, 7]
        tableMaxVals:
          type: array
          description: |
            Maximum card value currently placed on the board per suit.
            Uses the same indexing as `tableMinVals`.
            Derived from `tablePlaced` bitmask for backward compatibility.
          items:
            type: integer
          minItems: 5
          maxItems: 5
          example: [0, 8, 7, 7, 7]
        tablePlaced:
          type: array
          description: |
            Bitmask per suit indicating which card values are placed on the board.
            Array of 5 integers indexed by suit. Bit i set means value i is placed.
            Example: 128 (binary 10000000) = only value 7 is placed.
          items:
            type: integer
          minItems: 5
          maxItems: 5
          example: [0, 192, 128, 128, 128]
        config:
          $ref: '#/components/schemas/SevensConfig'
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        cpuActions:
          type: array
          description: CPU actions that occurred after the human's last action
          items:
            $ref: '#/components/schemas/SevensAction'
        humanAction:
          allOf:
            - $ref: '#/components/schemas/SevensAction'
          nullable: true
          description: The human player's most recent action (null before first play)
        message:
          type: string
          description: |
            Game result or status message.  Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.


    # Doubt
    DoubtRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: Game command
          enum: [reset, r, play, p, doubt, d, skip, s, log, quit, q]
          example: play
        cardIndices:
          type: array
          description: Hand indices of cards to play (required for `play` command)
          items:
            type: integer
          example: [0, 2]
        claimedValue:
          type: integer
          description: Declared card value 1–13 (required for `play` command)
          minimum: 1
          maximum: 13
          example: 3
        doubterIndices:
          type: array
          description: |
            Player indices declaring doubt. Used only for the `doubt` command: include 0 (human)
            if the human is doubting, plus any CPU doubters. Ignored for the `skip` command
            (the server determines CPU doubters from its own state).
          items:
            type: integer
          example: [0, 2]
        doubtWindowSec:
          type: integer
          description: |
            Duration of the doubt window in seconds (used with the `reset` command).
            Must be at least 1. Defaults to 10 when omitted.
          minimum: 1
          example: 5
        cpuMemoryLevel:
          type: integer
          description: |
            CPU memory retention level (used with the `reset` command).
            0 = Easy (~30% retention), 1 = Normal (~70% retention), 2 = Hard (100% retention).
            Defaults to 1 (Normal) when omitted.
          minimum: 0
          maximum: 2
          example: 1
        penaltyDrawLimit:
          type: integer
          description: |
            Maximum number of cards the loser picks up after a doubt resolution
            (used with the `reset` command). 0 = unlimited (loser takes all table cards).
            Remaining cards are discarded from the game. Defaults to 0 when omitted.
          minimum: 0
          example: 5
        cpuHesitationEnabled:
          type: boolean
          description: |
            When true, CPU actions include a hesitation delay (ms) that varies based on
            whether the CPU is bluffing. Bluff → 60% fast (300-500ms), 40% slow (1200-1800ms);
            honest → medium (600-1000ms). Defaults to false.
          default: false
          example: false
        cpuMetaAI:
          type: boolean
          description: |
            When true, CPUs adaptively adjust bluff and doubt behavior based on
            session-scoped game history (Meta-AI). Defaults to false.
          default: false
          example: false
        humanPlayMs:
          type: integer
          description: Human play hesitation time in milliseconds (0=not measured)
          example: 1200
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    DoubtPlayer:
      type: object
      description: A player in the Doubt game
      required:
        - id
        - isHuman
        - isFinished
        - cardCount
        - cards
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this player is the human
          example: true
        isFinished:
          type: boolean
          description: Whether this player has played all cards (won)
          example: false
        cardCount:
          type: integer
          description: Number of cards in hand
          example: 5
        cards:
          type: array
          description: Cards in hand (populated only for the human player)
          items:
            $ref: '#/components/schemas/Card'

    DoubtAction:
      type: object
      description: An action (play) taken by a player
      required:
        - playerIdx
        - claimedValue
        - cardCount
        - isBluff
      properties:
        playerIdx:
          type: integer
          description: Index of the player who took the action
          example: 1
        claimedValue:
          type: integer
          description: The card value the player declared
          example: 3
        cardCount:
          type: integer
          description: Number of cards played
          example: 2
        isBluff:
          type: boolean
          description: Whether the play was a bluff (always false until revealed)
          example: false
        hasTell:
          type: boolean
          description: Whether the CPU showed a visible "tell" (nervousness indicator) during this play
          example: false
        hesitationMs:
          type: integer
          description: CPU hesitation delay in milliseconds (0 when feature is disabled)
          example: 750

    DoubtDoubtResult:
      type: object
      description: Result of a doubt resolution
      required:
        - doubterIdx
        - cardPlayerIdx
        - wasLying
        - loserIdx
        - cardCount
        - discardedCount
        - revealedCards
      properties:
        doubterIdx:
          type: integer
          description: Index of the player who called doubt
          example: 0
        cardPlayerIdx:
          type: integer
          description: Index of the player whose cards were challenged
          example: 1
        wasLying:
          type: boolean
          description: Whether the challenged player was bluffing
          example: true
        loserIdx:
          type: integer
          description: Index of the player who must pick up the table cards
          example: 1
        cardCount:
          type: integer
          description: Number of cards the loser picks up
          example: 4
        discardedCount:
          type: integer
          description: Number of cards discarded from the game (when penaltyDrawLimit is active and table exceeds the limit)
          example: 0
        revealedCards:
          type: array
          description: Cards that were revealed during the doubt resolution
          items:
            $ref: '#/components/schemas/Card'

    DoubtResponse:
      type: object
      description: Current state of the Doubt game
      required:
        - players
        - currentTurn
        - phase
        - tableCardCount
        - cpuDoubters
        - cpuActions
        - gameEndFlag
        - winnerIdx
        - message
        - doubtWindowSec
        - penaltyDrawLimit
      properties:
        players:
          type: array
          description: All players in turn order
          items:
            $ref: '#/components/schemas/DoubtPlayer'
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        phase:
          type: integer
          description: "Game phase: 0 = Play, 1 = Doubt window, 2 = Game end"
          enum: [0, 1, 2]
          example: 0
        tableCardCount:
          type: integer
          description: Total number of cards on the table
          example: 0
        lastAction:
          allOf:
            - $ref: '#/components/schemas/DoubtAction'
          nullable: true
          description: The most recent play action (null until first play)
        cpuDoubters:
          type: array
          description: Indices of CPU players who have decided to call doubt
          items:
            type: integer
          example: []
        cpuActions:
          type: array
          description: CPU play actions that occurred after the human's last action
          items:
            $ref: '#/components/schemas/DoubtAction'
        humanAction:
          allOf:
            - $ref: '#/components/schemas/DoubtAction'
          nullable: true
          description: The human player's most recent play action (null before first play)
        lastDoubtResult:
          allOf:
            - $ref: '#/components/schemas/DoubtDoubtResult'
          nullable: true
          description: Result of the most recent doubt resolution (null if no doubt yet)
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        winnerIdx:
          type: integer
          description: Index of the winner (-1 while game is in progress)
          example: -1
        message:
          type: string
          description: |
            Game result or status message.  Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        doubtWindowSec:
          type: integer
          description: Duration of the doubt window in seconds (reflects current game config)
          example: 10
        penaltyDrawLimit:
          type: integer
          description: Maximum number of cards the loser picks up after a doubt resolution (0 = unlimited)
          example: 0
        metaAI:
          type: object
          nullable: true
          description: Meta-AI state for the current session (null when Meta-AI is disabled)
          properties:
            enabled:
              type: boolean
              description: Whether Meta-AI is enabled
              example: true
            gamesPlayed:
              type: integer
              description: Number of games played in the current session
              example: 5
            bluffRate:
              type: number
              format: float
              description: Rate at which the human player bluffs (0.0–1.0)
              example: 0.35
            doubtAccuracy:
              type: number
              format: float
              description: Accuracy of the human player's doubt calls (0.0–1.0)
              example: 0.60
            hesitationMean:
              type: number
              format: float
              description: Average human hesitation time in milliseconds
              example: 950.0

    # -------------------------------------------------------------------------
    # Texas Hold'em
    # -------------------------------------------------------------------------
    HoldemRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `fold` (`f`),
            `check` (`ck`), `call` (`c`), `bet` (`b`), `raise` (`ra`),
            `allin` (`a`), `rebuy` (`rb`), `skiprebuy` (`sr`),
            `addon` (`ad`), `skipaddon` (`sa`), `muck` (`m`),
            `show` (`sh`), `quit` (`q`).
          enum: [r, reset, f, fold, ck, check, c, call, b, bet, ra, raise, a, allin, rb, rebuy, sr, skiprebuy, ad, addon, sa, skipaddon, m, muck, sh, show, log, q, quit]
          example: bet
        amount:
          type: integer
          description: |
            Bet/raise amount (for the `bet` and `raise` commands).
            Ignored for other commands.
          minimum: 1
          example: 40
        smallBlind:
          type: integer
          description: |
            Small blind amount (for the `reset` command).
            Defaults to 5 when omitted.
            If only `smallBlind` is specified and it is >= the default `bigBlind`,
            `bigBlind` is auto-adjusted to `smallBlind * 2`.
          minimum: 1
          example: 5
        bigBlind:
          type: integer
          description: |
            Big blind amount (for the `reset` command).
            Defaults to 10 when omitted.
            If only `bigBlind` is specified and the default `smallBlind` is >= `bigBlind`,
            `smallBlind` is auto-adjusted to `bigBlind / 2` (minimum 1).
          minimum: 1
          example: 10
        tournamentMode:
          type: boolean
          description: |
            Enable tournament mode with blind escalation (for the `reset` command).
            Defaults to false when omitted.
          example: false
        blindLevelHands:
          type: integer
          description: |
            Number of hands before blinds increase in tournament mode (for the `reset` command).
            Defaults to 10 when omitted. Must be >= 1.
          minimum: 1
          example: 10
        blindMultiplier:
          type: integer
          description: |
            Blind multiplier as a percentage when blinds increase (for the `reset` command).
            Defaults to 200 (= 2x). Must be >= 101.
          minimum: 101
          example: 200
        bettingLimit:
          type: integer
          description: |
            Betting limit type (used with `reset` command).
            0 = Fixed (default), 1 = Pot Limit, 2 = No Limit.
          minimum: 0
          maximum: 2
          example: 0
        tableSize:
          type: integer
          description: |
            Table size (used with `reset` command).
            4 = 4-max (default), 6 = 6-max, 9 = 9-max.
          enum: [4, 6, 9]
          example: 4
        rebuyEnabled:
          type: boolean
          description: |
            Enable rebuy (used with `reset` command).
            Defaults to false when omitted.
          example: false
        rebuyMaxCount:
          type: integer
          description: |
            Maximum number of rebuys per player (used with `reset` command).
            Defaults to 3 when omitted.
          minimum: 1
          example: 3
        rebuyChips:
          type: integer
          description: |
            Chips granted per rebuy (used with `reset` command).
            Defaults to 1000 when omitted.
          minimum: 1
          example: 1000
        rebuyPeriodHands:
          type: integer
          description: |
            Number of hands during which rebuy is available (used with `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        addonEnabled:
          type: boolean
          description: |
            Enable addon (used with `reset` command).
            Defaults to false when omitted.
          example: false
        addonChips:
          type: integer
          description: |
            Chips granted by addon (used with `reset` command).
            Defaults to 1500 when omitted.
          minimum: 1
          example: 1500
        addonAfterHand:
          type: integer
          description: |
            Hand number after which addon becomes available (used with `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    HoldemPlayer:
      type: object
      required:
        - id
        - isHuman
        - cards
        - chips
        - currentBet
        - folded
        - allIn
        - handRank
        - handName
        - bestHand
        - playStyleName
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1+ = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this is the human player
          example: true
        cards:
          type: array
          description: |
            Hole cards.  Human player's cards are always visible.
            CPU cards are hidden (empty array) until showdown.
          items:
            $ref: '#/components/schemas/Card'
        chips:
          type: integer
          description: Current chip count
          minimum: 0
          example: 990
        currentBet:
          type: integer
          description: Current round bet amount
          minimum: 0
          example: 10
        folded:
          type: boolean
          description: Whether the player has folded
          example: false
        allIn:
          type: boolean
          description: Whether the player is all-in
          example: false
        handRank:
          type: integer
          description: |
            Numeric hand rank (only populated at showdown for non-folded players):
            0 = High Card, 1 = One Pair, 2 = Two Pair, 3 = Three of a Kind,
            4 = Straight, 5 = Flush, 6 = Full House, 7 = Four of a Kind,
            8 = Straight Flush, 9 = Royal Flush.
          minimum: 0
          maximum: 9
          example: 0
        handName:
          type: string
          description: Human-readable hand name (empty until showdown)
          example: ""
        bestHand:
          type: array
          description: Best 5-card hand (only populated at showdown)
          items:
            $ref: '#/components/schemas/Card'
        playStyleName:
          type: string
          description: |
            CPU play style name: TAG (Tight-Aggressive), LAP (Loose-Passive),
            TAP (Tight-Passive), LAG (Loose-Aggressive).
            Empty for human player.
          example: TAG
        totalHands:
          type: integer
          description: Total number of hands played (for HUD stats)
          minimum: 0
          example: 10
        vpip:
          type: integer
          description: VPIP percentage (Voluntarily Put $ In Pot) — preflop call/bet/raise/allin rate
          minimum: 0
          maximum: 100
          example: 50
        pfr:
          type: integer
          description: PFR percentage (Pre-Flop Raise) — preflop bet/raise/allin rate
          minimum: 0
          maximum: 100
          example: 25
        threeBet:
          type: integer
          description: 3Bet percentage — preflop re-raise rate when facing a raise
          minimum: 0
          maximum: 100
          example: 10
        af:
          type: string
          description: "Aggression Factor (postflop bets+raises / calls). Values: decimal (e.g. \"2.5\"), \"∞\" (bets but no calls), \"-\" (no postflop actions)"
          example: "2.5"

    HoldemCpuAction:
      type: object
      description: Record of a CPU player's betting action
      required:
        - playerIdx
        - action
        - amount
      properties:
        playerIdx:
          type: integer
          description: Index of the CPU player who acted
          example: 1
        action:
          type: integer
          description: |
            Action taken: 0 = Fold, 1 = Check, 2 = Call,
            3 = Bet, 4 = Raise, 5 = All-in.
          enum: [0, 1, 2, 3, 4, 5]
          example: 2
        amount:
          type: integer
          description: Amount bet/raised (0 for fold/check/call/all-in)
          example: 0

    HoldemResult:
      type: object
      description: Result for a player at showdown
      required:
        - playerIdx
        - handRank
        - handName
        - bestHand
        - wonAmount
      properties:
        playerIdx:
          type: integer
          description: Index of the player
          example: 0
        handRank:
          type: integer
          description: Numeric hand rank
          example: 1
        handName:
          type: string
          description: Hand name (e.g., "One Pair")
          example: One Pair
        kickers:
          type: string
          description: Kicker card values formatted as display string (e.g., "A, Q, 10"). Empty for hands without kickers.
        bestHand:
          type: array
          description: Best 5-card hand
          items:
            $ref: '#/components/schemas/Card'
        wonAmount:
          type: integer
          description: Chips won from the pot
          example: 40
        mucked:
          type: boolean
          description: Whether the player mucked (hid) their hand at showdown
          example: false

    HoldemSidePot:
      type: object
      description: A side pot created when a player goes all-in
      required:
        - amount
        - eligiblePlayers
      properties:
        amount:
          type: integer
          description: Total chips in this side pot
          example: 100
        eligiblePlayers:
          type: array
          description: Indices of players eligible to win this pot
          items:
            type: integer
          example: [0, 1, 2]

    HoldemResponse:
      type: object
      required:
        - players
        - communityCards
        - pot
        - sidePots
        - dealerIdx
        - currentTurn
        - phase
        - gameEndFlag
        - lastBet
        - minRaise
        - roundResults
        - cpuActions
        - message
      properties:
        players:
          type: array
          description: State of all players (4/6/9 depending on table size)
          items:
            $ref: '#/components/schemas/HoldemPlayer'
        communityCards:
          type: array
          description: Community cards on the board (0/3/4/5 cards based on phase)
          items:
            $ref: '#/components/schemas/Card'
        pot:
          type: integer
          description: Current main pot size
          minimum: 0
          example: 30
        sidePots:
          type: array
          description: Side pots (created when players go all-in with different amounts)
          items:
            $ref: '#/components/schemas/HoldemSidePot'
        dealerIdx:
          type: integer
          description: Index of the dealer for this round
          example: 0
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        phase:
          type: integer
          description: |
            Current game phase:
            - `0` — Init
            - `1` — PreFlop
            - `2` — Flop
            - `3` — Turn
            - `4` — River
            - `5` — Showdown
            - `6` — End
            - `7` — Rebuy/Addon
          enum: [0, 1, 2, 3, 4, 5, 6, 7]
          example: 1
        gameEndFlag:
          type: boolean
          description: Whether the round has ended
          example: false
        lastBet:
          type: integer
          description: The current highest bet in this betting round
          minimum: 0
          example: 10
        minRaise:
          type: integer
          description: Minimum raise amount
          minimum: 0
          example: 20
        bettingLimit:
          type: integer
          description: |
            Betting limit type: 0 = Fixed, 1 = Pot Limit, 2 = No Limit.
          enum: [0, 1, 2]
        raiseCount:
          type: integer
          description: Number of raises in the current betting round.
          minimum: 0
        maxBetAmount:
          type: integer
          description: |
            Maximum allowed bet/raise amount for Pot Limit mode.
            0 means no limit (Fixed or No Limit mode).
          minimum: 0
        roundResults:
          type: array
          description: Results for each non-folded player at showdown
          items:
            $ref: '#/components/schemas/HoldemResult'
        cpuActions:
          type: array
          description: CPU actions that occurred since the last human action
          items:
            $ref: '#/components/schemas/HoldemCpuAction'
        message:
          type: string
          description: |
            Game result or status message.  One of:
            - `""` — game in progress
            - `"You are the winner."` — player wins
            - `"You lose."` — player loses
            - `"You folded."` — player folded
            - `"Game over."` — game ended (no results)
            - `"Unsupported command."` — unknown command
            - `"bye."` — session ended by quit command
            - `"param error."` — invalid request
            - `"error."` — internal error
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        handCount:
          type: integer
          description: Number of hands played (for tournament mode display)
          minimum: 0
          example: 0
        smallBlind:
          type: integer
          description: Current small blind amount
          minimum: 1
          example: 5
        bigBlind:
          type: integer
          description: Current big blind amount
          minimum: 2
          example: 10
        tournamentMode:
          type: boolean
          description: Whether tournament mode (blind escalation) is active
          example: false
        blindLevelHands:
          type: integer
          description: Number of hands before blinds increase
          minimum: 1
          example: 10
        blindMultiplier:
          type: integer
          description: Blind multiplier percentage (e.g. 200 = 2x)
          minimum: 101
          example: 200
        tableSize:
          type: integer
          description: Current table size (4/6/9)
          enum: [4, 6, 9]
          example: 4
        rebuyPhaseType:
          type: integer
          description: |
            Type of rebuy phase: 1 = rebuy, 2 = addon.
            Only present when phase is 7 (Rebuy/Addon).
          enum: [1, 2]
        rebuyChips:
          type: integer
          description: Chips available for current rebuy
          minimum: 0
        rebuyMaxCount:
          type: integer
          description: Maximum rebuy count setting
          minimum: 0
        rebuyCounts:
          type: array
          description: Rebuy count per player (same order as players array)
          items:
            type: integer
            minimum: 0
        addonChips:
          type: integer
          description: Chips available for addon
          minimum: 0
        muckAvailable:
          type: boolean
          description: Whether the human player can muck (hide) their hand at showdown (available when human lost)
          example: false
        equity:
          $ref: '#/components/schemas/HoldemEquity'
        potOdds:
          type: number
          format: double
          description: Pot odds percentage (0-100). Only present during PreFlop-River phases.
          example: 33.33

    HoldemEquity:
      type: object
      description: Equity (win probability) calculated via Monte Carlo simulation. Only present during PreFlop-River phases when human is active.
      required:
        - winProbability
        - handOdds
      properties:
        winProbability:
          type: number
          format: double
          description: Win probability (0.0 - 1.0)
          minimum: 0
          maximum: 1
          example: 0.75
        handOdds:
          type: array
          items:
            $ref: '#/components/schemas/HoldemHandOdds'

    HoldemHandOdds:
      type: object
      required:
        - handRank
        - handName
        - probability
      properties:
        handRank:
          type: integer
          description: Hand rank (0=HighCard, 1=OnePair, ..., 9=RoyalFlush)
          minimum: 0
          example: 1
        handName:
          type: string
          description: Hand rank name
          example: "One Pair"
        probability:
          type: number
          format: double
          description: Probability of achieving this hand rank (0.0 - 1.0)
          minimum: 0
          maximum: 1
          example: 0.5

    # -------------------------------------------------------------------------
    # Action Log (common across all games)
    # -------------------------------------------------------------------------
    ActionLogEntry:
      type: object
      required:
        - turnNumber
        - playerIdx
        - actionType
        - detail
      properties:
        turnNumber:
          type: integer
          description: Sequential turn number starting from 1
          minimum: 1
          example: 1
        playerIdx:
          type: integer
          description: Index of the player who performed the action (0 = human, 1+ = CPU)
          example: 0
        actionType:
          type: string
          description: Type of action (e.g., "hit", "stand", "bet", "play", "draw", "doubt", "fold")
          example: hit
        detail:
          type: string
          description: Human-readable description of the action
          example: "Player 0 hit and drew ♠A"
        cards:
          type: array
          description: Cards involved in the action (optional; revealed even if originally hidden)
          items:
            $ref: '#/components/schemas/Card'

    ActionLogResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          description: |
            Cumulative action log (棋譜) for the current game session.
            All hidden cards are revealed in the log entries.
          items:
            $ref: '#/components/schemas/ActionLogEntry'

    # -------------------------------------------------------------------------
    # Hearts
    # -------------------------------------------------------------------------
    HeartsRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `pass`,
            `play` (`p`), `next` (`n`), `nextround` (`nr`),
            `setdifficulty` (`sd`), `setlimit` (`sl`),
            `log` (`l`), `quit` (`q`).
          enum: [reset, r, pass, play, p, next, n, nextround, nr, setdifficulty, sd, setlimit, sl, log, l, quit, q]
          example: play
        cardIndices:
          type: array
          description: |
            Hand indices of the 3 cards to pass (required for `pass` command).
            Must contain exactly 3 indices.
          items:
            type: integer
          example: [0, 3, 7]
        cardIndex:
          type: integer
          description: Hand index of the card to play (required for `play` command)
          example: 2
        config:
          type: object
          description: Game configuration options (used with `reset`, `setdifficulty`, `setlimit` commands)
          properties:
            difficulty:
              type: integer
              description: "CPU difficulty level: 0 = Easy (random), 1 = Normal (point avoidance), 2 = Hard (strategic). Defaults to 1."
              minimum: 0
              maximum: 2
              example: 1
            pointLimit:
              type: integer
              description: "Point limit to end the game. Defaults to 100."
              minimum: 1
              example: 100
            omnibusJD:
              type: boolean
              description: "Omnibus Hearts variant: J♦ awards -10 points (beneficial). Defaults to false."
              example: false
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    HeartsPlayer:
      type: object
      description: A player in the Hearts game
      required:
        - id
        - isHuman
        - score
        - roundScore
        - cards
        - cardCount
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this player is the human
          example: true
        score:
          type: integer
          description: Cumulative score across all rounds
          example: 15
        roundScore:
          type: integer
          description: Score accumulated in the current round
          example: 3
        cards:
          type: array
          description: Cards in hand (populated only for the human player)
          items:
            $ref: '#/components/schemas/Card'
        cardCount:
          type: integer
          description: Number of cards in hand
          example: 13

    HeartsTrickCard:
      type: object
      description: A card played in the current trick
      required:
        - playerIdx
        - card
      properties:
        playerIdx:
          type: integer
          description: Index of the player who played this card
          example: 1
        card:
          $ref: '#/components/schemas/Card'

    HeartsResponse:
      type: object
      description: Current state of the Hearts game
      required:
        - players
        - phase
        - roundNumber
        - trickNumber
        - currentPlayerIdx
        - currentTrick
        - heartsBroken
        - passDirection
        - gameEndFlag
        - winnerIdx
        - message
      properties:
        players:
          type: array
          description: All players in seat order
          items:
            $ref: '#/components/schemas/HeartsPlayer'
        phase:
          type: integer
          description: "Game phase: 0 = Pass, 1 = Play, 2 = TrickEnd, 3 = RoundEnd, 4 = GameEnd"
          enum: [0, 1, 2, 3, 4]
          example: 1
        roundNumber:
          type: integer
          description: Current round number (1-based)
          example: 1
        trickNumber:
          type: integer
          description: Current trick number within the round (1-based)
          example: 1
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        currentTrick:
          type: array
          description: Cards played in the current trick so far
          items:
            $ref: '#/components/schemas/HeartsTrickCard'
        heartsBroken:
          type: boolean
          description: Whether hearts have been broken this round
          example: false
        passDirection:
          type: integer
          description: "Pass direction for the current round: 0 = left, 1 = right, 2 = across, 3 = none"
          enum: [0, 1, 2, 3]
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        winnerIdx:
          type: integer
          description: Index of the winner (-1 while game is in progress)
          example: -1
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        config:
          type: object
          description: Current game configuration
          properties:
            difficulty:
              type: integer
              description: "CPU difficulty level: 0 = Easy, 1 = Normal, 2 = Hard"
              example: 1
            pointLimit:
              type: integer
              description: Point limit to end the game
              example: 100
            omnibusJD:
              type: boolean
              description: "Omnibus Hearts variant: J♦ awards -10 points"
              example: false

    # -------------------------------------------------------------------------
    # Memory
    # -------------------------------------------------------------------------
    MemoryRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `flip` (`f`),
            `next` (`n`), `log` (`l`).
          enum: [reset, r, flip, f, next, n, log, l]
          example: flip
        position:
          type: integer
          description: Board position of the card to flip (required for `flip` command, 0-based index)
          example: 5
        config:
          type: object
          description: Game configuration options (used with `reset` command)
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty level: 0 = Easy (random), 1 = Normal (partial memory), 2 = Hard (perfect memory). Defaults to 1."
              minimum: 0
              maximum: 2
              example: 1
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    MemoryPlayer:
      type: object
      description: A player in the Memory game
      required:
        - id
        - isHuman
        - pairCount
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1–3 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this player is the human
          example: true
        pairCount:
          type: integer
          description: Number of pairs collected
          example: 3

    MemoryBoardCard:
      type: object
      description: A card on the Memory board
      required:
        - faceUp
        - taken
      properties:
        faceUp:
          type: boolean
          description: Whether the card is currently face-up
          example: false
        taken:
          type: boolean
          description: Whether the card has been taken as part of a pair
          example: false
        card:
          description: Card details (only present when face-up)
          $ref: '#/components/schemas/Card'

    MemoryResponse:
      type: object
      description: Current state of the Memory game
      required:
        - players
        - phase
        - board
        - currentPlayerIdx
        - firstFlipPos
        - secondFlipPos
        - lastMatchResult
        - turnNumber
        - gameEndFlag
        - winnerIdx
        - message
        - config
      properties:
        players:
          type: array
          description: All players in seat order
          items:
            $ref: '#/components/schemas/MemoryPlayer'
        phase:
          type: integer
          description: "Game phase: 0 = Flip1, 1 = Flip2, 2 = Result, 3 = GameEnd"
          enum: [0, 1, 2, 3]
          example: 0
        board:
          type: array
          description: All 52 card positions on the board
          items:
            $ref: '#/components/schemas/MemoryBoardCard'
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        firstFlipPos:
          type: integer
          description: Board position of the first flipped card (-1 if none)
          example: -1
        secondFlipPos:
          type: integer
          description: Board position of the second flipped card (-1 if none)
          example: -1
        lastMatchResult:
          type: boolean
          description: Whether the last flip pair was a match
          example: false
        turnNumber:
          type: integer
          description: Current turn number (incremented after each pair flip)
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        winnerIdx:
          type: integer
          description: Index of the winner (-1 while game is in progress)
          example: -1
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        config:
          type: object
          description: Current game configuration
          required:
            - cpuDifficulty
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty level: 0 = Easy, 1 = Normal, 2 = Hard"
              example: 1

    # -------------------------------------------------------------------------
    # Klondike
    # -------------------------------------------------------------------------
    KlondikeZone:
      type: object
      description: Specifies a zone on the Klondike board for move commands
      required:
        - zone
      properties:
        zone:
          type: string
          description: "Zone name: waste, tableau, or foundation"
          enum: [waste, tableau, foundation]
          example: tableau
        col:
          type: integer
          description: Column index (0-based, required for tableau and foundation zones)
          example: 3
        cardIndex:
          type: integer
          description: Index of the card within the column (for moving multiple cards from tableau)
          example: 0

    KlondikeRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `draw` (`d`),
            `move` (`m`), `giveup` (`g`), `hint` (`h`), `autocomplete` (`ac`),
            `log` (`l`).
          enum: [reset, r, draw, d, move, m, giveup, g, hint, h, autocomplete, ac, undo, u, log, l]
          example: move
        from:
          description: Source zone for a move command
          $ref: '#/components/schemas/KlondikeZone'
        to:
          description: Destination zone for a move command
          $ref: '#/components/schemas/KlondikeZone'
        config:
          type: object
          description: Game configuration (used with reset command)
          properties:
            drawCount:
              type: integer
              description: "Number of cards to draw from stock (1 or 3, default 1)"
              enum: [1, 3]
              example: 3
            scoringMode:
              type: integer
              description: "Scoring mode: 0 = None, 1 = Vegas"
              enum: [0, 1]
              example: 0
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    KlondikeTableauCard:
      type: object
      description: A card in a Klondike tableau column
      required:
        - faceUp
      properties:
        faceUp:
          type: boolean
          description: Whether the card is face-up
          example: true
        card:
          description: Card details (only present when face-up)
          $ref: '#/components/schemas/Card'

    KlondikeResponse:
      type: object
      description: Current state of the Klondike game
      required:
        - tableau
        - stockCount
        - waste
        - foundation
        - phase
        - moveCount
        - drawCount
        - canUndo
        - score
        - scoringMode
        - message
      properties:
        tableau:
          type: array
          description: The 7 tableau columns, each containing an array of cards
          items:
            type: array
            items:
              $ref: '#/components/schemas/KlondikeTableauCard'
        stockCount:
          type: integer
          description: Number of cards remaining in the stock pile
          example: 24
        waste:
          type: array
          description: Cards in the waste pile (top card is the last element)
          items:
            $ref: '#/components/schemas/Card'
        foundation:
          type: array
          description: The 4 foundation piles (one per suit), each containing an array of cards
          items:
            type: array
            items:
              $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 0 = Playing, 1 = GameClear, 2 = GameOver"
          enum: [0, 1, 2]
          example: 0
        moveCount:
          type: integer
          description: Total number of moves made in the current game
          example: 0
        drawCount:
          type: integer
          description: "Number of cards drawn per draw action (1 or 3)"
          enum: [1, 3]
          example: 1
        canUndo:
          type: boolean
          description: Whether the undo action is available
          example: false
        score:
          type: integer
          description: "Vegas score: -52 + 5 × foundation cards"
          example: -52
        scoringMode:
          type: integer
          description: "Scoring mode: 0 = None, 1 = Vegas"
          enum: [0, 1]
          example: 0
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          description: Hint for the next available move (only present when hint command is used)
          properties:
            from:
              $ref: '#/components/schemas/KlondikeZone'
            to:
              $ref: '#/components/schemas/KlondikeZone'

    # -------------------------------------------------------------------------
    # FreeCell
    # -------------------------------------------------------------------------
    FreeCellZone:
      type: object
      description: Specifies a zone on the FreeCell board for move commands
      required:
        - zone
      properties:
        zone:
          type: string
          description: "Zone name: tableau, freecell, or foundation"
          enum: [tableau, freecell, foundation]
          example: tableau
        col:
          type: integer
          description: Column index (0-based, used for tableau and foundation zones)
          example: 3
        cell:
          type: integer
          description: Free cell index (0-based, used for freecell zone)
          example: 0
        cardIndex:
          type: integer
          description: Index of the card within the column (for moving multiple cards from tableau)
          example: 0

    FreeCellRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `move` (`m`),
            `giveup` (`g`), `hint` (`h`), `autocomplete` (`ac`),
            `undo` (`u`), `log` (`l`).
          enum: [reset, r, move, m, giveup, g, hint, h, autocomplete, ac, undo, u, log, l]
          example: move
        from:
          description: Source zone for a move command
          $ref: '#/components/schemas/FreeCellZone'
        to:
          description: Destination zone for a move command
          $ref: '#/components/schemas/FreeCellZone'
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    FreeCellResponse:
      type: object
      description: Current state of the FreeCell game
      required:
        - tableau
        - freeCells
        - foundation
        - phase
        - moveCount
        - canUndo
        - message
      properties:
        tableau:
          type: array
          description: The 8 tableau columns, each containing an array of face-up cards
          items:
            type: array
            items:
              $ref: '#/components/schemas/Card'
        freeCells:
          type: array
          description: The 4 free cells (null or a Card)
          items:
            nullable: true
            $ref: '#/components/schemas/Card'
        foundation:
          type: array
          description: The 4 foundation piles (one per suit), each containing an array of cards
          items:
            type: array
            items:
              $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 0 = Playing, 1 = GameClear, 2 = GameOver"
          enum: [0, 1, 2]
          example: 0
        moveCount:
          type: integer
          description: Total number of moves made in the current game
          example: 0
        canUndo:
          type: boolean
          description: Whether the undo action is available
          example: false
        hint:
          type: object
          description: Hint for the next available move (only present when hint command is used)
          properties:
            from:
              $ref: '#/components/schemas/FreeCellZone'
            to:
              $ref: '#/components/schemas/FreeCellZone'
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Baccarat
    # -------------------------------------------------------------------------
    BaccaratRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bet` (`b`),
            `log` (`l`), `clearhistory` (`ch`).
          enum: [r, reset, b, bet, log, l, ch, clearhistory]
          example: bet
        amount:
          type: integer
          description: |
            Bet amount.  Required for `bet` command (minimum 10, must be a
            multiple of 10).  Ignored for other commands.
          minimum: 10
          example: 100
        betType:
          type: integer
          description: |
            Bet type.  Required for `bet` command.
            0 = Player, 1 = Banker, 2 = Tie.
          enum: [0, 1, 2]
          example: 0
        playerPairBet:
          type: integer
          description: |
            Side bet amount on Player Pair.  Optional; used with the `bet`
            command.  Ignored for other commands.
          minimum: 0
          example: 50
        bankerPairBet:
          type: integer
          description: |
            Side bet amount on Banker Pair.  Optional; used with the `bet`
            command.  Ignored for other commands.
          minimum: 0
          example: 50
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    BaccaratResponse:
      type: object
      description: Current state of the Baccarat game
      required:
        - playerHand
        - bankerHand
        - playerHandValue
        - bankerHandValue
        - phase
        - chips
        - betAmount
        - betType
        - result
        - payout
        - message
      properties:
        playerHand:
          type: array
          description: Cards in the player's hand
          items:
            $ref: '#/components/schemas/Card'
        bankerHand:
          type: array
          description: Cards in the banker's hand
          items:
            $ref: '#/components/schemas/Card'
        playerHandValue:
          type: integer
          description: "Player hand value (ones digit of sum: 0-9)"
          example: 7
        bankerHandValue:
          type: integer
          description: "Banker hand value (ones digit of sum: 0-9)"
          example: 5
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = End"
          enum: [1, 2]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 1000
        betAmount:
          type: integer
          description: Current bet amount
          example: 100
        betType:
          type: integer
          description: "Current bet type: 0 = Player, 1 = Banker, 2 = Tie"
          enum: [0, 1, 2]
          example: 0
        result:
          type: integer
          description: "Game result: 1 = Player wins, -1 = Banker wins, 0 = Tie/not resolved"
          enum: [-1, 0, 1]
          example: 0
        payout:
          type: integer
          description: Payout amount for the current round
          example: 0
        history:
          type: array
          description: |
            Big Road history — an ordered list of round results.
            Each element is an integer: 0 = Player win, 1 = Banker win, 2 = Tie.
          items:
            type: integer
            enum: [0, 1, 2]
          example: [0, 1, 1, 2, 0]
        playerPairBet:
          type: integer
          description: Current Player Pair side bet amount
          example: 0
        bankerPairBet:
          type: integer
          description: Current Banker Pair side bet amount
          example: 0
        sideBetResults:
          type: array
          description: Results of side bets for the current round
          items:
            type: object
            properties:
              betType:
                type: integer
                description: "Side bet type identifier"
              resultType:
                type: integer
                description: "Result type identifier"
              resultName:
                type: string
                description: "Human-readable result name"
              betAmount:
                type: integer
                description: "Amount wagered on this side bet"
              payout:
                type: integer
                description: "Payout amount (0 if lost)"
        message:
          type: string
          description: Game result or error message. Empty during bet phase.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
