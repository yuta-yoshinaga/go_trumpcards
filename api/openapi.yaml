                  value:
                    playerHand: []
                    dealerHand: []
                    phase: 0
                    chips: 0
                    anteBet: 0
                    pairPlusBet: 0
                    playBet: 0
                    result: 0
                    antePayout: 0
                    playPayout: 0
                    anteBonusPayout: 0
                    pairPlusPayout: 0
                    totalPayout: 0
                    dealerQualified: false
                    playerHandRank: 0
                    dealerHandRank: 0
                    message: param error.

  /caribbeanstud/exec:
    post:
      tags:
        - caribbeanstud
      summary: Execute a Caribbean Stud Poker game command
      description: |
        Send a command to advance the Caribbean Stud Poker (カリビアンスタッドポーカー)
        game session identified by `sessionId`. Caribbean Stud Poker is a single-player
        casino poker game using a standard 52-card deck. Player places an Ante bet and
        an optional Jackpot side bet, receives 5 cards, then decides to Call (place a
        Play bet equal to 2x Ante) or Fold (forfeit Ante). Dealer must have Ace-King
        high or any pair to qualify. If dealer doesn't qualify, Ante pays 1:1 and Play
        bet pushes. If dealer qualifies, the higher 5-card poker hand wins. Play bet
        on win pays per hand: Royal Flush 100:1, Straight Flush 50:1, Four of a Kind
        20:1, Full House 7:1, Flush 5:1, Straight 4:1, Three of a Kind 3:1, Two Pair
        2:1, Pair or less 1:1. The Jackpot side bet pays independently of the main
        result: Royal Flush 20000x, Straight Flush 5000x, Four of a Kind 500x, Full
        House 100x, Flush 50x.

        The game proceeds through these phases:

        | Phase  | Value | Description |
        |--------|-------|-------------|
        | Bet    | `1`   | Place Ante and optional Jackpot side bet |
        | Action | `2`   | Decide to Call or Fold |
        | End    | `3`   | Round complete; shows result and payout |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place Ante bet (requires `amount`; optional `jackpotBet`) |
        | `play`  | `p`     | Call: place Play bet (2x Ante) and reveal dealer hand |
        | `fold`  | `f`     | Forfeit Ante bet |
        | `log`   | `l`     | View action log |
      operationId: caribbeanstudExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaribbeanStudRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bet:
                summary: Bet 100 Ante with 10 Jackpot
                value:
                  command: bet
                  amount: 100
                  jackpotBet: 10
                  sessionId: my-session-001
              play:
                summary: Call (place Play bet)
                value:
                  command: play
                  sessionId: my-session-001
              fold:
                summary: Fold hand
                value:
                  command: fold
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaribbeanStudResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaribbeanStudResponse'
              examples:
                paramError:
                  value:
                    playerHand: []
                    dealerHand: []
                    phase: 0
                    chips: 0
                    anteBet: 0
                    jackpotBet: 0
                    playBet: 0
                    result: 0
                    antePayout: 0
                    playPayout: 0
                    jackpotPayout: 0
                    totalPayout: 0
                    dealerQualified: false
                    playerHandRank: 0
                    dealerHandRank: 0
                    message: param error.

  /ohhell/exec:
    post:
      tags:
        - ohhell
      summary: Execute an Oh Hell game command
      description: |
        Send a command to advance the Oh Hell (オー・ヘル) game session identified by
        `sessionId`.  Oh Hell is a 4-player trick-taking game with variable hand sizes
        per round.  Trump suit is determined by the top card of the remaining deck.
        Players bid the exact number of tricks they expect to win; the dealer is
        restricted so total bids cannot equal the number of tricks available ("hook"
        rule).  Scoring: exact bid = 10 + bid; miss = 0 (standard) or -|difference|
        (penalty variant).  The game ends after all rounds are played.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Bid       | `0`   | Each player declares expected trick wins |
        | Play      | `1`   | Trick play (follow suit; trump suit wins) |
        | TrickEnd  | `2`   | Trick resolved; advance with `next` |
        | RoundEnd  | `3`   | All tricks played; advance with `nextround` |
        | GameEnd   | `4`   | All rounds completed |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `bid`       | `b`     | Place a bid (requires `bid` field, 0-handSize) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `hint`      | `h`     | Get recommended bid or play |
        | `log`       | `l`     | View action log |
      operationId: ohhellExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OhHellRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bid:
                summary: Bid 2 tricks
                value:
                  command: bid
                  bid: 2
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhHellResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OhHellResponse'

  /bridge/exec:
    post:
      tags:
        - bridge
      summary: Execute a Contract Bridge game command
      description: |
        Send a command to advance the Contract Bridge (コントラクトブリッジ) game session
        identified by `sessionId`.  Contract Bridge is a 4-player, 2-team trick-taking
        game with a standard 52-card deck (13 cards per player).  Features an auction
        (bidding) phase with Pass/Double/Redouble, a dummy hand (partner of declarer),
        and rubber bridge scoring.  First team to win 2 games wins the rubber.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Bid        | `0`   | Auction phase (players bid to set the contract) |
        | Play       | `1`   | Trick play (follow suit; trump suit wins) |
        | TrickEnd   | `2`   | Trick resolved; advance with `next` |
        | RoundEnd   | `3`   | All 13 tricks played; advance with `nextround` |
        | GameEnd    | `4`   | A team won the rubber (2 games) |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `bid`       | `b`     | Place a bid (requires `bidType`, and `bidLevel`+`bidSuit` for normal bids) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `hint`      | `h`     | Get recommended bid or play |
        | `log`       | `l`     | View action log |
      operationId: bridgeExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeRequest'
