                      cardIndex:
                        type: integer
                      toCol:
                        type: integer
                  message:
                    type: string
                  messageCode:
                    type: string
        '400':
          description: Bad request

  /accordion/exec:
    post:
      tags:
        - accordion
      summary: Execute an Accordion (アコーディオン) game command
      description: |
        Send a command to advance an Accordion compression solitaire session identified by `sessionId`.
        A standard 52-card deck is dealt one pile per card in a single row. A pile may be moved onto
        the pile 1 or 3 positions to its left when the top cards match in suit or rank; the source pile
        is then absorbed and every pile to its right shifts left to close the gap. The game clears when
        all cards are compressed into a single pile.

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Playing   | 0     | Game in progress |
        | GameClear | 1     | All cards in one pile |
        | GameOver  | 2     | Player gave up |

        | Command  | Aliases | Description |
        |----------|---------|-------------|
        | `reset`  | `r`     | Start / restart a game |
        | `move`   | `m`     | Merge pile `from.index` onto pile `to.index` (`to` must be `from-1` or `from-3`) |
        | `giveup` | `g`     | Give up the current game |
        | `hint`   | `h`     | Get a move suggestion |
        | `undo`   | `u`     | Undo last move |
        | `undo_n` | —       | Undo N moves (requires `n`) |
        | `log`    | `l`     | View action log |
      operationId: accordionExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, move, m, giveup, g, hint, h, undo, u, undo_n, log, l]
                sessionId:
                  type: string
                from:
                  type: object
                  properties:
                    zone:
                      type: string
                      enum: [pile]
                    index:
                      type: integer
                to:
                  type: object
                  properties:
                    zone:
                      type: string
                      enum: [pile]
                    index:
                      type: integer
                n:
                  type: integer
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  piles:
                    type: array
                    items:
                      type: object
                      properties:
                        cards:
                          type: array
                          items:
                            $ref: '#/components/schemas/Card'
                        size:
                          type: integer
                  pileCount:
                    type: integer
                  phase:
                    type: integer
                  moveCount:
                    type: integer
                  canUndo:
                    type: boolean
                  isStalemate:
                    type: boolean
                  undoToEscape:
                    type: integer
                  hint:
                    type: object
                    properties:
                      fromIdx:
                        type: integer
                      toIdx:
                        type: integer
                  message:
                    type: string
                  messageCode:
                    type: string
        '400':
          description: Bad request

  /trash/exec:
    post:
      tags:
        - trash
      summary: Execute a Trash (トラッシュ) game command
      description: |
        Send a command to advance a Trash (Garbage) session identified by `sessionId`.
        Two players (1 human vs 1 CPU) each have 10 face-down slots. On a turn the
        player draws from the stock; Ace-10 auto-places at the matching position
        (continuing the chain), K/Joker becomes a wild the player places manually,
        J/Q ends the turn. First to flip all 10 slots wins. Uses a 54-card deck
        (52 + 2 jokers); the stock refills from the shuffled discard pile when
        empty.

        | Phase       | Value | Description |
        |-------------|-------|-------------|
        | PlayerTurn  | 0     | Active player may draw |
        | AwaitWild   | 1     | Active player must choose a position for the drawn wild |
        | GameOver    | 2     | A player flipped all 10 slots |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `draw`  | `d`     | Draw one card from the stock |
        | `place` | `p`     | Place the pending wild at `position` (1..10) |
        | `cpu`   | —       | Advance the CPU turn by one step |
        | `log`   | `l`     | View action log (available after game over) |
      operationId: trashExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command, sessionId]
              properties:
                command:
                  type: string
                  enum: [reset, r, draw, d, place, p, cpu, log, l, quit, q]
                sessionId:
                  type: string
                position:
                  type: integer
                  description: Slot index (1..10) for wild placement
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  phase:
                    type: integer
                  current:
                    type: integer
                  players:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: object
                      properties:
                        slots:
                          type: array
                          minItems: 10
                          maxItems: 10
                          items:
                            type: object
                            properties:
                              card:
                                $ref: '#/components/schemas/Card'
                              faceUp:
                                type: boolean
                        isCpu:
                          type: boolean
                  stockSize:
                    type: integer
                  discardSize:
                    type: integer
                  discardTop:
                    $ref: '#/components/schemas/Card'
                  pending:
                    $ref: '#/components/schemas/Card'
                  moveCount:
                    type: integer
                  winner:
                    type: integer
                    description: -1 until the game ends; 0 for the human, 1 for the CPU
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
                    additionalProperties:
                      type: string
        '400':
          description: Bad request

  /whist/exec:
