  /scorpion/exec:
    post:
      tags:
        - scorpion
      summary: Execute a Scorpion (スコーピオン) game command
      description: |
        Send a command to advance a Scorpion solitaire session identified by `sessionId`.
        Scorpion combines Yukon's "move any face-up card (with everything above it) in a group"
        mechanic with Spider's "same-suit K-to-A sequence is removed from the board" mechanic.
        49 cards are dealt into 7 columns (columns 0-3 start with 3 face-down + 4 face-up;
        columns 4-6 are fully face-up). Remaining 3 cards form the stock.

        | Phase     | Value | Description |
