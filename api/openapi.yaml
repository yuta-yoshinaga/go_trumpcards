      summary: Execute a Fifty-one (フィフティワン) game command
      description: |
        4-player card exchange game. Players swap cards between their hand and face-up table cards,
        aiming to maximize the sum of same-suit cards (A=11, J/Q/K=10, 2-10=face value, max=51).

        | Phase   | Value | Description |
        |---------|-------|-------------|
