      tags:
        - canfield
      summary: Execute a Canfield (キャンフィールド) game command
      description: |
        Send a command to advance a Canfield solitaire session identified by `sessionId`.
        Canfield uses a 13-card reserve, 4 tableau columns, 4 foundations, and a stock
        that draws 3 cards at a time to the waste. The foundation base rank is
