                    betAmount: 0
                    betType: 0
                    result: 0
                    payout: 0
                    message: param error.

  /spades/exec:
    post:
      tags:
        - spades
      summary: Execute a Spades game command
      description: |
        Send a command to advance the Spades (スペード) game session identified by
        `sessionId`.  Spades is a 4-player trick-taking game where spades are always
        trump.  Players bid how many tricks they expect to win, then play 13 tricks.
        Scoring: made bid = bid×10 + overtricks (bags); failed = -bid×10; nil bid
        (0) success = +100, fail = -100; every 10 bags = -100 penalty.  First to 500
        wins; drop below -200 and lose.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Bid       | `0`   | Each player declares expected trick wins |
        | Play      | `1`   | Trick play (follow suit; spades are trump) |
        | TrickEnd  | `2`   | Trick resolved; advance with `next` |
        | RoundEnd  | `3`   | All 13 tricks played; advance with `nextround` |
        | GameEnd   | `4`   | A player reached the point limit or fell below -200 |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `bid`       | `b`     | Place a bid (requires `bid` field, 0-13) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `log`       | `l`     | View action log |
      operationId: spadesExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpadesRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bid:
                summary: Bid 3 tricks
                value:
                  command: bid
                  bid: 3
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpadesResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpadesResponse'

  /twotenjack/exec:
    post:
      tags:
        - twotenjack
      summary: Execute a Two Ten Jack game command
      description: |
        Send a command to advance the Two Ten Jack (ツーテンジャック) game session
        identified by `sessionId`.  Two Ten Jack is a 4-player team trick-taking
        game (seats 0,2 vs 1,3).  Each player is dealt 13 cards and the declarer
        chooses a trump suit.  Point cards: A and J = 1 pt each, 10 = 10 pt; the
        last trick wins a +2 bonus (50 pts per round total).  The declaring team
        must take at least 26 points to make the contract.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Declare   | `0`   | Declarer picks the trump suit |
        | Play      | `1`   | Trick play (follow suit if possible, trump cuts) |
        | TrickEnd  | `2`   | Trick resolved; advance with `next` |
        | RoundEnd  | `3`   | Round scored; advance with `nextround` |
        | GameEnd   | `4`   | A team reached the cumulative point limit |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `declare`   | `d`     | Declare trump suit (requires `trumpSuit`, 1=♠ 2=♣ 3=♥ 4=♦) |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `next`      | `n`     | Advance to the next trick |
        | `nextround` | `nr`    | Score the round and start the next |
        | `log`       | `l`     | View action log |
      operationId: twoTenJackExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoTenJackRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              declare:
                summary: Declare spades as trump
                value:
                  command: declare
                  trumpSuit: 1
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoTenJackResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoTenJackResponse'

  /crazyeights/exec:
    post:
      tags:
        - crazyeights
      summary: Execute a Crazy Eights game command
      description: |
        Send a command to advance the Crazy Eights (クレイジーエイト) game session
        identified by `sessionId`.  Crazy Eights is a 4-player shedding card game
        using a standard 52-card deck.  Players match the top discard by suit or rank,
        or play an 8 (wild) and choose the next suit.  Cannot play? Draw 1 card.
        Round ends when a player empties their hand; scoring: 8=50, J/Q/K=10, A=1,
        others=face value.  Match ends at the point limit (default 200).

        The game proceeds through these phases:

        | Phase        | Value | Description |
        |--------------|-------|-------------|
        | Play         | `0`   | Play a card or draw |
        | ChooseSuit   | `1`   | Choose suit after playing an 8 |
        | RoundEnd     | `2`   | A player emptied their hand; advance with `nextround` |
        | GameEnd      | `3`   | A player reached the point limit |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `play`      | `p`     | Play a card (requires `cardIndex`) |
        | `draw`      | `d`     | Draw a card from the draw pile |
        | `suit`      | `s`     | Choose next suit after playing 8 (requires `suit`: 1-4) |
        | `nextround` | `nr`    | Score the round and start the next |
        | `log`       | `l`     | View action log |
      operationId: crazyeightsExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrazyEightsRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
              draw:
                summary: Draw a card
                value:
                  command: draw
                  sessionId: my-session-001
              suit:
                summary: Choose hearts as next suit
                value:
                  command: suit
                  suit: 3
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrazyEightsResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrazyEightsResponse'

  /pageone/exec:
    post:
      tags:
        - pageone
      summary: Execute a Page One game command
      description: |
        Send a command to advance the Page One (ページワン) game session
        identified by `sessionId`.  Page One is a 4-player Japanese shedding
        card game similar to the UNO predecessor.  Match the top discard's
        suit or rank.  When your hand drops to 1 card you must `declare`
        "Page One!" or `skip` to take a 2-card penalty.

        Phases: 0 = Play, 1 = MustDeclare, 2 = RoundEnd, 3 = GameEnd
      operationId: pageoneExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageOneRequest'
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOneResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOneResponse'

  /ginrummy/exec:
    post:
      tags:
        - ginrummy
      summary: Execute a Gin Rummy game command
      description: |
        Send a command to advance the Gin Rummy (ジンラミー) game session
        identified by `sessionId`.  Gin Rummy is a 2-player rummy card game
        using a standard 52-card deck.  10 cards are dealt to each player.
        Draw from stock or discard pile, then discard or knock.  Melds are
        sets (3-4 same rank) and runs (3+ consecutive same suit).  Knock when
        deadwood ≤ 10.  Gin = 0 deadwood (25 bonus).  Undercut = opponent has
        ≤ knocker's deadwood (25 bonus to opponent).  First to reach point
        limit wins.

        The game proceeds through these phases:

        | Phase        | Value | Description |
        |--------------|-------|-------------|
        | Draw         | `0`   | Draw a card from stock or discard pile |
        | Discard      | `1`   | Discard a card or knock |
        | Layoff       | `2`   | Opponent lays off cards on knocker's melds |
        | RoundEnd     | `3`   | Round scored; advance with `nextround` |
        | GameEnd      | `4`   | A player reached the point limit |

        | Command        | Aliases | Description |
        |----------------|---------|-------------|
        | `reset`        | `r`     | Start / restart a game |
        | `drawstock`    | `ds`    | Draw a card from the stock pile |
        | `drawdiscard`  | `dd`    | Draw the top card from the discard pile |
        | `discard`      | `d`     | Discard a card (requires `cardIndex`) |
        | `knock`        | `k`     | Knock (deadwood ≤ 10) (requires `cardIndex`) |
        | `layoff`       | `lo`    | Lay off cards on knocker's melds (requires `cardIndices`) |
        | `nextround`    | `nr`    | Score the round and start the next |
        | `log`          | `l`     | View action log |
      operationId: ginrummyExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GinRummyRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              drawstock:
                summary: Draw from stock pile
                value:
                  command: drawstock
                  sessionId: my-session-001
              drawdiscard:
                summary: Draw from discard pile
                value:
                  command: drawdiscard
                  sessionId: my-session-001
              discard:
                summary: Discard card at index 2
                value:
                  command: discard
                  cardIndex: 2
                  sessionId: my-session-001
              knock:
                summary: Knock (discard card at index 2)
                value:
                  command: knock
                  cardIndex: 2
                  sessionId: my-session-001
              layoff:
                summary: Lay off cards at indices 0 and 3
                value:
                  command: layoff
                  cardIndices: [0, 3]
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GinRummyResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GinRummyResponse'

  /sevenbridge/exec:
    post:
      tags:
        - sevenbridge
      summary: Execute a Seven Bridge game command
      description: |
        Send a command to advance the Seven Bridge (セブンブリッジ) game session
        identified by `sessionId`. Seven Bridge is a 2-player rummy-family game
        using a standard 52-card deck. Each player is dealt 7 cards; the first
        `7` in the remaining deck starts the discard pile. A turn consists of a
        Draw phase (stock, Pon, or Chi) followed by a Play phase (meld, layoff,
        discard). The discard rule allows only a `7`, the same rank as the top
        discard, or a rank ±1 away. First to the configured point limit wins.

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Draw      | `0`   | Draw from stock or claim discard (Pon/Chi) |
        | Play      | `1`   | Meld, layoff, and discard |
        | RoundEnd  | `2`   | Round scored; advance with `nextround` |
        | GameEnd   | `3`   | A player reached the point limit |

        | Command       | Aliases | Description |
        |---------------|---------|-------------|
        | `reset`       | `r`     | Start / restart a game |
        | `drawstock`   | `ds`    | Draw one card from the stock |
        | `pon`         |         | Claim discard to form a set (`cardIndices` = 2) |
        | `chi`         |         | Claim discard to form a run (`cardIndices` = 2) |
        | `meld`        | `m`     | Lay down a meld (`cardIndices` ≥ 3) |
        | `layoff`      | `lo`    | Add one card to an existing meld (`targetPlayerIdx`, `meldIdx`, `cardIndex`) |
        | `discard`     | `d`     | Discard a card (`cardIndex`) |
        | `nextround`   | `nr`    | Start the next round |
        | `log`         | `l`     | View action log |
      operationId: sevenbridgeExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SevenBridgeRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              drawstock:
                summary: Draw from stock
                value:
                  command: drawstock
                  sessionId: my-session-001
              pon:
                summary: Claim discard with two same-rank cards
                value:
                  command: pon
                  cardIndices: [0, 1]
                  sessionId: my-session-001
              meld:
                summary: Meld a set of three
                value:
                  command: meld
                  cardIndices: [0, 1, 2]
                  sessionId: my-session-001
              layoff:
                summary: Add a card to opponent's meld
                value:
                  command: layoff
                  targetPlayerIdx: 1
                  meldIdx: 0
                  cardIndex: 2
                  sessionId: my-session-001
              discard:
                summary: Discard card at index 3
                value:
                  command: discard
                  cardIndex: 3
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevenBridgeResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevenBridgeResponse'

  /canasta/exec:
    post:
      tags:
        - canasta
      summary: Execute a Canasta game command
      description: |
        Send a command to advance the Canasta (カナスタ) game session
        identified by `sessionId`.  Canasta is a 2-player rummy card game
        using 2 decks + 4 jokers (108 cards).  15 cards are dealt to each
        player.  Wild cards (2s and Jokers) can substitute in melds.
        Canasta = 7+ card meld.  First to reach point limit wins.

        The game proceeds through these phases:

        | Phase        | Value | Description |
        |--------------|-------|-------------|
        | Draw         | `0`   | Draw from stock or pick up discard pile |
        | Meld         | `1`   | Meld cards or skip |
        | Discard      | `2`   | Discard a card or go out |
        | RoundEnd     | `3`   | Round scored; advance with `nextround` |
        | GameEnd      | `4`   | A player reached the point limit |

        | Command        | Aliases | Description |
        |----------------|---------|-------------|
        | `reset`        | `r`     | Start / restart a game |
        | `drawstock`    | `ds`    | Draw a card from the stock pile |
        | `drawdiscard`  | `dd`    | Pick up the discard pile (requires `naturalPairIndices`) |
        | `meld`         | `m`     | Meld cards (requires `meldGroups`) |
        | `skipmeld`     | `sm`    | Skip meld phase |
        | `discard`      | `d`     | Discard a card (requires `cardIndex`) |
        | `goout`        | `go`    | Go out (requires at least 1 canasta) |
        | `nextround`    | `nr`    | Score the round and start the next |
        | `log`          | `l`     | View action log |
      operationId: canastaExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanastaRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              drawstock:
                summary: Draw from stock pile
                value:
                  command: drawstock
                  sessionId: my-session-001
              drawdiscard:
                summary: Pick up discard pile with natural pair at indices 0 and 1
                value:
                  command: drawdiscard
                  naturalPairIndices: [0, 1]
                  sessionId: my-session-001
              meld:
                summary: Meld cards at indices 0, 1, 2
                value:
                  command: meld
                  meldGroups: [[0, 1, 2]]
                  sessionId: my-session-001
              discard:
                summary: Discard card at index 2
                value:
                  command: discard
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanastaResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanastaResponse'

  /pinochle/exec:
    post:
      tags:
        - pinochle
      summary: Execute a Pinochle game command
      description: |
        Send a command to advance the Pinochle (ピノクル) game session
        identified by `sessionId`.  Pinochle is a 4-player 2-team trick-taking
        card game with bidding and melding using a 48-card double deck
        (9,10,J,Q,K,A × 2 per suit).  12 cards dealt to each player.

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Bid       | `0`   | Players bid expected total points |
        | Trump     | `1`   | Highest bidder declares trump suit |
        | Meld      | `2`   | All players display melds |
        | Play      | `3`   | 12 tricks with must-follow/trump/win rules |
        | TrickEnd  | `4`   | Trick resolved |
        | RoundEnd  | `5`   | Round scored |
        | GameEnd   | `6`   | A team reached the point limit |

        **Commands:**
        | Command     | Parameters              | Description |
        |-------------|-------------------------|-------------|
        | `reset`     | `config` (opt)          | Start a new game |
        | `bid`       | `bidAmount`             | Place a bid |
        | `pass`      |                         | Pass on bidding |
        | `trump`     | `suit`                  | Declare trump suit (1-4) |
        | `meld`      |                         | Confirm melds and proceed to play |
        | `play`      | `cardIndex`             | Play a card from hand |
        | `next`      |                         | Proceed to next trick |
        | `nextround` |                         | Proceed to next round |
        | `hint`      |                         | Get AI hint |
        | `log`       |                         | Get action log |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinochleRequest'
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinochleResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinochleResponse'

  /spider/exec:
    post:
      tags:
        - spider
      summary: Execute a Spider Solitaire game command
      description: |
        Send a command to advance the Spider Solitaire game session
        identified by `sessionId`.  Spider Solitaire is a single-player
        solitaire game using 2 decks (104 cards) with 10 tableau columns.
        Move same-suit descending sequences between columns.  Complete
        K-through-A same-suit sequences are automatically removed.
        8 completed suits = game clear.  Difficulty: 1/2/4 suits.

        | Phase       | Value | Description |
        |-------------|-------|-------------|
        | Playing     | `0`   | Game in progress |
        | GameClear   | `1`   | All 8 suits completed |
        | GameOver    | `2`   | Player gave up |

        | Command        | Aliases | Description |
        |----------------|---------|-------------|
        | `reset`        | `r`     | Start / restart a game |
        | `deal`         | `d`     | Deal 1 card to each column from stock |
        | `move`         | `m`     | Move cards between tableau columns |
        | `giveup`       | `g`     | Give up |
        | `hint`         | `h`     | Get a move suggestion |
        | `autocomplete` | `ac`    | Auto-complete (when all face up) |
        | `undo`         | `u`     | Undo last move |
        | `undo_n`       |         | Undo N moves (requires `n` parameter) |
        | `log`          | `l`     | View action log |
      operationId: spiderExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpiderRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              resetWithDifficulty:
                summary: Start a new game with 2-suit difficulty
                value:
                  command: reset
                  config:
                    difficulty: 2
                  sessionId: my-session-001
              deal:
                summary: Deal cards from stock
                value:
                  command: deal
                  sessionId: my-session-001
              move:
                summary: Move card(s) from column 3, index 2 to column 5
                value:
                  command: move
                  from:
                    zone: tableau
                    col: 3
                    cardIndex: 2
                  to:
                    zone: tableau
                    col: 5
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiderResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpiderResponse'

  /napoleon/exec:
    post:
      tags:
        - napoleon
      summary: Execute a Napoleon game command
      description: |
        Send a command to advance the Napoleon (ナポレオン) game session identified by
        `sessionId`.  Napoleon is a 4-player trick-taking card game using 52 cards + 1
        Joker (53 total).  Players bid the number of picture cards (J/Q/K/A + Joker = 17
        max) they expect to capture.  The highest bidder becomes Napoleon, declares a trump
        suit, and names an adjutant card (hidden ally).  Hidden teams: Napoleon's Army
        (Napoleon + adjutant holder) vs Allied Forces.  Special cards: Joker (mighty --
        strongest card), Spade 3 (joker killer -- beats mighty).  Napoleon's team must
        capture >= bid number of picture cards to win.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Bid       | `0`   | Each player bids picture card count or passes |
        | Trump     | `1`   | Napoleon declares the trump suit |
        | Exchange  | `2`   | Napoleon exchanges cards with the kitty |
        | Play      | `3`   | Trick play (follow suit; trump is declared suit) |
        | TrickEnd  | `4`   | Trick resolved; advance with `next` |
        | RoundEnd  | `5`   | All 13 tricks played; advance with `nextround` |
        | GameEnd   | `6`   | A player reached the point limit |

        | Command        | Aliases | Description |
        |----------------|---------|-------------|
        | `reset`        | `r`     | Start / restart a game |
        | `bid`          | `b`     | Place a bid (requires `bid` field) or pass (bid = 0) |
        | `trump`        | `t`     | Declare trump suit (requires `suit` field: 1-4) |
        | `exchange`     | `e`     | Exchange cards with kitty (requires `cardIndices`) |
        | `play`         | `p`     | Play a card (requires `cardIndex`) |
        | `next`         | `n`     | Advance to the next trick |
        | `nextround`    | `nr`    | Score the round and start the next |
        | `hint`         | `h`     | Get a play suggestion |
        | `log`          | `l`     | View action log |
      operationId: napoleonExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NapoleonRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bid:
                summary: Bid 12 picture cards
                value:
                  command: bid
                  bid: 12
                  sessionId: my-session-001
              pass:
                summary: Pass on bidding
                value:
                  command: bid
                  bid: 0
                  sessionId: my-session-001
              trump:
                summary: Declare spades as trump
                value:
                  command: trump
                  suit: 1
                  sessionId: my-session-001
              exchange:
                summary: Exchange cards at indices 0 and 3 with kitty
                value:
                  command: exchange
                  cardIndices: [0, 3]
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NapoleonResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NapoleonResponse'

  /indianpoker/exec:
    post:
      tags:
        - indianpoker
      summary: Execute an Indian Poker game command
      description: |
        Send a command to advance the Indian Poker (インディアンポーカー) game session
        identified by `sessionId`.  Indian Poker is a 4-player betting card game where
        each player can see everyone else's card but not their own.  Each round, one card
        is dealt to each player and held on their forehead (visible to others).  Players
        bet based on the strength they infer from opponents' cards and their own betting
        behavior.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Init      | `0`   | Initial state before first reset |
        | Ante      | `1`   | Ante posted; cards dealt |
        | Betting   | `2`   | Betting round (fold/check/call/bet/raise/all-in) |
        | Showdown  | `3`   | Cards revealed; winner determined |
        | End       | `4`   | A player is eliminated (0 chips) |

        | Command   | Aliases | Description |
        |-----------|---------|-------------|
        | `reset`   | `r`     | Start / restart a game |
        | `fold`    | `f`     | Fold the current hand |
        | `check`   | `ck`    | Check (no bet, when no outstanding bet) |
        | `call`    | `c`     | Call the current bet |
        | `bet`     | `b`     | Place a bet (requires `amount`) |
        | `raise`   | `ra`    | Raise (requires `amount`) |
        | `allin`   | `a`     | Go all-in |
        | `log`     | `l`     | View action log |
      operationId: indianPokerExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndianPokerRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              fold:
                summary: Fold the current hand
                value:
                  command: fold
                  sessionId: my-session-001
              bet:
                summary: Place a bet of 50
                value:
                  command: bet
                  amount: 50
                  sessionId: my-session-001
              call:
                summary: Call the current bet
                value:
                  command: call
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndianPokerResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndianPokerResponse'

  /videopoker/exec:
    post:
      tags:
        - videopoker
      summary: Execute a Video Poker game command
      description: |
        Send a command to advance the Video Poker (Jacks or Better) game session
        identified by `sessionId`.  Video Poker is a single-player casino card game
        using a standard 52-card deck.  The player bets 1-5 coins, receives 5 cards,
        chooses which cards to hold, then draws replacements.  The final hand is
        evaluated and paid according to the Jacks or Better pay table.

        The game proceeds through these phases:

        | Phase   | Value | Description |
        |---------|-------|-------------|
        | Bet     | `1`   | Place a bet (1-5 coins) |
        | Draw    | `2`   | Choose cards to hold, then draw replacements |
        | Result  | `3`   | Final hand evaluated; payout displayed |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place a bet (requires `amount`: 1-5) |
        | `hold`  | `h`     | Hold cards and draw (requires `indices`: array of card positions 0-4) |
        | `log`   | `l`     | View action log |
      operationId: videoPokerExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoPokerRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bet:
                summary: Bet 3 coins
                value:
                  command: bet
                  amount: 3
                  sessionId: my-session-001
              hold:
                summary: Hold cards at positions 0, 2, and 4
                value:
                  command: hold
                  indices: [0, 2, 4]
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPokerResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPokerResponse'

  /deuceswild/exec:
    post:
      tags:
        - deuceswild
      summary: Execute a Deuces Wild game command
      description: |
        Send a command to advance the Deuces Wild game session identified by
        `sessionId`.  Deuces Wild is a Video Poker variant using a standard
        52-card deck where all 2s are wild cards.  The player bets 1-5 coins,
        receives 5 cards, chooses which cards to hold, then draws replacements.
        The final hand is evaluated using wild card substitution and paid
        according to the Deuces Wild pay table.

        The game proceeds through these phases:

        | Phase   | Value | Description |
        |---------|-------|-------------|
        | Bet     | `1`   | Place a bet (1-5 coins) |
        | Draw    | `2`   | Choose cards to hold, then draw replacements |
        | Result  | `3`   | Final hand evaluated; payout displayed |

        | Command | Aliases | Description |
        |---------|---------|-------------|
