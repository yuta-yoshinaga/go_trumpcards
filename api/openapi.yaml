          $ref: '#/components/schemas/SpiderHint'
        message:
          type: string
        messageCode:
          type: string
        messageParams:
          type: object
          additionalProperties:
            type: string

    # -------------------------------------------------------------------------
    # Napoleon
    # -------------------------------------------------------------------------
    NapoleonRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bid` (`b`),
            `trump` (`t`), `exchange` (`e`), `play` (`p`), `next` (`n`),
            `nextround` (`nr`), `hint` (`h`), `log` (`l`),
            `setdifficulty` (`sd`), `setlimit` (`sl`), `setminbid` (`sm`).
          enum: [reset, r, bid, b, trump, t, exchange, e, play, p, next, n, nextround, nr, hint, h, log, l, setdifficulty, sd, setlimit, sl, setminbid, sm]
          example: reset
        bid:
          type: integer
          description: Bid value (number of picture cards, or 0 to pass).  Required for `bid` command.
          minimum: 0
          maximum: 17
          example: 12
        suit:
          type: integer
          description: "Trump suit (1=Spade, 2=Clover, 3=Heart, 4=Diamond).  Required for `trump` command."
          minimum: 1
          maximum: 4
          example: 1
        cardIndex:
          type: integer
          description: Index of the card to play.  Required for `play` command.
          example: 2
        cardIndices:
          type: array
          items:
            type: integer
          description: Indices of cards to exchange with kitty.  Required for `exchange` command.
          example: [0, 3]
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
            pointLimit:
              type: integer
              minimum: 1
              maximum: 1000
            minBid:
              type: integer
              minimum: 1
              maximum: 17
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    NapoleonResponse:
      type: object
      description: Current state of the Napoleon game
      properties:
        players:
          type: array
          description: Array of player objects
          items:
            type: object
            properties:
              id:
                type: integer
              isHuman:
                type: boolean
              cardCount:
                type: integer
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              bid:
                type: integer
              picCards:
                type: integer
                description: Number of picture cards captured
              cumulativeScore:
                type: integer
              isNapoleon:
                type: boolean
              isAdjutant:
                type: boolean
        phase:
          type: integer
          description: "Game phase: 0 = Bid, 1 = Trump, 2 = Exchange, 3 = Play, 4 = TrickEnd, 5 = RoundEnd, 6 = GameEnd"
          enum: [0, 1, 2, 3, 4, 5, 6]
          example: 0
        roundNumber:
          type: integer
          description: Current round number
        trickNumber:
          type: integer
          description: Current trick number within the round
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
        bidPlayerIdx:
          type: integer
          description: Index of the player currently bidding
        napoleonIdx:
          type: integer
          description: Index of the Napoleon player (-1 if not yet decided)
        adjutantCard:
          $ref: '#/components/schemas/Card'
        trumpSuit:
          type: integer
          description: "Declared trump suit (1=Spade, 2=Clover, 3=Heart, 4=Diamond, 0=not yet declared)"
        currentTrick:
          type: array
          description: Cards played in the current trick
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              card:
                $ref: '#/components/schemas/Card'
        kitty:
          type: array
          description: Kitty cards (visible to Napoleon during exchange phase)
          items:
            $ref: '#/components/schemas/Card'
        napoleonBid:
          type: integer
          description: Napoleon's winning bid
        napoleonPicCards:
          type: integer
          description: Total picture cards captured by Napoleon's team
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        winnerIdx:
          type: integer
          description: Index of the winning player (-1 if not ended)
        config:
          type: object
          properties:
            cpuDifficulty:
              type: integer
            pointLimit:
              type: integer
            minBid:
              type: integer
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          nullable: true
          description: Recommended play hint (only present when hint command is used)
          properties:
            cardIndex:
              type: integer
              nullable: true
              description: Recommended card index
            reason:
              type: string
              description: Machine-readable reason key for the hint

    # -------------------------------------------------------------------------
    # Indian Poker
    # -------------------------------------------------------------------------
    IndianPokerRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `fold` (`f`),
            `check` (`ck`), `call` (`c`), `bet` (`b`), `raise` (`ra`),
            `allin` (`a`), `log` (`l`).
          enum: [reset, r, fold, f, check, ck, call, c, bet, b, raise, ra, allin, a, log, l]
          example: reset
        amount:
          type: integer
          description: Bet/raise amount.  Required for `bet` and `raise` commands.
          minimum: 1
          example: 50
        humanPlayMs:
          type: integer
          description: Time in milliseconds the human took to decide (used for Meta-AI hesitation tracking).
          example: 3000
        ante:
          type: integer
          description: Ante amount (only used with `reset`).
          minimum: 1
          example: 10
        bettingLimit:
          type: integer
          description: "Betting limit type (0=Fixed, 1=Pot Limit, 2=No Limit).  Only used with `reset`."
          minimum: 0
          maximum: 2
          example: 2
        cpuMetaAI:
          type: boolean
          description: "Whether CPU Meta-AI is enabled.  Only used with `reset`."
          example: true
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    IndianPokerResponse:
      type: object
      description: Current state of the Indian Poker game
      properties:
        players:
          type: array
          description: Array of player objects
          items:
            type: object
            properties:
              id:
                type: integer
              isHuman:
                type: boolean
              card:
                $ref: '#/components/schemas/Card'
                nullable: true
                description: "Player's card (null for human during betting, visible for CPUs)"
              chips:
                type: integer
              currentBet:
                type: integer
              folded:
                type: boolean
              allIn:
                type: boolean
              playStyleName:
                type: string
        pot:
          type: integer
          description: Current pot size
        sidePots:
          type: array
          description: Side pots (when players are all-in with different amounts)
          items:
            type: object
            properties:
              amount:
                type: integer
              eligiblePlayers:
                type: array
                items:
                  type: integer
        dealerIdx:
          type: integer
          description: Index of the current dealer
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
        phase:
          type: integer
          description: "Game phase: 0 = Init, 1 = Ante, 2 = Betting, 3 = Showdown, 4 = End"
          enum: [0, 1, 2, 3, 4]
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        lastBet:
          type: integer
          description: The last bet amount in the current round
        minRaise:
          type: integer
          description: Minimum raise amount
        raiseCount:
          type: integer
          description: Number of raises in the current round
        maxBetAmount:
          type: integer
          description: Maximum allowed bet amount (based on betting limit)
        bettingLimit:
          type: integer
          description: "Current betting limit (0=Fixed, 1=Pot Limit, 2=No Limit)"
        ante:
          type: integer
          description: Current ante amount
        handCount:
          type: integer
          description: Number of hands played
        roundResults:
          type: array
          description: Results from the showdown
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              card:
                $ref: '#/components/schemas/Card'
              cardRank:
                type: integer
                description: "Card rank (2-14, Ace=14)"
              wonAmount:
                type: integer
        cpuActions:
          type: array
          description: CPU actions taken during the betting round
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              action:
                type: integer
              amount:
                type: integer
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    VideoPokerRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bet` (`b`),
            `hold` (`h`), `log` (`l`).
          enum: [reset, r, bet, b, hold, h, log, l]
          example: reset
        amount:
          type: integer
          description: Bet amount (1-5 coins).  Required for `bet` command.
          minimum: 1
          maximum: 5
          example: 1
        indices:
          type: array
          description: Card positions to hold (0-4).  Required for `hold` command.
          items:
            type: integer
            minimum: 0
            maximum: 4
          example: [0, 2, 4]
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    VideoPokerResponse:
      type: object
      description: Current state of the Video Poker game
      properties:
        hand:
          type: array
          description: The player's 5-card hand
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = Draw, 3 = Result"
          enum: [1, 2, 3]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 100
        betAmount:
          type: integer
          description: Current bet amount (1-5 coins)
          example: 1
        result:
          type: integer
          description: "Round result: 1 = win, 0 = loss/push, -1 = not resolved"
          enum: [-1, 0, 1]
          example: 0
        payout:
          type: integer
          description: Payout amount for the current round
          example: 0
        handRank:
          type: integer
          description: "Hand rank code (0 = no qualifying hand, higher = better hand)"
          example: 0
        handName:
          type: string
          description: Human-readable name of the evaluated hand rank
          example: ""
        heldIndices:
          type: array
          description: Indices of held cards (0-4)
          items:
            type: integer
          example: []
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Euchre
    # -------------------------------------------------------------------------
    EuchreRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `orderup` (`o`),
            `orderupalone` (`oa`), `pass` (`pa`), `calltrump` (`c`),
            `calltrumpalone` (`ca`), `discard` (`d`), `play` (`p`),
            `next` (`n`), `nextround` (`nr`), `hint` (`h`), `log` (`l`).
          enum: [reset, r, orderup, o, orderupalone, oa, pass, pa, calltrump, c, calltrumpalone, ca, discard, d, play, p, next, n, nextround, nr, hint, h, log, l]
          example: reset
        cardIndex:
          type: integer
          description: Index of the card to play or discard.  Required for `play` and `discard` commands.
          example: 2
        suit:
          type: integer
          description: "Trump suit to call (1=SPADE, 2=CLOVER, 3=HEART, 4=DIAMOND).  Required for `calltrump` and `calltrumpalone` commands."
          minimum: 1
          maximum: 4
          example: 3
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
            pointLimit:
              type: integer
              minimum: 1
              maximum: 100
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    EuchreResponse:
      type: object
      description: Current state of the Euchre game
      properties:
        players:
          type: array
          description: Array of player objects
          items:
            type: object
            properties:
              id:
                type: integer
              isHuman:
                type: boolean
              cardCount:
                type: integer
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              isDealer:
                type: boolean
              isAlone:
                type: boolean
              trickCount:
                type: integer
        teams:
          type: array
          description: Array of team objects (2 teams)
          items:
            type: object
            properties:
              score:
                type: integer
              roundScore:
                type: integer
              isMaker:
                type: boolean
        phase:
          type: integer
          description: "Game phase: 0 = PickUp, 1 = CallTrump, 2 = Discard, 3 = Play, 4 = TrickEnd, 5 = RoundEnd, 6 = GameEnd"
          enum: [0, 1, 2, 3, 4, 5, 6]
          example: 0
        roundNumber:
          type: integer
          description: Current round number
        trickNumber:
          type: integer
          description: Current trick number within the round
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
        dealerIdx:
          type: integer
          description: Index of the dealer
        turnedUpCard:
          $ref: '#/components/schemas/Card'
        trumpSuit:
          type: integer
          description: "Trump suit (1=SPADE, 2=CLOVER, 3=HEART, 4=DIAMOND, 0=not yet decided)"
        currentTrick:
          type: array
          description: Cards played in the current trick
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              card:
                $ref: '#/components/schemas/Card'
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        winnerTeamIdx:
          type: integer
          description: Index of the winning team (-1 if not ended)
        config:
          type: object
          properties:
            cpuDifficulty:
              type: integer
            pointLimit:
              type: integer
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          nullable: true
          description: Recommended play hint (only present when hint command is used)
          properties:
            cardIndex:
              type: integer
              nullable: true
              description: Recommended card index
            reason:
              type: string
              description: Machine-readable reason key for the hint

    # -------------------------------------------------------------------------
    # Pyramid
    # -------------------------------------------------------------------------
    PyramidCard:
      type: object
      description: A card position in the Pyramid layout
      required:
        - zone
      properties:
        zone:
          type: string
          description: "Zone name: pyramid or waste"
          enum: [pyramid, waste]
          example: pyramid
        row:
          type: integer
          description: Row index (0-based, required for pyramid zone)
          example: 6
        col:
          type: integer
          description: Column index (0-based, required for pyramid zone)
          example: 0

    PyramidRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `draw` (`d`),
            `remove` (`rm`), `giveup` (`g`), `hint` (`h`), `undo` (`u`),
            `undo_n`, `log` (`l`).
          enum: [reset, r, draw, d, remove, rm, giveup, g, hint, h, undo, u, undo_n, log, l]
          example: remove
        card1:
          description: First card for a remove command
          $ref: '#/components/schemas/PyramidCard'
        card2:
          description: Second card for a remove command (pair removal)
          $ref: '#/components/schemas/PyramidCard'
        n:
          type: integer
          description: Number of undos to perform (required when command is undo_n)
          example: 3
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    PyramidOutputCard:
      type: object
      description: A card in the Pyramid layout with its state
      properties:
        card:
          description: Card details (null when removed)
          $ref: '#/components/schemas/Card'
        removed:
          type: boolean
          description: Whether the card has been removed
          example: false
        exposed:
          type: boolean
          description: Whether the card is exposed (can be selected)
          example: true

    PyramidResponse:
      type: object
      description: Current state of the Pyramid game
      required:
        - pyramid
        - stockCount
        - waste
        - phase
        - moveCount
        - canUndo
        - isStalemate
        - undoToEscape
        - message
      properties:
        pyramid:
          type: array
          description: The 7 pyramid rows, each containing an array of cards (row i has i+1 cards)
          items:
            type: array
            items:
              $ref: '#/components/schemas/PyramidOutputCard'
        stockCount:
          type: integer
          description: Number of cards remaining in the stock pile
          example: 24
        waste:
          type: array
          description: Cards in the waste pile (top card is the last element)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 0 = Playing, 1 = GameClear, 2 = GameOver"
          enum: [0, 1, 2]
          example: 0
        moveCount:
          type: integer
          description: Total number of moves made in the current game
          example: 0
        canUndo:
          type: boolean
          description: Whether the undo action is available
          example: false
        isStalemate:
          type: boolean
          description: Whether the game is in a stalemate (no moves can lead to a win)
          example: false
        undoToEscape:
          type: integer
          description: Number of undos needed to reach a non-stalemate state (0 if not stalemate, -1 if no escape)
          example: 0
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          description: Hint for the next available move (only present when hint command is used)
          properties:
            type:
              type: string
              description: "Hint type: pair, king, waste_pair, waste_king"
              enum: [pair, king, waste_pair, waste_king]
            row1:
              type: integer
              description: Row of first card (-1 for waste operations)
            col1:
              type: integer
              description: Column of first card (-1 for waste operations)
            row2:
              type: integer
              description: Row of second card (-1 for king/waste operations)
            col2:
              type: integer
              description: Column of second card (-1 for king/waste operations)

    TriPeaksRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `draw` (`d`),
            `remove` (`rm`), `giveup` (`g`), `hint` (`h`), `undo` (`u`),
            `undo_n`, `log` (`l`).
          enum: [reset, r, draw, d, remove, rm, giveup, g, hint, h, undo, u, undo_n, log, l]
          example: remove
        row:
          type: integer
          description: Row index of the tableau card to remove (0-based)
          example: 3
        col:
          type: integer
          description: Column index of the tableau card to remove (0-based)
          example: 0
        n:
          type: integer
          description: Number of undos to perform (required when command is undo_n)
          example: 3
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    TriPeaksOutputCard:
      type: object
      description: A card in the TriPeaks tableau with its state
      properties:
        card:
          description: Card details (null when removed)
