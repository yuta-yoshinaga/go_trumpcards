            items:
              $ref: '#/components/schemas/TriPeaksOutputCard'
        stockCount:
          type: integer
          description: Number of cards remaining in the stock pile
          example: 23
        waste:
          type: array
          description: Cards in the waste pile (top card is the last element)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 0 = Playing, 1 = GameClear, 2 = GameOver"
          enum: [0, 1, 2]
          example: 0
        moveCount:
          type: integer
          description: Total number of moves made in the current game
          example: 0
        canUndo:
          type: boolean
          description: Whether the undo action is available
          example: false
        isStalemate:
          type: boolean
          description: Whether the game is in a stalemate (no moves can lead to a win)
          example: false
        undoToEscape:
          type: integer
          description: Number of undos needed to reach a non-stalemate state (0 if not stalemate, -1 if no escape)
          example: 0
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          description: Hint for the next available move (only present when hint command is used)
          properties:
            row:
              type: integer
              description: Row of the card to remove
            col:
              type: integer
              description: Column of the card to remove

    CribbageRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `discard` (`d`),
            `peg` (`p`), `go`, `shownext` (`sn`), `nextround` (`nr`),
            `setdifficulty` (`sd`), `setlimit` (`sl`), `log` (`l`).
          enum: [reset, r, discard, d, peg, p, go, shownext, sn, nextround, nr, setdifficulty, sd, setlimit, sl, log, l]
          example: discard
        cardIndex:
          type: integer
          description: Card index for peg command
          example: 0
        cardIndices:
          type: array
          items:
            type: integer
          description: Card indices for discard command (exactly 2 indices)
          example: [4, 5]
        config:
          type: object
          description: Game configuration (applied on reset)
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty: 0 = Easy, 1 = Normal, 2 = Hard"
              enum: [0, 1, 2]
              example: 1
            pointLimit:
              type: integer
              description: Point limit to win (default 121)
              example: 121
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    CribbagePlayer:
      type: object
      description: A player in the Cribbage game
      required:
        - id
        - isHuman
        - cardCount
        - cards
        - roundScore
        - cumulativeScore
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1 = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this player is human
          example: true
        cardCount:
          type: integer
          description: Number of cards in hand
          example: 6
        cards:
          type: array
          description: Player's hand cards (visible to human player; hidden for CPU)
          items:
            $ref: '#/components/schemas/Card'
        roundScore:
          type: integer
          description: Points scored in the current round
          example: 0
        cumulativeScore:
          type: integer
          description: Cumulative score across all rounds
          example: 0

    CribbageScoreDetail:
      type: object
      description: Breakdown of a hand/crib score
      properties:
        fifteens:
          type: integer
          description: Points from combinations summing to 15
          example: 4
        pairs:
          type: integer
          description: Points from pairs
          example: 2
        runs:
          type: integer
          description: Points from runs
          example: 3
        flush:
          type: integer
          description: Points from flush
          example: 0
        nobs:
          type: integer
          description: Points from nobs (Jack of starter suit)
          example: 1
        total:
          type: integer
          description: Total points for this hand/crib
          example: 10

    CribbageResponse:
      type: object
      description: Current state of the Cribbage game
      required:
        - players
        - phase
        - roundNumber
        - currentPlayerIdx
        - dealerIdx
        - crib
        - pegCount
        - pegPlayedCards
        - showPhaseStep
        - handScoreDetails
        - gameEndFlag
        - winnerIdx
        - message
      properties:
        players:
          type: array
          description: Array of 2 players (index 0 = human, index 1 = CPU)
          items:
            $ref: '#/components/schemas/CribbagePlayer'
        phase:
          type: integer
          description: "Game phase: 0 = Discard, 1 = Cut, 2 = Pegging, 3 = Show, 4 = RoundEnd, 5 = GameEnd"
          enum: [0, 1, 2, 3, 4, 5]
          example: 0
        roundNumber:
          type: integer
          description: Current round number
          example: 1
        currentPlayerIdx:
          type: integer
          description: Index of the current player
          example: 0
        dealerIdx:
          type: integer
          description: Index of the dealer for this round
          example: 1
        crib:
          type: array
          description: Cards in the crib (visible only during Show/RoundEnd/GameEnd phases)
          items:
            $ref: '#/components/schemas/Card'
        starter:
          description: The starter (cut) card (null before cut phase)
          $ref: '#/components/schemas/Card'
        pegCount:
          type: integer
          description: Current pegging count (0-31)
          example: 0
        pegPlayedCards:
          type: array
          description: Cards played in the current pegging sequence
          items:
            $ref: '#/components/schemas/Card'
        showPhaseStep:
          type: integer
          description: "Show phase step: 0 = non-dealer hand, 1 = dealer hand, 2 = crib"
          enum: [0, 1, 2]
          example: 0
        handScoreDetails:
          type: array
          description: Score details for show phase [non-dealer hand, dealer hand, crib]
          items:
            $ref: '#/components/schemas/CribbageScoreDetail'
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
          example: false
        winnerIdx:
          type: integer
          description: Index of the winner (-1 if game not ended)
          example: -1
        message:
          type: string
          description: Game status or result message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        config:
          type: object
          description: Current game configuration
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty: 0 = Easy, 1 = Normal, 2 = Hard"
              example: 1
            pointLimit:
              type: integer
              description: Point limit to win
              example: 121

    # -------------------------------------------------------------------------
    # Three Card Poker
    # -------------------------------------------------------------------------
    ThreeCardRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bet` (`b`),
            `play` (`p`), `fold` (`f`), `log` (`l`).
          enum: [r, reset, b, bet, p, play, f, fold, log, l]
          example: bet
        amount:
          type: integer
          description: |
            Ante bet amount.  Required for `bet` command (minimum 10, must be a
            multiple of 10).  Ignored for other commands.
          minimum: 10
          example: 100
        pairPlusBet:
          type: integer
          description: |
            Pair Plus side bet amount.  Optional; used with the `bet`
            command.  0 or omitted means no side bet.
          minimum: 0
          example: 50
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    ThreeCardResponse:
      type: object
      description: Current state of the Three Card Poker game
      required:
        - playerHand
        - dealerHand
        - phase
        - chips
        - anteBet
        - pairPlusBet
        - playBet
        - result
        - antePayout
        - playPayout
        - anteBonusPayout
        - pairPlusPayout
        - totalPayout
        - dealerQualified
        - playerHandRank
        - dealerHandRank
        - message
      properties:
        playerHand:
          type: array
          description: Cards in the player's hand (3 cards)
          items:
            $ref: '#/components/schemas/Card'
        dealerHand:
          type: array
          description: Cards in the dealer's hand (3 cards; hidden until End phase)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = Action, 3 = End"
          enum: [1, 2, 3]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 1000
        anteBet:
          type: integer
          description: Current Ante bet amount
          example: 100
        pairPlusBet:
          type: integer
          description: Current Pair Plus side bet amount
          example: 50
        playBet:
          type: integer
          description: Current Play bet amount (equal to Ante when played)
          example: 0
        result:
          type: integer
          description: "Game result: 1 = Player wins, -1 = Dealer wins, 0 = Push/not resolved"
          enum: [-1, 0, 1]
          example: 0
        antePayout:
          type: integer
          description: Payout from the Ante bet
          example: 0
        playPayout:
          type: integer
          description: Payout from the Play bet
          example: 0
        anteBonusPayout:
          type: integer
          description: Ante Bonus payout (Straight Flush 5:1, Three of a Kind 4:1, Straight 1:1)
          example: 0
        pairPlusPayout:
          type: integer
          description: Pair Plus side bet payout
          example: 0
        totalPayout:
          type: integer
          description: Total payout for the current round (sum of all payouts)
          example: 0
        dealerQualified:
          type: boolean
          description: Whether the dealer qualified (Q-high or better)
          example: false
        playerHandRank:
          type: integer
          description: Player's hand rank (1=High Card, 2=Pair, 3=Flush, 4=Straight, 5=Three of a Kind, 6=Straight Flush)
          example: 2
        dealerHandRank:
          type: integer
          description: Dealer's hand rank (1=High Card, 2=Pair, 3=Flush, 4=Straight, 5=Three of a Kind, 6=Straight Flush)
          example: 1
        message:
          type: string
          description: Game result or error message. Empty during bet/action phase.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Caribbean Stud Poker
    # -------------------------------------------------------------------------
    CaribbeanStudRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command. Accepted values: `reset` (`r`), `bet` (`b`),
            `play` (`p`), `fold` (`f`), `log` (`l`).
          enum: [r, reset, b, bet, p, play, f, fold, log, l]
          example: bet
        amount:
          type: integer
          description: |
            Ante bet amount. Required for `bet` command (minimum 10, must be a
            multiple of 10). Ignored for other commands.
          minimum: 10
          example: 100
        jackpotBet:
          type: integer
          description: |
            Jackpot side bet amount. Optional; used with the `bet` command.
            0 or omitted means no side bet.
          minimum: 0
          example: 10
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    CaribbeanStudResponse:
      type: object
      description: Current state of the Caribbean Stud Poker game
      required:
        - playerHand
        - dealerHand
        - phase
        - chips
        - anteBet
        - jackpotBet
        - playBet
        - result
        - antePayout
        - playPayout
        - jackpotPayout
        - totalPayout
        - dealerQualified
        - playerHandRank
        - dealerHandRank
        - message
      properties:
        playerHand:
          type: array
          description: Cards in the player's hand (5 cards)
          items:
            $ref: '#/components/schemas/Card'
        dealerHand:
          type: array
          description: Cards in the dealer's hand (5 cards; hidden until End phase)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = Action, 3 = End"
          enum: [1, 2, 3]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 1000
        anteBet:
          type: integer
          description: Current Ante bet amount
          example: 100
        jackpotBet:
          type: integer
          description: Current Jackpot side bet amount
          example: 10
        playBet:
          type: integer
          description: Current Play bet amount (2x Ante on Call)
          example: 0
        result:
          type: integer
          description: "Game result: 1 = Player wins, -1 = Dealer wins, 0 = Push/not resolved"
          enum: [-1, 0, 1]
          example: 0
        antePayout:
          type: integer
          description: Payout from the Ante bet
          example: 0
        playPayout:
          type: integer
          description: Payout from the Play bet
          example: 0
        jackpotPayout:
          type: integer
          description: Jackpot side bet payout
          example: 0
        totalPayout:
          type: integer
          description: Total payout for the current round (sum of all payouts)
          example: 0
        dealerQualified:
          type: boolean
          description: Whether the dealer qualified (Ace-King high or any pair)
          example: false
        playerHandRank:
          type: integer
          description: Player's 5-card hand rank (0=High Card, 1=One Pair, 2=Two Pair, 3=Three of a Kind, 4=Straight, 5=Flush, 6=Full House, 7=Four of a Kind, 8=Straight Flush, 9=Royal Flush)
          example: 1
        dealerHandRank:
          type: integer
          description: Dealer's 5-card hand rank (same encoding as `playerHandRank`)
          example: 1
        message:
          type: string
          description: Game result or error message. Empty during bet/action phase.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Oh Hell
    # -------------------------------------------------------------------------
    OhHellRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bid` (`b`),
            `play` (`p`), `next` (`n`), `nextround` (`nr`), `hint` (`h`),
            `log` (`l`).
          enum: [reset, r, bid, b, play, p, next, n, nextround, nr, hint, h, log, l]
          example: reset
        bid:
          type: integer
          description: Bid value (0 to current hand size).  Required for `bid` command.
          minimum: 0
          example: 2
        cardIndex:
          type: integer
          description: Index of the card to play.  Required for `play` command.
          example: 2
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
            maxHandSize:
              type: integer
              minimum: 1
              maximum: 13
            scoringVariant:
              type: integer
              minimum: 0
              maximum: 1
            roundDirection:
              type: integer
              minimum: 0
              maximum: 1
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    OhHellResponse:
      type: object
      description: Current state of the Oh Hell game
      properties:
        players:
          type: array
          description: Array of player objects
          items:
            type: object
            properties:
              id:
                type: integer
              isHuman:
                type: boolean
              cardCount:
                type: integer
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              bid:
                type: integer
              roundScore:
                type: integer
              cumulativeScore:
                type: integer
              trickCount:
                type: integer
        phase:
          type: integer
          description: "Game phase: 0 = Bid, 1 = Play, 2 = TrickEnd, 3 = RoundEnd, 4 = GameEnd"
          enum: [0, 1, 2, 3, 4]
          example: 0
        roundNumber:
          type: integer
          description: Current round number
        totalRounds:
          type: integer
          description: Total number of rounds in the game
        handSize:
          type: integer
          description: Number of cards dealt to each player this round
        trickNumber:
          type: integer
          description: Current trick number within the round
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
        bidPlayerIdx:
          type: integer
          description: Index of the player currently bidding
        dealerIdx:
          type: integer
          description: Index of the dealer for the current round
        currentTrick:
          type: array
          description: Cards played in the current trick
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              card:
                $ref: '#/components/schemas/Card'
        trumpCard:
          nullable: true
          description: The card determining the trump suit (null if no trump)
          allOf:
            - $ref: '#/components/schemas/Card'
        trumpSuit:
          type: integer
          description: "Trump suit, same enum as contractSuit (0=not determined, 1=Clubs, 2=Diamonds, 3=Hearts, 4=Spades, 5=NoTrump)"
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        winnerIdx:
          type: integer
          description: Index of the winning player (-1 if not ended)
        leadPlayerIdx:
          type: integer
          description: Index of the player who leads the current trick
        restrictedBid:
          type: integer
          description: The bid value the dealer cannot choose (-1 if no restriction)
        config:
          type: object
          properties:
            cpuDifficulty:
              type: integer
            maxHandSize:
              type: integer
            scoringVariant:
              type: integer
            roundDirection:
              type: integer
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          nullable: true
          description: Recommended play or bid hint (only present when hint command is used)
          properties:
            cardIndex:
              type: integer
              nullable: true
              description: Recommended card index (null during bid phase)
            bid:
              type: integer
              nullable: true
              description: Recommended bid value (null during play phase)
            reason:
              type: string
              description: Machine-readable reason key for the hint

    # -------------------------------------------------------------------------
    # Contract Bridge
    # -------------------------------------------------------------------------
    BridgeRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bid` (`b`),
            `play` (`p`), `next` (`n`), `nextround` (`nr`), `hint` (`h`),
            `log` (`l`).
          enum: [reset, r, bid, b, play, p, next, n, nextround, nr, hint, h, log, l]
          example: reset
        bidType:
          type: integer
          description: |
            Bid type.  Required for `bid` command.
            0 = Pass, 1 = Normal bid (requires bidLevel + bidSuit),
            2 = Double, 3 = Redouble.
          minimum: 0
          maximum: 3
          example: 1
        bidLevel:
          type: integer
          description: "Bid level (1-7).  Required when bidType = 1."
          minimum: 1
          maximum: 7
          example: 1
        bidSuit:
          type: integer
          description: "Bid suit (1=Clubs, 2=Diamonds, 3=Hearts, 4=Spades, 5=NoTrump).  Required when bidType = 1."
          minimum: 1
          maximum: 5
          example: 5
        cardIndex:
          type: integer
          description: Index of the card to play.  Required for `play` command.
          example: 2
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    BridgeResponse:
      type: object
      description: Current state of the Contract Bridge game
      properties:
        players:
          type: array
          description: Array of player objects
          items:
            type: object
            properties:
              id:
                type: integer
              isHuman:
                type: boolean
              cardCount:
                type: integer
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              trickCount:
                type: integer
        teams:
          type: array
          description: Array of team objects (2 teams)
          items:
            type: object
            properties:
              belowLine:
                type: integer
                description: Points below the line (towards game)
              aboveLine:
                type: integer
                description: Points above the line (bonuses/penalties)
              gamesWon:
                type: integer
                description: Number of games won in the rubber
              vulnerable:
                type: boolean
                description: Whether the team is vulnerable
        phase:
          type: integer
          description: "Game phase: 0 = Bid, 1 = Play, 2 = TrickEnd, 3 = RoundEnd, 4 = GameEnd"
          enum: [0, 1, 2, 3, 4]
          example: 0
        roundNumber:
          type: integer
          description: Current round (deal) number
        trickNumber:
          type: integer
          description: Current trick number within the round
        currentPlayerIdx:
          type: integer
          description: Index of the player whose turn it is
        dealerIdx:
          type: integer
          description: Index of the dealer
        declarerIdx:
          type: integer
          description: Index of the declarer (-1 if not yet determined)
        dummyIdx:
          type: integer
          description: Index of the dummy (-1 if not yet determined)
        contractLevel:
          type: integer
          description: Contract level (1-7, 0 if not yet determined)
        contractSuit:
          type: integer
          description: "Contract suit (1=Clubs, 2=Diamonds, 3=Hearts, 4=Spades, 5=NoTrump, 0=not yet determined)"
        contractDoubled:
          type: integer
          description: "Double state (0=none, 1=doubled, 2=redoubled)"
        trumpSuit:
          type: integer
          description: "Trump suit (1=Spade, 2=Clover, 3=Heart, 4=Diamond, -1=NoTrump, 0=not yet determined)"
        currentTrick:
          type: array
          description: Cards played in the current trick
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              card:
                $ref: '#/components/schemas/Card'
        bidHistory:
          type: array
          description: Auction bid history
          items:
            type: object
            properties:
              playerIdx:
                type: integer
              bidType:
                type: integer
              level:
                type: integer
              suit:
                type: integer
        gameEndFlag:
          type: boolean
          description: Whether the game (rubber) has ended
        winnerTeamIdx:
          type: integer
          description: Index of the winning team (-1 if not ended)
        config:
          type: object
          properties:
            cpuDifficulty:
              type: integer
        message:
          type: string
          description: Game status message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        hint:
          type: object
          nullable: true
          description: Recommended play or bid hint (only present when hint command is used)
          properties:
            cardIndex:
              type: integer
              nullable: true
              description: Recommended card index (null during bid phase)
            bidType:
              type: integer
              nullable: true
              description: Recommended bid type (null during play phase)
            bidLevel:
              type: integer
              nullable: true
              description: Recommended bid level (null during play phase)
            bidSuit:
              type: integer
              nullable: true
              description: Recommended bid suit (null during play phase)
            reason:
              type: string
              description: Machine-readable reason key for the hint

    # -------------------------------------------------------------------------
    # Pineapple Poker
    # -------------------------------------------------------------------------
    PineappleRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `fold` (`f`),
            `check` (`ck`), `call` (`c`), `bet` (`b`), `raise` (`ra`),
            `allin` (`a`), `discard` (`d`), `rebuy` (`rb`), `skiprebuy` (`sr`),
            `addon` (`ad`), `skipaddon` (`sa`), `muck` (`m`),
            `show` (`sh`), `quit` (`q`).
          enum: [r, reset, f, fold, ck, check, c, call, b, bet, ra, raise, a, allin, d, discard, rb, rebuy, sr, skiprebuy, ad, addon, sa, skipaddon, m, muck, sh, show, log, q, quit]
          example: bet
        amount:
          type: integer
          description: |
            Bet/raise amount (for the `bet` and `raise` commands).
            Ignored for other commands.
          minimum: 1
          example: 40
        cardIdx:
          type: integer
          description: |
            Index of the hole card to discard (for the `discard` command).
            Must be 0, 1, or 2 (index into the 3 hole cards).
          minimum: 0
          maximum: 2
          example: 1
        smallBlind:
          type: integer
          description: |
            Small blind amount (for the `reset` command).
            Defaults to 5 when omitted.
          minimum: 1
          example: 5
        bigBlind:
          type: integer
          description: |
            Big blind amount (for the `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        tournamentMode:
          type: boolean
          description: |
            Enable tournament mode with blind escalation (for the `reset` command).
            Defaults to false when omitted.
          example: false
        blindLevelHands:
          type: integer
          description: |
            Number of hands before blinds increase in tournament mode.
            Defaults to 10.
          minimum: 1
          example: 10
        blindMultiplier:
          type: integer
          description: |
            Blind multiplier as a percentage when blinds increase.
            Defaults to 200 (= 2x).
          minimum: 101
          example: 200
        bettingLimit:
          type: integer
          description: |
            Betting limit type (used with `reset` command).
            0 = Fixed (default), 1 = Pot Limit, 2 = No Limit.
          minimum: 0
          maximum: 2
          example: 0
        tableSize:
          type: integer
          description: |
            Table size (used with `reset` command).
            4 = 4-max (default), 6 = 6-max, 9 = 9-max.
          enum: [4, 6, 9]
          example: 4
        rebuyEnabled:
          type: boolean
          description: |
            Enable rebuy (used with `reset` command).
            Defaults to false when omitted.
          example: false
        addonEnabled:
          type: boolean
          description: |
            Enable addon (used with `reset` command).
            Defaults to false when omitted.
          example: false
        isDiscardPhase:
          type: boolean
          description: |
            Indicates whether the client is in the discard phase.
            Used internally to track discard state.
          example: false
        discardDone:
          type: boolean
          description: |
            Indicates whether the discard has been completed.
            Used internally to track discard completion.
          example: false
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    PineappleResponse:
      type: object
      required:
        - players
        - communityCards
        - pot
        - sidePots
        - dealerIdx
        - currentTurn
        - phase
        - gameEndFlag
        - lastBet
        - minRaise
        - roundResults
        - cpuActions
        - message
      properties:
        players:
          type: array
          description: State of all players (4/6/9 depending on table size)
          items:
            $ref: '#/components/schemas/HoldemPlayer'
        communityCards:
          type: array
          description: Community cards on the board (0/3/4/5 cards based on phase)
          items:
            $ref: '#/components/schemas/Card'
        pot:
          type: integer
          description: Current main pot size
          minimum: 0
          example: 30
        sidePots:
          type: array
          description: Side pots (created when players go all-in with different amounts)
          items:
            $ref: '#/components/schemas/HoldemSidePot'
        dealerIdx:
          type: integer
          description: Index of the dealer for this round
          example: 0
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        phase:
          type: integer
          description: |
            Current game phase:
            - `0` — Init
            - `1` — PreFlop
            - `2` — Flop
            - `3` — Turn
            - `4` — River
            - `5` — Showdown
            - `6` — End
            - `7` — Rebuy/Addon
            - `8` — Discard
          enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
          example: 1
        gameEndFlag:
          type: boolean
          description: Whether the round has ended
          example: false
        lastBet:
          type: integer
          description: The current highest bet in this betting round
          minimum: 0
          example: 10
        minRaise:
          type: integer
          description: Minimum raise amount
          minimum: 0
          example: 20
        bettingLimit:
          type: integer
          description: |
            Betting limit type: 0 = Fixed, 1 = Pot Limit, 2 = No Limit.
          enum: [0, 1, 2]
        raiseCount:
          type: integer
          description: Number of raises in the current betting round.
          minimum: 0
        maxBetAmount:
          type: integer
          description: |
            Maximum allowed bet/raise amount for Pot Limit mode.
            0 means no limit (Fixed or No Limit mode).
          minimum: 0
        roundResults:
          type: array
          description: Results for each non-folded player at showdown
          items:
            $ref: '#/components/schemas/HoldemResult'
        cpuActions:
          type: array
          description: CPU actions that occurred since the last human action
          items:
            $ref: '#/components/schemas/HoldemCpuAction'
        isDiscardPhase:
          type: boolean
          description: Whether the game is currently in the discard phase (phase=8)
          example: false
        discardDone:
          type: boolean
          description: Whether the human player has completed discarding
          example: false
        message:
          type: string
          description: |
            Game result or status message.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        handCount:
          type: integer
          description: Number of hands played (for tournament mode display)
          minimum: 0
          example: 0
        smallBlind:
          type: integer
          description: Current small blind amount
          minimum: 1
          example: 5
        bigBlind:
          type: integer
          description: Current big blind amount
          minimum: 2
          example: 10
        tournamentMode:
          type: boolean
          description: Whether tournament mode (blind escalation) is active
          example: false
        tableSize:
          type: integer
          description: Current table size (4/6/9)
          enum: [4, 6, 9]
          example: 4
        muckAvailable:
          type: boolean
          description: Whether the human player can muck (hide) their hand at showdown
          example: false
        equity:
          $ref: '#/components/schemas/HoldemEquity'
        potOdds:
          type: number
          format: double
          description: Pot odds percentage (0-100).
          example: 33.33

    # -------------------------------------------------------------------------
    # Speed
    # -------------------------------------------------------------------------
    SpeedRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: Game command
          enum: [reset, r, play, p, flip, f, hint, h, log, l, quit, q]
          example: play
        cardIndex:
          type: integer
          description: Hand index of the card to play (required for `play` command)
          minimum: 0
          example: 2
        pileIndex:
          type: integer
          description: Center pile index (0 or 1) to play onto (required for `play` command)
          minimum: 0
          maximum: 1
          example: 0
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    SpeedResponse:
      type: object
      description: Current state of the Speed game
      required:
        - players
        - centerPiles
        - phase
        - gameEndFlag
        - winnerIdx
        - config
        - message
      properties:
        players:
          type: array
          description: Both players (index 0 = human, index 1 = CPU)
          items:
            type: object
            properties:
              id:
                type: integer
                description: Player index
              isHuman:
                type: boolean
                description: Whether this player is human
              cardCount:
                type: integer
                description: Number of cards in hand
              cards:
                type: array
                description: Cards in hand (only populated for human player)
                items:
                  $ref: '#/components/schemas/Card'
              drawPileSize:
                type: integer
                description: Number of cards remaining in the draw pile
        centerPiles:
          type: array
          description: The two center piles (top card of each)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 0 = Play, 1 = Stuck, 2 = GameEnd"
          enum: [0, 1, 2]
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        winnerIdx:
          type: integer
          description: Index of the winning player (-1 if game is not over)
          example: -1
        cpuActions:
          type: array
          description: CPU play actions that occurred since the last human action
          items:
            type: object
            properties:
              cardIndex:
                type: integer
              pileIndex:
                type: integer
        hint:
          type: object
          description: Hint for the human player (present when hint command is used)
          properties:
            cardIndex:
              type: integer
            pileIndex:
              type: integer
            found:
              type: boolean
        config:
          type: object
          description: Current game configuration
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty: 0 = Easy, 1 = Normal, 2 = Hard"
        message:
          type: string
          description: Game status or result message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Go Fish
    # -------------------------------------------------------------------------
    GoFishRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: Game command
          enum: [reset, r, ask, log, l]
          example: ask
        targetIdx:
          type: integer
          description: Target player index to ask (required for `ask` command)
          minimum: 0
          maximum: 3
          example: 1
        rank:
          type: integer
          description: Card rank to ask for (1=Ace, 2-10, 11=J, 12=Q, 13=K; required for `ask` command)
          minimum: 1
          maximum: 13
          example: 7
        config:
          type: object
          description: Game configuration (for `reset` command)
          properties:
            cpuDifficulty:
              type: integer
              description: CPU difficulty (0=Easy, 1=Normal, 2=Hard)
              minimum: 0
              maximum: 2
              example: 1
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    GoFishResponse:
      type: object
      description: Current state of the Go Fish game
      required:
        - players
        - phase
        - gameEndFlag
        - winnerIdx
        - stockCount
        - config
        - message
      properties:
        players:
          type: array
          description: All 4 players (index 0 = human, 1-3 = CPU)
          items:
            type: object
            properties:
              id:
                type: integer
                description: Player index
              isHuman:
                type: boolean
                description: Whether this player is human
              cardCount:
                type: integer
                description: Number of cards in hand
              cards:
                type: array
                description: Cards in hand (only populated for human player)
                items:
                  $ref: '#/components/schemas/Card'
              bookCount:
                type: integer
                description: Number of completed books
              books:
                type: array
                description: Completed books (array of 4-card groups)
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Card'
              isFinished:
                type: boolean
                description: Whether this player has finished (no cards and no more draws)
        phase:
          type: integer
          description: "Game phase: 0 = Play, 1 = GameEnd"
          enum: [0, 1]
          example: 0
        gameEndFlag:
          type: boolean
          description: Whether the game has ended
        winnerIdx:
          type: integer
          description: Index of the winning player (-1 if game is not over)
          example: -1
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        stockCount:
          type: integer
          description: Number of cards remaining in the stock pile
          example: 32
        humanAction:
          type: object
          description: The result of the human player's last ask action
          properties:
            askPlayerIdx:
              type: integer
            askTargetIdx:
              type: integer
            askRank:
              type: integer
            success:
              type: boolean
            cardsReceived:
              type: integer
            bookFormed:
              type: boolean
            bookRank:
              type: integer
        cpuActions:
          type: array
          description: CPU actions that occurred since the last human action
          items:
            type: object
            properties:
              askPlayerIdx:
                type: integer
              askTargetIdx:
                type: integer
              askRank:
                type: integer
              success:
                type: boolean
              cardsReceived:
                type: integer
              bookFormed:
                type: boolean
              bookRank:
                type: integer
        config:
          type: object
          description: Current game configuration
          properties:
            cpuDifficulty:
              type: integer
              description: "CPU difficulty: 0 = Easy, 1 = Normal, 2 = Hard"
            cpuMetaAI:
              type: boolean
              description: Whether Meta-AI is enabled
        message:
          type: string
          description: Game status or result message
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Seven Card Stud
    # -------------------------------------------------------------------------
    SevenCardStudRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `fold` (`f`),
            `check` (`ck`), `call` (`c`), `bet` (`b`), `raise` (`ra`),
            `allin` (`a`), `rebuy` (`rb`), `skiprebuy` (`sr`),
            `addon` (`ad`), `skipaddon` (`sa`), `muck` (`m`),
            `show` (`sh`), `log` (`l`), `quit` (`q`).
          enum: [r, reset, f, fold, ck, check, c, call, b, bet, ra, raise, a, allin, rb, rebuy, sr, skiprebuy, ad, addon, sa, skipaddon, m, muck, sh, show, log, l, q, quit]
          example: bet
        amount:
          type: integer
          description: |
            Bet/raise amount (for the `bet` and `raise` commands).
            Ignored for other commands.
          minimum: 1
          example: 40
        humanPlayMs:
          type: integer
          description: Human play hesitation time in milliseconds (0=not measured)
          example: 1200
        ante:
          type: integer
          description: |
            Ante amount (for the `reset` command).
            Defaults to 2 when omitted.
          minimum: 1
          example: 2
        bringIn:
          type: integer
          description: |
            Bring-in amount (for the `reset` command).
            Defaults to 5 when omitted.
          minimum: 1
          example: 5
        smallBet:
          type: integer
          description: |
            Small bet amount used on Third/Fourth Street (for the `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        bigBet:
          type: integer
          description: |
            Big bet amount used on Fifth/Sixth/Seventh Street (for the `reset` command).
            Defaults to 20 when omitted.
          minimum: 1
          example: 20
        bettingLimit:
          type: integer
          description: |
            Betting limit type (used with `reset` command).
            0 = Fixed (default), 1 = Pot Limit, 2 = No Limit.
          minimum: 0
          maximum: 2
          example: 0
        tableSize:
          type: integer
          description: |
            Table size (used with `reset` command).
            2 through 7 players. Defaults to 4.
          minimum: 2
          maximum: 7
          example: 4
        tournamentMode:
          type: boolean
          description: |
            Enable tournament mode with ante escalation (for the `reset` command).
            Defaults to false when omitted.
          example: false
        anteLevelHands:
          type: integer
          description: |
            Number of hands before ante increases in tournament mode (for the `reset` command).
            Defaults to 10 when omitted. Must be >= 1.
          minimum: 1
          example: 10
        anteMultiplier:
          type: integer
          description: |
            Ante multiplier as a percentage when ante increases (for the `reset` command).
            Defaults to 200 (= 2x). Must be >= 101.
          minimum: 101
          example: 200
        rebuyEnabled:
          type: boolean
          description: |
            Enable rebuy (used with `reset` command).
            Defaults to false when omitted.
          example: false
        rebuyMaxCount:
          type: integer
          description: |
            Maximum number of rebuys per player (used with `reset` command).
            Defaults to 3 when omitted.
          minimum: 1
          example: 3
        rebuyChips:
          type: integer
          description: |
            Chips granted per rebuy (used with `reset` command).
            Defaults to 1000 when omitted.
          minimum: 1
          example: 1000
        rebuyPeriodHands:
          type: integer
          description: |
            Number of hands during which rebuy is available (used with `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        addonEnabled:
          type: boolean
          description: |
            Enable addon (used with `reset` command).
            Defaults to false when omitted.
          example: false
        addonChips:
          type: integer
          description: |
            Chips granted by addon (used with `reset` command).
            Defaults to 1500 when omitted.
          minimum: 1
          example: 1500
        addonAfterHand:
          type: integer
          description: |
            Hand number after which addon becomes available (used with `reset` command).
            Defaults to 10 when omitted.
          minimum: 1
          example: 10
        cpuMetaAI:
          type: boolean
          description: |
            When true, CPUs adaptively adjust bluff and call behavior based on
            session-scoped game history (Meta-AI). Defaults to false.
          default: false
          example: false
        profile:
          type: object
          description: Human player profile for Meta-AI (sent back by the client to persist across sessions)
        sessionId:
          type: string
          description: Unique session identifier (max 256 characters)
          maxLength: 256
          example: my-session-001

    SevenCardStudPlayer:
      type: object
      required:
        - id
        - isHuman
        - holeCards
        - doorCards
        - chips
        - currentBet
        - folded
        - allIn
        - handRank
        - handName
        - bestHand
        - playStyleName
      properties:
        id:
          type: integer
          description: Player index (0 = human, 1+ = CPU)
          example: 0
        isHuman:
          type: boolean
          description: Whether this is the human player
          example: true
        holeCards:
          type: array
          description: |
            Face-down hole cards (2 initially, 3 after Seventh Street).
            Human player's cards are always visible.
            CPU cards are hidden (empty array) until showdown.
          items:
            $ref: '#/components/schemas/Card'
        doorCards:
          type: array
          description: |
            Face-up door cards (1 on Third Street, up to 4 by Sixth Street).
            Visible to all players.
          items:
            $ref: '#/components/schemas/Card'
        chips:
          type: integer
          description: Current chip count
          minimum: 0
          example: 990
        currentBet:
          type: integer
          description: Current round bet amount
          minimum: 0
          example: 10
        folded:
          type: boolean
          description: Whether the player has folded
          example: false
        allIn:
          type: boolean
          description: Whether the player is all-in
          example: false
        handRank:
          type: integer
          description: |
            Numeric hand rank (only populated at showdown for non-folded players):
            0 = High Card, 1 = One Pair, 2 = Two Pair, 3 = Three of a Kind,
            4 = Straight, 5 = Flush, 6 = Full House, 7 = Four of a Kind,
            8 = Straight Flush, 9 = Royal Flush.
          minimum: 0
          maximum: 9
          example: 0
        handName:
          type: string
          description: Human-readable hand name (empty until showdown)
          example: ""
        bestHand:
          type: array
          description: Best 5-card hand (only populated at showdown)
          items:
            $ref: '#/components/schemas/Card'
        playStyleName:
          type: string
          description: |
            CPU play style name: TAG (Tight-Aggressive), LAP (Loose-Passive),
            TAP (Tight-Passive), LAG (Loose-Aggressive), GTO (Game Theory Optimal).
            Empty for human player.
          example: TAG
        totalHands:
          type: integer
          description: Total number of hands played (for HUD stats)
          minimum: 0
          example: 10
        vpip:
          type: integer
          description: VPIP percentage (Voluntarily Put $ In Pot)
          minimum: 0
          maximum: 100
          example: 50
        pfr:
          type: integer
          description: PFR percentage (Pre-Flop Raise)
          minimum: 0
          maximum: 100
          example: 25
        threeBet:
          type: integer
          description: 3Bet percentage
          minimum: 0
          maximum: 100
          example: 10
        af:
          type: string
          description: "Aggression Factor (postflop bets+raises / calls). Values: decimal (e.g. \"2.5\"), \"inf\" (bets but no calls), \"-\" (no actions)"
          example: "2.5"

    SevenCardStudCpuAction:
      type: object
      description: Record of a CPU player's betting action
      required:
        - playerIdx
        - action
        - amount
      properties:
        playerIdx:
          type: integer
          description: Index of the CPU player who acted
          example: 1
        action:
          type: integer
          description: |
            Action taken: 0 = Fold, 1 = Check, 2 = Call,
            3 = Bet, 4 = Raise, 5 = All-in.
          enum: [0, 1, 2, 3, 4, 5]
          example: 2
        amount:
          type: integer
          description: Amount bet/raised (0 for fold/check/call/all-in)
          example: 0

    SevenCardStudResult:
      type: object
      description: Result for a player at showdown
      required:
        - playerIdx
        - handRank
        - handName
        - bestHand
        - wonAmount
      properties:
        playerIdx:
          type: integer
          description: Index of the player
          example: 0
        handRank:
          type: integer
          description: Numeric hand rank
          example: 1
        handName:
          type: string
          description: Hand name (e.g., "One Pair")
          example: One Pair
        kickers:
          type: string
          description: Kicker card values formatted as display string
        bestHand:
          type: array
          description: Best 5-card hand
          items:
            $ref: '#/components/schemas/Card'
        wonAmount:
          type: integer
          description: Chips won from the pot
          example: 40
        mucked:
          type: boolean
          description: Whether the player mucked (hid) their hand at showdown
          example: false

    SevenCardStudSidePot:
      type: object
      description: A side pot created when a player goes all-in
      required:
        - amount
        - eligiblePlayers
      properties:
        amount:
          type: integer
          description: Total chips in this side pot
          example: 100
        eligiblePlayers:
          type: array
          description: Indices of players eligible to win this pot
          items:
            type: integer
          example: [0, 1, 2]

    SevenCardStudResponse:
      type: object
      required:
        - players
        - pot
        - sidePots
        - dealerIdx
        - currentTurn
        - phase
        - gameEndFlag
        - lastBet
        - minRaise
        - roundResults
        - cpuActions
        - message
      properties:
        players:
          type: array
          description: State of all players (2-7 depending on table size)
          items:
            $ref: '#/components/schemas/SevenCardStudPlayer'
        communityCard:
          nullable: true
          description: Used as a shared community card only when the deck runs out of cards, otherwise null
        pot:
          type: integer
          description: Current main pot size
          minimum: 0
          example: 30
        sidePots:
          type: array
          description: Side pots (created when players go all-in with different amounts)
          items:
            $ref: '#/components/schemas/SevenCardStudSidePot'
        dealerIdx:
          type: integer
          description: Index of the dealer for this round
          example: 0
        currentTurn:
          type: integer
          description: Index of the player whose turn it is
          example: 0
        phase:
          type: integer
          description: |
            Current game phase:
            - `0` — Init
            - `1` — Third Street
            - `2` — Fourth Street
            - `3` — Fifth Street
            - `4` — Sixth Street
            - `5` — Seventh Street
            - `6` — Showdown
            - `7` — End
            - `8` — Rebuy/Addon
          enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
          example: 1
        gameEndFlag:
          type: boolean
          description: Whether the round has ended
          example: false
        lastBet:
          type: integer
          description: The current highest bet in this betting round
          minimum: 0
          example: 10
        minRaise:
          type: integer
          description: Minimum raise amount
          minimum: 0
          example: 20
        bettingLimit:
          type: integer
          description: |
            Betting limit type: 0 = Fixed, 1 = Pot Limit, 2 = No Limit.
          enum: [0, 1, 2]
        raiseCount:
          type: integer
          description: Number of raises in the current betting round.
          minimum: 0
        maxBetAmount:
          type: integer
          description: |
            Maximum allowed bet/raise amount for Pot Limit mode.
            0 means no limit (Fixed or No Limit mode).
          minimum: 0
        roundResults:
          type: array
          description: Results for each non-folded player at showdown
          items:
            $ref: '#/components/schemas/SevenCardStudResult'
        cpuActions:
          type: array
          description: CPU actions that occurred since the last human action
          items:
            $ref: '#/components/schemas/SevenCardStudCpuAction'
        message:
          type: string
          description: |
            Game result or status message.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.
        handCount:
          type: integer
          description: Number of hands played (for tournament mode display)
          minimum: 0
          example: 0
        ante:
          type: integer
          description: Current ante amount
          minimum: 1
          example: 2
        bringIn:
          type: integer
          description: Current bring-in amount
          minimum: 1
          example: 5
        smallBet:
          type: integer
          description: Small bet amount (Third/Fourth Street)
          minimum: 1
          example: 10
        bigBet:
          type: integer
          description: Big bet amount (Fifth/Sixth/Seventh Street)
          minimum: 1
          example: 20
        tournamentMode:
          type: boolean
          description: Whether tournament mode (ante escalation) is active
          example: false
        anteLevelHands:
          type: integer
          description: Number of hands before ante increases
          minimum: 1
          example: 10
        anteMultiplier:
          type: integer
          description: Ante multiplier percentage (e.g. 200 = 2x)
          minimum: 101
          example: 200
        tableSize:
          type: integer
          description: Current table size (2-7)
          minimum: 2
          maximum: 7
          example: 4
        bringInPlayerIdx:
          type: integer
          description: Index of the player required to post the bring-in (lowest door card)
          example: 2
        rebuyAvailable:
          type: boolean
          description: Whether rebuy is available in the current phase
          example: false
        addonAvailable:
          type: boolean
          description: Whether addon is available in the current phase
          example: false
        rebuyPhaseType:
          type: integer
          description: |
            Type of rebuy phase: 1 = rebuy, 2 = addon.
            Only present when phase is 8 (Rebuy/Addon).
          enum: [1, 2]
        rebuyChips:
          type: integer
          description: Chips available for current rebuy
          minimum: 0
        rebuyMaxCount:
          type: integer
          description: Maximum rebuy count setting
          minimum: 0
        rebuyCounts:
          type: array
          description: Rebuy count per player (same order as players array)
          items:
            type: integer
            minimum: 0
        addonChips:
          type: integer
          description: Chips available for addon
          minimum: 0
        muckAvailable:
          type: boolean
          description: Whether the human player can muck (hide) their hand at showdown

    # -------------------------------------------------------------------------
    # Pai Gow Poker
    # -------------------------------------------------------------------------
    PaiGowRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command.  Accepted values: `reset` (`r`), `bet` (`b`),
            `set` (`s`), `log` (`l`).
          enum: [r, reset, b, bet, s, set, log, l]
          example: bet
        amount:
          type: integer
          description: |
            Bet amount.  Required for `bet` command (minimum 10, must be a
            multiple of 10).  Ignored for other commands.
          minimum: 10
          example: 100
        low0:
          type: integer
          description: |
            Index of the first card to place in the low hand (0-6).
            Required for the `set` command.
          minimum: 0
          maximum: 6
          example: 2
        low1:
          type: integer
          description: |
            Index of the second card to place in the low hand (0-6).
            Required for the `set` command.
          minimum: 0
          maximum: 6
          example: 5
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    PaiGowResponse:
      type: object
      description: Current state of the Pai Gow Poker game
      required:
        - playerCards
        - dealerCards
        - playerHighHand
        - playerLowHand
        - dealerHighHand
        - dealerLowHand
        - phase
        - chips
        - bet
        - result
        - highHandResult
        - lowHandResult
        - payout
        - commission
        - playerHighRank
        - playerLowRank
        - dealerHighRank
        - dealerLowRank
        - message
      properties:
        playerCards:
          type: array
          description: Player's 7 dealt cards
          items:
            $ref: '#/components/schemas/Card'
        dealerCards:
          type: array
          description: Dealer's 7 dealt cards (hidden until End phase)
          items:
            $ref: '#/components/schemas/Card'
        playerHighHand:
          type: array
          description: Player's 5-card high hand
          items:
            $ref: '#/components/schemas/Card'
        playerLowHand:
          type: array
          description: Player's 2-card low hand
          items:
            $ref: '#/components/schemas/Card'
        dealerHighHand:
          type: array
          description: Dealer's 5-card high hand
          items:
            $ref: '#/components/schemas/Card'
        dealerLowHand:
          type: array
          description: Dealer's 2-card low hand
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = Set, 3 = End"
          enum: [1, 2, 3]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 1000
        bet:
          type: integer
          description: Current bet amount
          example: 100
        result:
          type: integer
          description: "Overall game result: 1 = Player wins, -1 = Dealer wins, 0 = Push/not resolved"
          enum: [-1, 0, 1]
          example: 0
        highHandResult:
          type: integer
          description: "High hand comparison result: 1 = Player wins, -1 = Dealer wins, 0 = Tie"
          enum: [-1, 0, 1]
          example: 0
        lowHandResult:
          type: integer
          description: "Low hand comparison result: 1 = Player wins, -1 = Dealer wins, 0 = Tie"
          enum: [-1, 0, 1]
          example: 0
        payout:
          type: integer
          description: Payout for the current round (after commission)
          example: 0
        commission:
          type: integer
          description: Commission amount (5% of bet on player win)
          example: 0
        playerHighRank:
          type: string
          description: Player's high hand rank name (e.g. "Flush", "Two Pair")
          example: ""
        playerLowRank:
          type: string
          description: Player's low hand rank name (e.g. "Pair", "High Card")
          example: ""
        dealerHighRank:
          type: string
          description: Dealer's high hand rank name
          example: ""
        dealerLowRank:
          type: string
          description: Dealer's low hand rank name
          example: ""
        message:
          type: string
          description: Game result or error message. Empty during bet/set phase.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Let It Ride
    # -------------------------------------------------------------------------
    LetItRideRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command. Accepted values: `reset` (`r`), `bet` (`b`),
            `pull` (`p`), `letitride` (`l`), `log` (`lg`).
          enum: [r, reset, b, bet, p, pull, l, letitride, log, lg]
          example: bet
        amount:
          type: integer
          description: |
            Bet amount per spot. Required for `bet` command (minimum 10, must be
            a multiple of 10). The same amount is placed on all 3 spots.
            Ignored for other commands.
          minimum: 10
          example: 100
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    LetItRideResponse:
      type: object
      description: Current state of the Let It Ride game
      required:
        - playerHand
        - communityCards
        - phase
        - chips
        - betAmount
        - bet1Active
        - bet2Active
        - bet3Active
        - result
        - handRank
        - bet1Payout
        - bet2Payout
        - bet3Payout
        - totalPayout
        - message
      properties:
        playerHand:
          type: array
          description: Cards in the player's hand (3 cards)
          items:
            $ref: '#/components/schemas/Card'
        communityCards:
          type: array
          description: Community cards (2 cards; revealed progressively)
          items:
            $ref: '#/components/schemas/Card'
        phase:
          type: integer
          description: "Game phase: 1 = Bet, 2 = Decision1, 3 = Decision2, 4 = End"
          enum: [1, 2, 3, 4]
          example: 1
        chips:
          type: integer
          description: Current chip count
          example: 1000
        betAmount:
          type: integer
          description: Bet amount per spot
          example: 100
        bet1Active:
          type: boolean
          description: Whether Bet 1 is still active (can be pulled in the first decision phase)
          example: true
        bet2Active:
          type: boolean
          description: Whether Bet 2 is still active (can be pulled in the second decision phase)
          example: true
        bet3Active:
          type: boolean
          description: Whether Bet 3 is still active (always active, cannot be pulled)
          example: true
        result:
          type: integer
          description: "Game result: 1 = Player wins, -1 = Player loses, 0 = Not resolved"
          enum: [-1, 0, 1]
          example: 0
        handRank:
          type: integer
          description: Player's 5-card hand rank (0=High Card, 1=One Pair, 2=Two Pair, 3=Three of a Kind, 4=Straight, 5=Flush, 6=Full House, 7=Four of a Kind, 8=Straight Flush, 9=Royal Flush)
          example: 0
        bet1Payout:
          type: integer
          description: Payout from Bet 1 (0 if pulled)
          example: 0
        bet2Payout:
          type: integer
          description: Payout from Bet 2 (0 if pulled)
          example: 0
        bet3Payout:
          type: integer
          description: Payout from Bet 3
          example: 0
        totalPayout:
          type: integer
          description: Total payout for the current round (sum of all active bet payouts)
          example: 0
        message:
          type: string
          description: Game result or error message. Empty during bet/decision phase.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Poker Squares
    # -------------------------------------------------------------------------
    PokerSquaresRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: |
            Game command. Accepted values: `reset` (`r`), `place` (`p`),
            `undo` (`u`), `giveup` (`g`), `log` (`l`).
          enum: [r, reset, p, place, u, undo, g, giveup, log, l]
          example: place
        row:
          type: integer
          description: Row index (0-4) for the `place` command.
          minimum: 0
          maximum: 4
          example: 2
        col:
          type: integer
          description: Column index (0-4) for the `place` command.
          minimum: 0
          maximum: 4
          example: 3
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    PokerSquaresOutputCard:
      type: object
      description: A single cell in the 5x5 Poker Squares board (empty when `card` is null).
      properties:
        card:
          description: Card placed on this cell, or null if the cell is empty.
          $ref: '#/components/schemas/Card'

    PokerSquaresResponse:
      type: object
      description: Current state of the Poker Squares game
      required:
        - board
        - placedCount
        - phase
        - canUndo
        - rowScores
        - colScores
        - totalScore
        - message
      properties:
        board:
          type: array
          description: 5x5 grid of cells (row-major). Each cell contains the placed card or null.
          items:
            type: array
            items:
              $ref: '#/components/schemas/PokerSquaresOutputCard'
        currentCard:
          description: The current card that must be placed next. Omitted when the game is complete.
          $ref: '#/components/schemas/Card'
        placedCount:
          type: integer
          description: Number of cards already placed on the board (0-25).
          minimum: 0
          maximum: 25
          example: 0
        phase:
          type: integer
          description: "Game phase: 0 = Playing, 1 = Complete"
          enum: [0, 1]
          example: 0
        canUndo:
          type: boolean
          description: Whether the undo action is available
          example: false
        rowScores:
          type: array
          description: Score of each row (5 entries, one per row). Only rows with all 5 cards placed contribute to the total.
          items:
            type: integer
          example: [0, 0, 0, 0, 0]
        colScores:
          type: array
          description: Score of each column (5 entries, one per column). Only fully-filled columns contribute to the total.
          items:
            type: integer
          example: [0, 0, 0, 0, 0]
        totalScore:
          type: integer
          description: Sum of all 10 row + column hand scores (American scoring system).
          example: 0
        message:
          type: string
          description: Game result or status message. Empty while the game is in progress.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code corresponding to the message field.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template keyed by placeholder name.

    # -------------------------------------------------------------------------
    # Red Dog (レッドドッグ)
    # -------------------------------------------------------------------------
    RedDogRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          enum: [reset, r, bet, b, raise, stay, s, log]
          description: Game command to execute.
        amount:
          type: integer
          description: Bet or raise amount (required for `bet` and `raise` commands).
          example: 100
        sessionId:
          type: string
          description: Session identifier for game state persistence.

    RedDogResponse:
      type: object
      properties:
        initialCards:
          type: array
          description: The initial 2 dealt cards.
          items:
            $ref: '#/components/schemas/Card'
        thirdCard:
          description: Third card (present after raise/stay or pair resolution).
          oneOf:
            - $ref: '#/components/schemas/Card'
            - type: "null"
        phase:
          type: integer
          description: "Current game phase: 1=Bet, 2=InitialDealt, 3=SpreadDecision, 4=PairThird, 5=End."
          example: 1
        chips:
          type: integer
          description: Player's chip balance.
          example: 1000
        ante:
          type: integer
          description: Ante bet amount.
          example: 100
        raise:
          type: integer
          description: Raise amount (0 if not raised).
          example: 0
        spread:
          type: integer
          description: "Spread value (|rank2 - rank1| - 1). 0 for pairs and consecutive ranks."
          example: 4
        result:
          type: integer
          description: "Game result: 1=Win, 0=Draw/Push, -1=Lose."
          example: 0
        totalPayout:
          type: integer
          description: Total payout returned to the player.
          example: 0
        message:
          type: string
          description: Human-readable status or result message.
          example: ""
        messageCode:
          type: string
          description: Machine-readable message code for i18n.
        messageParams:
          type: object
          additionalProperties:
            type: string
          description: Interpolation parameters for the message template.

    PresidentRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: President command. Accepted values. `reset` (`r`), `play` (`p`), `log` (`l`).
          enum: [reset, r, play, p, log, l]
          example: reset
        indices:
          type: array
          description: Card indices to play (empty / omitted = pass). Used with `play`.
          items:
            type: integer
          example: [0, 1]
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            revolutionEnabled:
              type: boolean
            cardExchangeEnabled:
              type: boolean
            passFieldFlushEnabled:
              type: boolean
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    PresidentResponse:
      type: object
      description: Current state of the President (Scum) game
      properties:
        players:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              isHuman: { type: boolean }
              isFinished: { type: boolean }
              rank: { type: integer }
              cardCount: { type: integer }
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        currentTurn:
          type: integer
        tableCards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        lastPlayPlayerIdx:
          type: integer
        gameEndFlag:
          type: boolean
        revolutionActive:
          type: boolean
        config:
          type: object
          properties:
            revolutionEnabled: { type: boolean }
            cardExchangeEnabled: { type: boolean }
            passFieldFlushEnabled: { type: boolean }
            cpuDifficulty: { type: integer }
        exchangeActions:
          type: array
          items:
            type: object
            properties:
              fromPlayerIdx: { type: integer }
              toPlayerIdx: { type: integer }
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        cpuActions:
          type: array
          items:
            type: object
            properties:
              playerIdx: { type: integer }
              playedCards:
                type: array
                nullable: true
                items:
                  $ref: '#/components/schemas/Card'
        humanAction:
          type: object
          nullable: true
          properties:
            playerIdx: { type: integer }
            playedCards:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/Card'
        message:
          type: string
        messageCode:
          type: string
        messageParams:
          type: object
          additionalProperties:
            type: string

    CassinoRequest:
      type: object
      required:
        - command
        - sessionId
      properties:
        command:
          type: string
          description: Cassino command. Accepted values. `reset` (`r`), `take` (`t`), `build` (`b`), `trail` (`tr`), `next` (`n`), `log` (`l`).
          enum: [reset, r, take, t, build, b, trail, tr, next, n, log, l]
          example: take
        handIndex:
          type: integer
          description: Hand card index for take / build / trail.
          example: 0
        tableIndices:
          type: array
          description: Table card indices selected for take / build.
          items:
            type: integer
          example: [0, 1]
        buildIndices:
          type: array
          description: Build indices selected for take.
          items:
            type: integer
        declaredValue:
          type: integer
          description: Build declared value (2..10) when command is `build`.
          minimum: 2
          maximum: 10
        config:
          type: object
          description: Optional game configuration (only used with `reset`).
          properties:
            targetScore:
              type: integer
              minimum: 1
              maximum: 999
            multiBuildEnabled:
              type: boolean
            sweepBonusEnabled:
              type: boolean
            cpuDifficulty:
              type: integer
              minimum: 0
              maximum: 2
        sessionId:
          type: string
          description: Client-generated session identifier (max 256 characters)
          example: my-session-001

    CassinoResponse:
      type: object
      description: Current state of the Cassino game
      properties:
        players:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              isHuman: { type: boolean }
              cardCount: { type: integer }
              cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              capturedCount: { type: integer }
              sweepCount: { type: integer }
              totalScore: { type: integer }
        currentTurn:
          type: integer
        tableCards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        builds:
          type: array
          items:
            type: object
            properties:
              ownerIdx: { type: integer }
              value: { type: integer }
              groups:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Card'
              isMulti: { type: boolean }
        lastCaptureIdx:
          type: integer
        gameEndFlag:
          type: boolean
        phase:
          type: string
          description: Current game phase (`dealing`, `playerTurn`, `roundEnd`, `gameEnd`).
        config:
          type: object
          properties:
            targetScore: { type: integer }
            multiBuildEnabled: { type: boolean }
            sweepBonusEnabled: { type: boolean }
            cpuDifficulty: { type: integer }
        cpuActions:
          type: array
          items:
            type: object
            properties:
              playerIdx: { type: integer }
              type: { type: string }
              playedCard:
                nullable: true
                $ref: '#/components/schemas/Card'
              capturedCards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              buildValue: { type: integer }
              isSweep: { type: boolean }
        humanAction:
          type: object
          nullable: true
          properties:
            playerIdx: { type: integer }
            type: { type: string }
            playedCard:
              nullable: true
              $ref: '#/components/schemas/Card'
            capturedCards:
              type: array
              items:
                $ref: '#/components/schemas/Card'
            buildValue: { type: integer }
            isSweep: { type: boolean }
        remainingDeck:
          type: integer
        packsDealt:
          type: integer
        roundWinners:
          type: array
          items:
            type: integer
        lastRoundDetail:
          type: object
          nullable: true
          properties:
            cards:
              type: object
              additionalProperties:
                type: integer
            spades:
              type: object
              additionalProperties:
                type: integer
            aces:
              type: object
              additionalProperties:
                type: integer
            hasBigCasino: { type: integer }
            hasLittleCasino: { type: integer }
            sweeps:
              type: object
              additionalProperties:
                type: integer
            gained:
              type: object
              additionalProperties:
                type: integer
        message:
          type: string
        messageCode:
          type: string
        messageParams:
          type: object
          additionalProperties:
            type: string
