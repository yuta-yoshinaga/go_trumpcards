        | Playing   | 0     | Game in progress |
        | GameClear | 1     | All 4 suits removed |
        | GameOver  | 2     | Player gave up |

        | Command          | Aliases | Description |
        |------------------|---------|-------------|
        | `reset`          | `r`     | Start / restart a game |
        | `deal`           | `d`     | Deal 3 stock cards to columns 0-2 (requires no empty column) |
        | `move`           | `m`     | Move card(s) between tableau columns (requires `from`, `to`) |
        | `giveup`         | `g`     | Give up the current game |
        | `hint`           | `h`     | Get a move suggestion |
        | `autocomplete`   | `ac`    | Auto-remove completed suits when all cards are face-up |
        | `undo`           | `u`     | Undo last move |
        | `undo_n`         | —       | Undo N moves (requires `n`) |
        | `log`            | `l`     | View action log |
      operationId: scorpionExec
      requestBody:
