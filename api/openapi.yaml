      tags:
        - yukon
      summary: Execute a Yukon (ユーコン) game command
      description: |
        Send a command to advance a Yukon solitaire session identified by `sessionId`.
        Yukon is a Klondike variant with no stock/waste pile -- all 52 cards are dealt
        to 7 tableau columns. Cards can be moved in groups regardless of sequence order.
        Build foundations by suit Ace to King.

