                  command: reset
                  sessionId: my-session-001
              bidPass:
                summary: Pass during auction
                value:
                  command: bid
                  bidType: 0
                  sessionId: my-session-001
              bidNormal:
                summary: Bid 1 NoTrump
                value:
                  command: bid
                  bidType: 1
                  bidLevel: 1
                  bidSuit: 5
                  sessionId: my-session-001
              play:
                summary: Play card at index 2
                value:
                  command: play
                  cardIndex: 2
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeResponse'

  /pineapple/exec:
    post:
      tags:
        - pineapple
      summary: Execute a Pineapple Poker game command
      description: |
        Send a command to advance the Pineapple Poker (パイナップルポーカー) game
        session identified by `sessionId`.  Pineapple Poker is a Crazy Pineapple
        variant of Texas Hold'em where each player receives 3 hole cards and must
        discard 1 after the flop betting round.  Supports configurable table sizes:
        4-max (default), 6-max, or 9-max.

        The game proceeds through nine phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Init       | `0`   | Before any cards are dealt |
        | PreFlop    | `1`   | Three hole cards dealt; first betting round |
        | Discard    | `8`   | Each player discards 1 hole card (after flop is dealt) |
        | Flop       | `2`   | Three community cards revealed; betting round |
        | Turn       | `3`   | Fourth community card revealed; betting round |
        | River      | `4`   | Fifth community card revealed; betting round |
        | Showdown   | `5`   | Hands evaluated; winners determined |
        | End        | `6`   | Round complete; results displayed |
        | Rebuy      | `7`   | Rebuy/addon decision phase |

        | Command     | Aliases | Description |
        |-------------|---------|-------------|
        | `reset`     | `r`     | Start / restart a game |
        | `fold`      | `f`     | Fold and forfeit the pot |
        | `check`     | `ck`    | Pass without betting (only when no outstanding bet) |
        | `call`      | `c`     | Match the current bet |
        | `bet`       | `b`     | Place a bet (use `amount`) |
        | `raise`     | `ra`    | Raise by a specified amount on top of calling (use `amount`) |
        | `allin`     | `a`     | Go all-in with all remaining chips |
        | `discard`   | `d`     | Discard a hole card (use `cardIdx` during Discard phase) |
        | `rebuy`     | `rb`    | Buy back chips during rebuy period |
        | `skiprebuy` | `sr`    | Skip rebuy opportunity |
        | `addon`     | `ad`    | Add chips (one-time addon purchase) |
        | `skipaddon` | `sa`    | Skip addon opportunity |
        | `quit`      | `q`     | End the session |
      operationId: pineappleExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PineappleRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              resetCustomBlinds:
                summary: Start with custom blinds
                value:
                  command: reset
                  smallBlind: 10
                  bigBlind: 20
                  sessionId: my-session-001
              fold:
                summary: Fold
                value:
                  command: fold
                  sessionId: my-session-001
              call:
                summary: Call
                value:
                  command: call
                  sessionId: my-session-001
              bet:
                summary: Place a bet of 40
                value:
                  command: bet
                  amount: 40
                  sessionId: my-session-001
              discard:
                summary: Discard hole card at index 1
                value:
                  command: discard
                  cardIdx: 1
                  sessionId: my-session-001
              allin:
                summary: Go all-in
                value:
                  command: allin
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PineappleResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PineappleResponse'

  /speed/exec:
    post:
      tags:
        - speed
      summary: Execute a Speed (スピード) game command
      description: |
        Send a command to advance the Speed game session identified by
        `sessionId`.  Speed is a 2-player (1 human vs 1 CPU) real-time card
        game.  Players play cards ±1 rank onto two shared center piles.
        When both players are stuck, they flip new cards onto the center piles.
        First player to empty all cards wins.

        The game proceeds through three phases:

        | Phase    | Value | Description |
        |----------|-------|-------------|
        | Play     | `0`   | Players play cards onto center piles |
        | Stuck    | `1`   | Both players are stuck; flip new center cards |
        | GameEnd  | `2`   | A player has emptied all cards |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `play`  | `p`     | Play a card onto a center pile (requires `cardIndex` and `pileIndex`) |
        | `flip`  | `f`     | Flip new cards onto center piles (only in Stuck phase) |
        | `hint`  | `h`     | Get a hint for the next move |
        | `log`   | `l`     | View action log |
      operationId: speedExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeedRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              play:
                summary: Play card at hand index 2 onto center pile 0
                value:
                  command: play
                  cardIndex: 2
                  pileIndex: 0
                  sessionId: my-session-001
              flip:
                summary: Flip new center cards when stuck
                value:
                  command: flip
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeedResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeedResponse'

  /gofish/exec:
    post:
      tags:
        - gofish
      summary: Execute a Go Fish (ゴーフィッシュ) game command
      description: |
        Send a command to advance the Go Fish game session identified by
        `sessionId`.  Go Fish is a 4-player (1 human vs 3 CPU) card game.
        Players ask opponents for a specific rank; if the opponent holds it
        they surrender all matching cards, otherwise the asker draws from
        the stock pile ("Go Fish").  Collect all 4 cards of one rank to
        form a "book".  Most books wins.

        The game proceeds through two phases:

        | Phase    | Value | Description |
        |----------|-------|-------------|
        | Play     | `0`   | Players take turns asking for ranks |
        | GameEnd  | `1`   | All 13 books formed or stock exhausted |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `ask`   | `a`     | Ask an opponent for a rank (requires `target` and `rank`) |
        | `sd`    | —       | Set CPU difficulty (requires `amount`: 0=Easy/1=Normal/2=Hard) |
        | `log`   | `l`     | View action log |
      operationId: gofishExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoFishRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              ask:
                summary: Ask player 1 for rank 7
                value:
                  command: ask
                  target: 1
                  rank: 7
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoFishResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoFishResponse'

  /golf/exec:
    post:
      tags:
        - golf
      summary: Execute a Golf Solitaire game command
      description: |
        Send a command to advance the Golf Solitaire (ゴルフ) game session identified by
        `sessionId`.  Golf is a single-player solitaire card game using a
        standard 52-card deck.  Seven columns of five face-up cards (35 total) form
        the tableau.  Remove exposed cards (bottom-most per column) that are ±1 rank
        from the waste pile top card (K-A wrap).  Win by removing all 35 tableau cards.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All tableau cards removed; player wins |
        | GameOver   | `2`   | No more moves available; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset`        | `r`  | Start / restart a game |
        | `draw`         | `d`  | Draw a card from stock to waste |
        | `remove`       | `rm` | Remove an exposed card ±1 rank from waste top |
        | `giveup`       | `g`  | Give up the current game |
        | `hint`         | `h`  | Get a hint for the next move |
        | `undo`         | `u`  | Undo the last action |
        | `undo_n`       |      | Undo N actions (requires `n` parameter) |
        | `log`          | `l`  | View action log |
      operationId: golfExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, draw, d, remove, rm, giveup, g, hint, h, undo, u, undo_n, log, l]
                col:
                  type: integer
                  description: Column index (0-6) for remove command
                n:
                  type: integer
                  description: Number of undos to perform (required when command is undo_n)
                  example: 3
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw from stock
                value:
                  command: draw
                  sessionId: my-session-001
              remove:
                summary: Remove a tableau card
                value:
                  command: remove
                  col: 3
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout:
                    type: array
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          card:
                            $ref: '#/components/schemas/Card'
                          removed:
                            type: boolean
                          exposed:
                            type: boolean
                  stockCount:
                    type: integer
                  waste:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  phase:
                    type: integer
                  moveCount:
                    type: integer
                  canUndo:
                    type: boolean
                  isStalemate:
                    type: boolean
                  undoToEscape:
                    type: integer
                    description: Number of undos needed to reach a non-stalemate state (0 if not stalemate, -1 if no escape)
                    example: 0
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
                  hint:
                    type: object
                    properties:
                      type:
                        type: string
                      col:
                        type: integer
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  layout:
                    type: array
                    items:
                      type: array
                  stockCount:
                    type: integer
                  waste:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  phase:
                    type: integer
                  moveCount:
                    type: integer
                  message:
                    type: string

  /pigtail/exec:
    post:
      tags:
        - pigtail
      summary: Execute a Pig's Tail game command
      description: |
        Send a command to advance the Pig's Tail (ぶたのしっぽ) game session
        identified by `sessionId`.  Pig's Tail is a matching card game for 4
        players (1 human + 3 CPU) using a standard 52-card deck.  Cards are
        placed face-down in a circle pile.  Players take turns drawing 1 card
        and placing it face-up on the center pile.  If the drawn card's suit
        matches the center top card's suit, the player takes all center cards
        as a penalty.  When the circle pile is empty, the player with the most
        cards loses.

        The game proceeds through these phases:

        | Phase    | Value | Description |
        |----------|-------|-------------|
        | Play     | `0`   | Game in progress |
        | GameEnd  | `1`   | Circle pile empty; game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `draw`  | `d`     | Draw a card from the circle pile |
        | `log`   | `l`     | View action log |
      operationId: pigtailExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, draw, d, log, l]
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw a card from circle pile
                value:
                  command: draw
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        isHuman:
                          type: boolean
                        cardCount:
                          type: integer
                        cards:
                          type: array
                          items:
                            $ref: '#/components/schemas/Card'
                  circleCount:
                    type: integer
                    description: Remaining cards in the circle pile
                  centerTop:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                    description: Top card of the center pile (null if empty)
                  centerCount:
                    type: integer
                    description: Number of cards in the center pile
                  currentTurn:
                    type: integer
                  gameEndFlag:
                    type: boolean
                  loserIdx:
                    type: integer
                    description: Index of the losing player (-1 if game not ended)
                  lastDrawCard:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                  lastPenalty:
                    type: boolean
                    description: Whether the last draw triggered a suit-match penalty
                  cpuActions:
                    type: array
                    items:
                      type: object
                      properties:
                        drawPlayerIdx:
                          type: integer
                        drawnCard:
                          nullable: true
                          allOf:
                            - $ref: '#/components/schemas/Card'
                        penaltyFlag:
                          type: boolean
                        penaltyCount:
                          type: integer
                        hesitationMs:
                          type: integer
                  humanAction:
                    nullable: true
                    type: object
                    properties:
                      drawPlayerIdx:
                        type: integer
                      drawnCard:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/Card'
                      penaltyFlag:
                        type: boolean
                      penaltyCount:
                        type: integer
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                  circleCount:
                    type: integer
                  centerCount:
                    type: integer
                  gameEndFlag:
                    type: boolean
                  loserIdx:
                    type: integer
                  message:
                    type: string

  /sevencardstud/exec:
    post:
      tags:
        - sevencardstud
      summary: Execute a Seven Card Stud game command
      description: |
        Send a command to advance the Seven Card Stud game session identified by
        `sessionId`.  Seven Card Stud is a classic stud poker variant with no
        community cards.  Each player receives 2 face-down hole cards and 1
        face-up door card on Third Street, then 1 face-up card each on Fourth
        through Sixth Street, and 1 final face-down card on Seventh Street.
        Uses antes and bring-in (lowest door card) instead of blinds.  Betting
        order changes each street based on best visible hand (door cards).
        Best 5 out of 7 cards wins.

        The game supports configurable table sizes: 2-max through 7-max
        (default 4, i.e., 1 human + 3 CPU).

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Init       | `0`   | Before any cards are dealt |
        | ThirdSt    | `1`   | 2 hole cards + 1 door card; first betting round (bring-in) |
        | FourthSt   | `2`   | 4th card (face-up); betting round |
        | FifthSt    | `3`   | 5th card (face-up); betting round |
        | SixthSt    | `4`   | 6th card (face-up); betting round |
        | SeventhSt  | `5`   | 7th card (face-down); final betting round |
        | Showdown   | `6`   | Hands evaluated; winners determined |
        | End        | `7`   | Round complete; results displayed |
        | Rebuy      | `8`   | Rebuy/addon decision phase |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `fold`  | `f`     | Fold and forfeit the pot |
        | `check` | `ck`    | Pass without betting (only when no outstanding bet) |
        | `call`  | `c`     | Match the current bet |
        | `bet`   | `b`     | Place a bet (use `amount`) |
        | `raise` | `ra`    | Raise by a specified amount on top of calling (use `amount`) |
        | `allin` | `a`     | Go all-in with all remaining chips |
        | `rebuy` | `rb`    | Buy back chips during rebuy period |
        | `skiprebuy` | `sr` | Skip rebuy opportunity |
        | `addon` | `ad`    | Add chips (one-time addon purchase) |
        | `skipaddon` | `sa` | Skip addon opportunity |
        | `muck`  | `m`     | Muck (hide) hand at showdown |
        | `show`  | `sh`    | Show hand at showdown |
        | `log`   | `l`     | View action log |
        | `quit`  | `q`     | End the session |
      operationId: sevencardstudExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SevenCardStudRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              resetCustomAnte:
                summary: Start with custom ante and bring-in
                value:
                  command: reset
                  ante: 5
                  bringIn: 10
                  smallBet: 20
                  bigBet: 40
                  sessionId: my-session-001
              fold:
                summary: Fold
                value:
                  command: fold
                  sessionId: my-session-001
              call:
                summary: Call
                value:
                  command: call
                  sessionId: my-session-001
              bet:
                summary: Place a bet of 40
                value:
                  command: bet
                  amount: 40
                  sessionId: my-session-001
              raise:
                summary: Raise by 80
                value:
                  command: raise
                  amount: 80
                  sessionId: my-session-001
              allin:
                summary: Go all-in
                value:
                  command: allin
                  sessionId: my-session-001
              rebuy:
                summary: Accept rebuy
                value:
                  command: rebuy
                  sessionId: my-session-001
              skipaddon:
                summary: Skip addon
                value:
                  command: skipaddon
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevenCardStudResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SevenCardStudResponse'
              examples:
                paramError:
                  value:
                    players: []
                    pot: 0
                    sidePots: []
                    dealerIdx: 0
                    currentTurn: 0
                    phase: 0
                    gameEndFlag: false
                    lastBet: 0
                    minRaise: 0
                    roundResults: []
                    cpuActions: []
                    message: param error.


  /clocksolitaire/exec:
    post:
      tags:
        - clocksolitaire
      summary: Execute a Clock Solitaire game command
      description: |
        Send a command to advance the Clock Solitaire (クロックソリティア) game session identified by
        `sessionId`.  Clock Solitaire is a fully automatic single-player solitaire card game using a
        standard 52-card deck.  52 cards are dealt face-down into 13 piles of 4 cards: 12 piles placed
        at clock positions 1-12 and 1 pile in the center (King position).  One card at a time is flipped
        face-up and placed at the bottom of the pile matching its rank.  The game clears when all cards
        are face-up before the 4th King is placed; the game is over when the 4th King is turned while
        face-down cards remain.

        The game proceeds through these phases:

        | Phase      | Value | Description |
        |------------|-------|-------------|
        | Playing    | `0`   | Game in progress |
        | GameClear  | `1`   | All cards are face-up; player wins |
        | GameOver   | `2`   | 4th King turned while face-down cards remain |

        | Command    | Aliases | Description |
        |------------|---------|-------------|
        | `reset`    | `r`     | Start / restart a game |
        | `step`     | `s`     | Flip and place one card |
        | `autoplay` | `a`     | Play all remaining cards to completion |
        | `log`      | `l`     | View action log |
      operationId: clocksolitaireExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, step, s, autoplay, a, log, l]
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              step:
                summary: Flip and place one card
                value:
                  command: step
                  sessionId: my-session-001
              autoplay:
                summary: Play all remaining cards to completion
                value:
                  command: autoplay
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  piles:
                    type: array
                    description: |
                      13 piles indexed 0-12 (index 0 = position 1, index 11 = position 12, index 12 = center/King).
                      Each pile is an array of card objects.
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          card:
                            $ref: '#/components/schemas/Card'
                          faceUp:
                            type: boolean
                  faceUpCount:
                    type: integer
                    description: Total number of face-up cards across all piles
                  phase:
                    type: integer
                    description: "0=Playing, 1=GameClear, 2=GameOver"
                  stepCount:
                    type: integer
                    description: Number of cards flipped so far
                  currentCard:
                    description: The card most recently flipped (null before first step)
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  piles:
                    type: array
                    items:
                      type: array
                  faceUpCount:
                    type: integer
                  phase:
                    type: integer
                  stepCount:
                    type: integer
                  message:
                    type: string

  /durak/exec:
    post:
      tags:
        - durak
      summary: Execute a Durak game command
      description: |
        Send a command to advance the Durak (ドゥラーク) game session
        identified by `sessionId`.  Durak is a popular Eastern European card
        game for 2-6 players (1 human + 1-5 CPU) using a 36-card deck (6-A).
        Players take turns attacking and defending.  The attacker plays cards
        and the defender must beat each with a higher card of the same suit or
        a trump card.  The last player with cards is the loser ("durak" = fool).

        The game proceeds through these phases:

        | Phase    | Value | Description |
        |----------|-------|-------------|
        | Attack   | `0`   | Attacker plays cards |
        | Defend   | `1`   | Defender beats attacking cards |
        | BoutEnd  | `2`   | Bout resolved (cards discarded or picked up) |
        | GameEnd  | `3`   | Game over; loser determined |

        | Command  | Aliases | Description |
        |----------|---------|-------------|
        | `reset`  | `r`     | Start / restart a game |
        | `attack` | `a`     | Play a card to attack |
        | `defend` | `d`     | Play a card to defend against an attack |
        | `pickup` | `p`     | Defender picks up all table cards |
        | `done`   | `dn`    | Attacker ends the attack |
        | `pass`   | `ps`    | Pass the attack to the next player |
        | `log`    | `l`     | View action log |
      operationId: durakExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, attack, a, defend, d, pickup, p, done, dn, pass, ps, log, l]
                cardIndex:
                  type: integer
                  description: Index of the card to play (for attack/defend commands)
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              attack:
                summary: Attack with a card
                value:
                  command: attack
                  cardIndex: 0
                  sessionId: my-session-001
              defend:
                summary: Defend against an attack
                value:
                  command: defend
                  cardIndex: 2
                  sessionId: my-session-001
              pickup:
                summary: Pick up all table cards
                value:
                  command: pickup
                  sessionId: my-session-001
              done:
                summary: End the attack
                value:
                  command: done
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        isHuman:
                          type: boolean
                        cardCount:
                          type: integer
                        cards:
                          type: array
                          items:
                            $ref: '#/components/schemas/Card'
                  tableAttack:
                    type: array
                    description: Cards played by the attacker on the table
                    items:
                      $ref: '#/components/schemas/Card'
                  tableDefense:
                    type: array
                    description: Cards played by the defender on the table
                    items:
                      nullable: true
                      allOf:
                        - $ref: '#/components/schemas/Card'
                  trumpCard:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                    description: The trump card (bottom of the deck)
                  trumpSuit:
                    type: integer
                    description: Trump suit (0=spade, 1=heart, 2=diamond, 3=club)
                  deckCount:
                    type: integer
                    description: Remaining cards in the deck
                  attackerIdx:
                    type: integer
                  defenderIdx:
                    type: integer
                  currentTurn:
                    type: integer
                  phase:
                    type: integer
                    description: "0=Attack, 1=Defend, 2=BoutEnd, 3=GameEnd"
                  gameEndFlag:
                    type: boolean
                  loserIdx:
                    type: integer
                    description: Index of the losing player (-1 if game not ended)
                  cpuActions:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: array
                  phase:
                    type: integer
                  message:
                    type: string

  /fortythieves/exec:
    post:
      tags:
        - fortythieves
      summary: Execute a Forty Thieves game command
      description: |
        Send a command to advance the Forty Thieves (フォーティシーブス) game
        session identified by `sessionId`.  Forty Thieves is a single-player
        solitaire card game using 2 standard decks (104 cards).  10 tableau
        columns with 4 face-up cards each, 8 foundation piles (A→K, same suit),
        same-suit descending tableau moves, single card moves only, and no
        stock recycling.

        The game proceeds through these phases:

        | Phase     | Value | Description |
        |-----------|-------|-------------|
        | Playing   | `0`   | Game in progress |
        | GameClear | `1`   | All foundations complete |
        | GameOver  | `2`   | No more moves available |

        | Command        | Aliases | Description |
        |----------------|---------|-------------|
        | `reset`        | `r`     | Start / restart a game |
        | `draw`         | `d`     | Draw a card from the stock to the waste |
        | `move`         | `m`     | Move a card between tableau/waste/foundation |
        | `undo`         | `u`     | Undo the last action |
        | `giveup`       | `g`     | Give up the current game |
        | `hint`         | `h`     | Show a hint for the next move |
        | `autocomplete` | `ac`    | Auto-move cards to foundations |
        | `log`          | `l`     | View action log |
      operationId: fortyThievesExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, draw, d, move, m, undo, u, undo_n, giveup, g, hint, h, autocomplete, ac, log, l]
                from:
                  $ref: '#/components/schemas/FortyThievesMoveZone'
                to:
                  $ref: '#/components/schemas/FortyThievesMoveZone'
                n:
                  type: integer
                  description: Number of times to undo (for undo_n command)
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              draw:
                summary: Draw a card from the stock
                value:
                  command: draw
                  sessionId: my-session-001
              move:
                summary: Move a card from waste to tableau column 0
                value:
                  command: move
                  from:
                    zone: waste
                  to:
                    zone: tableau
                    col: 0
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tableau:
                    type: array
                    description: 10 tableau columns, each an array of face-up cards
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Card'
                  foundations:
                    type: array
                    description: 8 foundation piles (top card of each)
                    items:
                      nullable: true
                      allOf:
                        - $ref: '#/components/schemas/Card'
                  waste:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                    description: Top card of the waste pile
                  stockCount:
                    type: integer
                    description: Number of remaining cards in the stock
                  moveCount:
                    type: integer
                  phase:
                    type: integer
                    description: "0=Playing, 1=GameClear, 2=GameOver"
                  message:
                    type: string
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tableau:
                    type: array
                    items:
                      type: array
                  phase:
                    type: integer
                  message:
                    type: string

  /paigow/exec:
    post:
      tags:
        - paigow
      summary: Execute a Pai Gow Poker game command
      description: |
        Send a command to advance the Pai Gow Poker (パイゴウポーカー) game session
        identified by `sessionId`.  Pai Gow Poker is a single-player casino card game
        using a 53-card deck (standard 52 + 1 joker).  Player and dealer each receive
        7 cards.  Player splits cards into a 5-card high hand and 2-card low hand.
        Both hands are compared against the dealer's hands.

        The joker can be used as an ace or to complete a straight, flush, or straight
        flush.  The high hand must outrank the low hand.  Player wins both hands to win
        (1:1 minus 5% commission), loses both to lose, or pushes on a split.  Ties
        (copy hands) go to the dealer.

        The game proceeds through these phases:

        | Phase | Value | Description |
        |-------|-------|-------------|
        | Bet   | `1`   | Place a bet |
        | Set   | `2`   | Arrange 7 cards into high hand (5) and low hand (2) |
        | End   | `3`   | Round complete; shows result and payout |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game |
        | `bet`   | `b`     | Place bet (requires `amount`) |
        | `set`   | `s`     | Set low hand cards (requires `low0`, `low1` as card indices) |
        | `log`   | `l`     | View action log |
      operationId: paigowExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiGowRequest'
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              bet:
                summary: Bet 100 chips
                value:
                  command: bet
                  amount: 100
                  sessionId: my-session-001
              set:
                summary: Set low hand (card indices 2 and 5)
                value:
                  command: set
                  low0: 2
                  low1: 5
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiGowResponse'
        '400':
          description: Bad request (unsupported command, missing/invalid parameters, or session error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiGowResponse'
              examples:
                paramError:
                  value:
                    playerCards: []
                    dealerCards: []
                    playerHighHand: []
                    playerLowHand: []
                    dealerHighHand: []
                    dealerLowHand: []
                    phase: 0
                    chips: 0
                    bet: 0
                    result: 0
                    message: "unsupported command"

  /war/exec:
    post:
      tags:
        - war
      summary: Execute a War (戦争) game command
      description: |
        Send a command to advance the War (戦争) game session identified by
        `sessionId`.  War is a two-player matching card game for a human vs
        CPU, played with a standard 52-card deck split evenly (26 cards each,
        face-down).  Each round both players reveal the top card of their
        draw pile; the higher rank (Ace high) wins both cards into the
        winner's discard pile.  On a tie, "war" is triggered: each player
        buries up to 3 cards face-down and reveals a new face-up card, with
        the higher face-up winning the entire pot.  Wars can chain if the
        new face-ups also tie.  When a draw pile empties, the discard pile
        is shuffled and reused.

        The game proceeds through these phases:

        | Phase    | Value | Description |
        |----------|-------|-------------|
        | Reveal   | `0`   | Ready to flip the next pair of cards |
        | Resolved | `1`   | Round decided; next step awards the pot |
        | WarBury  | `2`   | Tie triggered; next step buries face-down and reveals new face-ups |
        | GameEnd  | `3`   | Game over |

        | Command | Aliases | Description |
        |---------|---------|-------------|
        | `reset` | `r`     | Start / restart a game (optional `maxRounds` 10-10000) |
        | `step`  | `s`     | Advance one step of the state machine |
        | `log`   | `l`     | View action log |
      operationId: warExec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - command
                - sessionId
              properties:
                command:
                  type: string
                  enum: [reset, r, step, s, log, l]
                maxRounds:
                  type: integer
                  description: Round cap (10-10000). Used only with reset.
                sessionId:
                  type: string
            examples:
              reset:
                summary: Start a new game
                value:
                  command: reset
                  sessionId: my-session-001
              step:
                summary: Flip next card / resolve round / resolve war
                value:
                  command: step
                  sessionId: my-session-001
      responses:
        '200':
          description: Command processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        isHuman:
                          type: boolean
                        drawPileSize:
                          type: integer
                        discardPileSize:
                          type: integer
                        totalCards:
                          type: integer
                  phase:
                    type: integer
                  gameEndFlag:
                    type: boolean
                  winnerIdx:
                    type: integer
                  playerRevealed:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                  cpuRevealed:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Card'
                  warPotSize:
                    type: integer
                  lastWinnerIdx:
                    type: integer
                  lastBurialCount:
                    type: integer
                  roundsPlayed:
                    type: integer
                  config:
                    type: object
                    properties:
                      maxRounds:
                        type: integer
                  message:
                    type: string
                  messageCode:
                    type: string
                  messageParams:
                    type: object
        '400':
          description: Bad request (unsupported command, invalid parameters, or session error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      type: object
                  phase:
                    type: integer
                  gameEndFlag:
                    type: boolean
                  message:
                    type: string

  /canfield/exec:
