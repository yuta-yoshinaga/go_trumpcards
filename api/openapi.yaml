        | GameClear | 1     | All foundations complete |
        | GameOver  | 2     | Player gave up or stalemate |

        | Command          | Aliases | Description |
        |------------------|---------|-------------|
        | `reset`          | `r`     | Start / restart a game |
        | `move`           | `m`     | Move card(s) between zones (requires `from`, `to`) |
        | `giveup`         | `g`     | Give up the current game |
        | `hint`           | `h`     | Get a move suggestion |
        | `autocomplete`   | `ac`    | Auto-complete to foundations |
        | `undo`           | `u`     | Undo last move |
        | `undo_n`         | —       | Undo N moves (requires `n`) |
        | `log`            | `l`     | View action log |
      operationId: yukonExec
      requestBody:
