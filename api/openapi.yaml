        `sessionId`.  Joker Poker is a Video Poker variant using a 53-card deck
        (standard 52 + 1 joker).  The joker acts as a wild card.  The player
        bets 1-5 coins, receives 5 cards, chooses which cards to hold, then
        draws replacements.  The final hand is evaluated using wild card
        substitution and paid according to the Joker Poker pay table.

        The game proceeds through these phases:

        | Phase   | Value | Description |
        |---------|-------|-------------|
