<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Old Maid (ババ抜き)</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="./css/bootstrap-theme.min.css" rel="stylesheet" media="screen">
    <link href="./css/style.css" rel="stylesheet" media="screen">
    <link href="./css/theme/Darkly/bootstrap.min.css" rel="stylesheet" media="screen">
    <link rel="apple-touch-icon" href="./images/favicon.ico">
    <link rel="SHORTCUT ICON" href="./images/favicon.ico">
    <style>
        .oldmaid-table {
            background-color: #1a5c1a;
            border-radius: 16px;
            padding: 18px;
            margin: 10px auto;
            max-width: 960px;
        }

        /* CPU row: 3 players side by side */
        .cpu-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .player-area {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            flex: 1;
            min-width: 0;
            transition: box-shadow 0.2s, border 0.2s;
            border: 2px solid transparent;
        }

        /* Highlight the player the human will draw from */
        .player-area.draw-target {
            border-color: #f0ad4e;
            box-shadow: 0 0 12px rgba(240, 173, 78, 0.7);
        }

        .player-area.finished-area {
            opacity: 0.5;
        }

        .player-label {
            color: #fff;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .finished-badge {
            background: #5cb85c;
            color: #fff;
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .draw-target-badge {
            background: #f0ad4e;
            color: #222;
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .card-count-label {
            color: #cfc;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .cards-row img {
            width: 52px;
            border-radius: 4px;
        }

        .card-count-extra {
            color: #ccc;
            font-size: 0.9em;
            align-self: center;
        }

        /* Human area: full width at the bottom */
        .human-area {
            margin-top: 12px;
        }

        .human-area .cards-row img {
            width: 68px;
            border-radius: 5px;
        }

        .section-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 12px 0;
        }

        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            color: #cfc;
            padding: 8px 14px;
            font-size: 0.95em;
            margin: 10px 0 4px;
            min-height: 36px;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.55);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            padding: 10px 20px;
            font-size: 1.3em;
            font-weight: bold;
            margin: 6px 0 10px;
            min-height: 46px;
        }

        .btn_field {
            text-align: center;
            margin: 10px 0 4px;
        }

        .btn_field button {
            margin: 0 8px;
            min-width: 100px;
        }

        .nav-link-area {
            text-align: right;
            margin: 8px 10px;
        }
    </style>
</head>

<body>
    <div class="nav-link-area">
        <a href="./index.html" class="btn btn-default btn-xs">← ブラックジャックへ</a>
        <a href="./poker.html" class="btn btn-default btn-xs">ポーカーへ →</a>
    </div>

    <div class="oldmaid-table">

        <!-- CPU row (3 CPUs side by side) -->
        <div class="cpu-row">
            <div class="player-area" id="player-area-1">
                <div class="player-label" id="label-1">CPU 1</div>
                <div class="card-count-label" id="count-1"></div>
                <div class="cards-row" id="cards-1"></div>
            </div>
            <div class="player-area" id="player-area-2">
                <div class="player-label" id="label-2">CPU 2</div>
                <div class="card-count-label" id="count-2"></div>
                <div class="cards-row" id="cards-2"></div>
            </div>
            <div class="player-area" id="player-area-3">
                <div class="player-label" id="label-3">CPU 3</div>
                <div class="card-count-label" id="count-3"></div>
                <div class="cards-row" id="cards-3"></div>
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- Human area -->
        <div class="player-area human-area" id="player-area-0">
            <div class="player-label" id="label-0">あなた</div>
            <div class="card-count-label" id="count-0"></div>
            <div class="cards-row" id="cards-0"></div>
        </div>

        <!-- Status & Result -->
        <div class="status-box" id="status-box"></div>
        <div class="result-box" id="result-box"></div>

        <!-- Buttons -->
        <div class="btn_field">
            <button type="button" class="btn btn-primary btn-sm" id="btn-reset">リセット</button>
            <button type="button" class="btn btn-warning btn-sm" id="btn-draw" disabled>引く</button>
        </div>
    </div>

    <script src="./js/jquery-1.12.4.min.js "></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/oldmaid.js"></script>
</body>

</html>
