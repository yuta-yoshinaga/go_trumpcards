<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Poker</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet" media="screen">
    <link href="./css/bootstrap-theme.min.css" rel="stylesheet" media="screen">
    <link href="./css/style.css" rel="stylesheet" media="screen">
    <link href="./css/theme/Darkly/bootstrap.min.css" rel="stylesheet" media="screen">
    <link rel="apple-touch-icon" href="./images/favicon.ico">
    <link rel="SHORTCUT ICON" href="./images/favicon.ico">
    <style>
        .poker-table {
            background-color: #1a6b1a;
            border-radius: 16px;
            padding: 20px;
            margin: 10px auto;
            max-width: 900px;
        }
        .hand-label {
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 6px;
        }
        .hand-name-badge {
            display: inline-block;
            background: #f0ad4e;
            color: #222;
            font-weight: bold;
            border-radius: 8px;
            padding: 2px 12px;
            margin-left: 8px;
            font-size: 0.95em;
        }
        .cards-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .card-wrap {
            position: relative;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .card-wrap img {
            width: 80px;
            border-radius: 6px;
            border: 3px solid transparent;
            display: block;
        }
        .card-wrap.selected img {
            border-color: #f0ad4e;
            transform: translateY(-12px);
        }
        .card-wrap .select-label {
            display: none;
            text-align: center;
            color: #f0ad4e;
            font-size: 0.75em;
            font-weight: bold;
        }
        .card-wrap.selected .select-label {
            display: block;
        }
        .dealer-card-wrap img {
            width: 80px;
            border-radius: 6px;
        }
        .result-box {
            background: rgba(0,0,0,0.55);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            padding: 12px 20px;
            font-size: 1.3em;
            font-weight: bold;
            margin: 10px 0;
            min-height: 48px;
        }
        .btn_field {
            text-align: center;
            margin: 14px 0 4px 0;
        }
        .btn_field button {
            margin: 0 6px;
            min-width: 90px;
        }
        .nav-link-area {
            text-align: right;
            margin: 8px 10px;
        }
        .phase-hint {
            color: #cfc;
            font-size: 0.9em;
            margin-bottom: 4px;
        }
        .section-divider {
            border-top: 1px solid rgba(255,255,255,0.2);
            margin: 14px 0;
        }
    </style>
</head>

<body>
    <div class="nav-link-area">
        <a href="./index.html" class="btn btn-default btn-xs">← ブラックジャックへ</a>
        <a href="./oldmaid.html" class="btn btn-default btn-xs">ババ抜きへ →</a>
    </div>

    <div class="poker-table">
        <!-- ディーラーエリア -->
        <div id="dealer-area">
            <div class="hand-label">ディーラー手札 <span id="dealer-hand-name" class="hand-name-badge" style="display:none;"></span></div>
            <div class="cards-row" id="dealer-cards"></div>
        </div>

        <div class="section-divider"></div>

        <!-- プレイヤーエリア -->
        <div id="player-area">
            <div class="hand-label">プレイヤー手札 <span id="player-hand-name" class="hand-name-badge" style="display:none;"></span></div>
            <div class="phase-hint" id="phase-hint"></div>
            <div class="cards-row" id="player-cards"></div>
        </div>

        <!-- 結果表示 -->
        <div class="result-box" id="result-box"></div>

        <!-- ボタン -->
        <div class="btn_field">
            <button type="button" class="btn btn-primary btn-sm" id="btn-reset">リセット</button>
            <button type="button" class="btn btn-warning btn-sm" id="btn-exchange" disabled>交換</button>
            <button type="button" class="btn btn-success btn-sm" id="btn-stand" disabled>スタンド</button>
        </div>
    </div>

    <script src="./js/jquery-1.12.4.min.js "></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/poker.js"></script>
</body>

</html>
